---
# Lab-only overrides cho inventory ha-icinga5-director.
# Proxy endpoint is intentionally not committed; keep it in
# /etc/icinga-ansible/globals.yml (preferably encrypted with Ansible Vault).
proxy_no_proxy: "localhost,127.0.0.1,::1,172.28.82.0/24"

enable_icingaweb2_modules:
  - icingadb
  - director

# Cài bộ plugin CPU/RAM/disk trên host đích để Director gọi qua check_by_ssh.
enable_check_by_ssh_target_plugins: true

# Các object này được lưu trong Director DB, không render vào hosts.conf tĩnh.
director_managed_hosts:
  - { name: "icinga5-master1", address: "172.28.82.170", display_name: "Icinga master 1", vars: { monitor_linuxfabrik: true } }
  - { name: "icinga5-master2", address: "172.28.82.171", display_name: "Icinga master 2", vars: { monitor_linuxfabrik: true } }
  - { name: "icinga5-db1", address: "172.28.82.172", display_name: "Galera DB 1", vars: { monitor_linuxfabrik: true } }
  - { name: "icinga5-db2", address: "172.28.82.173", display_name: "Galera DB 2", vars: { monitor_linuxfabrik: true } }
  - { name: "icinga5-db3", address: "172.28.82.174", display_name: "Galera DB 3", vars: { monitor_linuxfabrik: true } }

director_managed_service_apply_rules:
  - { name: "CPU", check_command: "by_ssh_lfmp_cpu", assign_filter: "host.vars.monitor_linuxfabrik=true" }
  - { name: "RAM", check_command: "by_ssh_lfmp_memory", assign_filter: "host.vars.monitor_linuxfabrik=true" }
  - { name: "Disk", check_command: "by_ssh_lfmp_disk", assign_filter: "host.vars.monitor_linuxfabrik=true" }

director_managed_direct_services_absent: [CPU, RAM, Disk]
