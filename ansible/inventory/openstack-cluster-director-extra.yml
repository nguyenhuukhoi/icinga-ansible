---
# Director objects for an OpenStack cluster monitored with Linuxfabrik plugins
# through a restricted check_by_ssh account. Addresses are the current lab
# example; adjust names and addresses for another environment.
enable_icingaweb2_modules:
  - icingadb
  - director

director_managed_hosts:
  - { name: "openstack-controller01", address: "172.28.81.101", display_name: "OpenStack Controller 01", check_command: "tcp", vars: { tcp_port: 22, monitor_linuxfabrik: true } }
  - { name: "openstack-controller02", address: "172.28.81.102", display_name: "OpenStack Controller 02", check_command: "tcp", vars: { tcp_port: 22, monitor_linuxfabrik: true } }
  - { name: "openstack-controller03", address: "172.28.81.103", display_name: "OpenStack Controller 03", check_command: "tcp", vars: { tcp_port: 22, monitor_linuxfabrik: true } }
  - { name: "openstack-compute01", address: "172.28.81.104", display_name: "OpenStack Compute 01", check_command: "tcp", vars: { tcp_port: 22, monitor_linuxfabrik: true } }
  - { name: "openstack-compute02", address: "172.28.81.105", display_name: "OpenStack Compute 02", check_command: "tcp", vars: { tcp_port: 22, monitor_linuxfabrik: true } }
  - { name: "openstack-compute03", address: "172.28.81.106", display_name: "OpenStack Compute 03", check_command: "tcp", vars: { tcp_port: 22, monitor_linuxfabrik: true } }

# Director creates one Service Apply Rule per check. Every host carrying
# vars.monitor_linuxfabrik=true receives CPU, RAM and Disk automatically.
director_managed_service_apply_rules:
  - name: "CPU"
    check_command: "by_ssh_lfmp_cpu"
    assign_filter: "host.vars.monitor_linuxfabrik=true"
    vars: { ssh_user: "icinga-monitor", lfmp_cpu_warn: 80, lfmp_cpu_crit: 90 }
  - name: "RAM"
    check_command: "by_ssh_lfmp_memory"
    assign_filter: "host.vars.monitor_linuxfabrik=true"
    vars: { ssh_user: "icinga-monitor", lfmp_memory_warn: 90, lfmp_memory_crit: 95 }
  - name: "Disk"
    check_command: "by_ssh_lfmp_disk"
    assign_filter: "host.vars.monitor_linuxfabrik=true"
    vars: { ssh_user: "icinga-monitor", lfmp_disk_warn: 90, lfmp_disk_crit: 95 }

# One-time/idempotent migration: remove the old per-host Service objects after
# the Apply Rules have been stored. Keeping this list is safe on later runs.
director_managed_direct_services_absent: [CPU, RAM, Disk]

# Inventory (không phải globals.yml) cần thêm:
# [linuxfabrik_targets:vars]
# ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
