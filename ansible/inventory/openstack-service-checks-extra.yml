---
# Static Icinga objects for OpenStack API service status. This file does not use Director and can
# be combined with openstack-cluster-director-extra.yml, where Director manages only node-level
# CPU/RAM/Disk checks.
#
# Required on the deployment node:
#   /etc/icinga-ansible/config/icinga2/openstack/clouds.yaml
# The profile under `clouds:` must match the `cloud` value below.
openstack_service_checks:
  - name: "openstack-production"
    display_name: "OpenStack Production"
    cloud: "production"
    services: [nova, neutron, cinder]
    check_interval: 60
    retry_interval: 30
    max_check_attempts: 3
