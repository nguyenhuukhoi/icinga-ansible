---
# Tạo credential monitoring RIÊNG trên deployment node, cấp public key cho host đích và pin SSH
# host keys. Không tái sử dụng key quản trị Ansible cho runtime checks.
- name: Prepare check_by_ssh trust
  # linuxfabrik_targets is intentionally outside all_hosts: deploy/upgrade must not
  # install or manage the Icinga stack on the OpenStack nodes being monitored.
  hosts: all_hosts:linuxfabrik_targets
  become: true
  gather_facts: false
  # Playbook nằm trong ansible/playbooks/ (không cùng cấp ansible/group_vars/) nên Ansible KHÔNG tự
  # nạp group_vars/all.yml (bug class đã ghi ở TODO.md 2.5) — thiếu dòng này, "deploy_config_dir"
  # dưới đây chỉ có giá trị nhờ tools/icinga-ansible LUÔN truyền "-e deploy_config_dir=..."; chạy
  # trực tiếp bằng ansible-playbook (bỏ qua CLI wrapper) sẽ ra lỗi "deploy_config_dir is undefined".
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    monitor_key_dir: "{{ deploy_config_dir }}/icinga2/ssh"
    monitor_private_key: "{{ monitor_key_dir }}/id_monitor"
    monitor_restricted_user: "icinga-monitor"
    monitor_allowed_sources: >-
      {{ groups['master'] | default([])
         | map('extract', hostvars, 'ansible_host') | join(',') }}
  pre_tasks:
    - name: Tạo thư mục credential check_by_ssh trên deployment node
      ansible.builtin.file:
        path: "{{ monitor_key_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Tạo key Ed25519 riêng cho check_by_ssh nếu chưa có
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - icinga-check-by-ssh
          - -f
          - "{{ monitor_private_key }}"
        creates: "{{ monitor_private_key }}"
      delegate_to: localhost
      become: false
      run_once: true

    # Private key có thể được restore/copy từ backup mà không kèm file .pub. `ssh-keygen`
    # phía trên dùng creates nên sẽ không chạy trong trường hợp đó; tự dẫn xuất public key
    # để prepare-check-by-ssh vẫn idempotent sau restore.
    - name: Kiểm tra public key monitoring đã tồn tại
      ansible.builtin.stat:
        path: "{{ monitor_private_key }}.pub"
      register: monitor_public_key_stat
      delegate_to: localhost
      become: false
      run_once: true

    - name: Dẫn xuất public key từ private key đã restore
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -f, "{{ monitor_private_key }}"]
      register: monitor_public_key_derived
      changed_when: true
      when: not monitor_public_key_stat.stat.exists
      delegate_to: localhost
      become: false
      run_once: true

    - name: Ghi public key được dẫn xuất
      ansible.builtin.copy:
        dest: "{{ monitor_private_key }}.pub"
        content: "{{ monitor_public_key_derived.stdout }} icinga-check-by-ssh{{ '\n' }}"
        mode: "0644"
      when: not monitor_public_key_stat.stat.exists
      delegate_to: localhost
      become: false
      run_once: true

    - name: Đọc public key monitoring từ deployment node
      ansible.builtin.slurp:
        src: "{{ monitor_private_key }}.pub"
      register: monitor_public_key_file
      delegate_to: localhost
      become: false
      run_once: true

    # Quét trước khi Ansible mở kết nối quản trị tới target. Nhờ vậy known_hosts
    # runtime vẫn đầy đủ và không bị ghi thiếu nếu một target lỗi ở task sau.
    - name: Quét SSH host key từ deployment node
      ansible.builtin.command:
        # Không dùng -H: hash known_hosts có salt ngẫu nhiên, làm file đổi ở mọi
        # lần chạy dù host key không đổi và kéo theo recreate container vô ích.
        # Chỉ pin Ed25519 để mỗi host có đúng một dòng ổn định; thứ tự nhiều
        # thuật toán do ssh-keyscan trả về có thể thay đổi giữa các lần chạy.
        argv: [ssh-keyscan, -T, "10", -t, ed25519, "{{ ansible_host }}"]
      register: monitor_host_key
      changed_when: false
      delegate_to: localhost
      become: false

  tasks:
    - name: Thu thập distribution facts tối thiểu trên Linuxfabrik target ngoài cụm
      ansible.builtin.setup:
        # env cho phép proxy_environment dùng proxy đã khai trong /etc/environment,
        # cùng hành vi với bootstrap-servers.
        gather_subset: [distribution, env]
      when: inventory_hostname in (groups['linuxfabrik_targets'] | default([]))

    - name: Kiểm tra Linuxfabrik package đã được cài chưa
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Status}', linuxfabrik-monitoring-plugins]
      register: linuxfabrik_package_status
      changed_when: false
      failed_when: false
      when: inventory_hostname in (groups['linuxfabrik_targets'] | default([]))

    - name: Tạo keyring directory trên Linuxfabrik target ngoài cụm
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when:
        - inventory_hostname in (groups['linuxfabrik_targets'] | default([]))
        - linuxfabrik_package_status.rc != 0

    - name: Tải signing key của Linuxfabrik
      ansible.builtin.get_url:
        url: https://repo.linuxfabrik.ch/linuxfabrik.key
        dest: /etc/apt/keyrings/linuxfabrik.asc
        mode: "0644"
      environment: "{{ proxy_environment | default({}) }}"
      when:
        - inventory_hostname in (groups['linuxfabrik_targets'] | default([]))
        - linuxfabrik_package_status.rc != 0

    - name: Khai báo Linuxfabrik repository trên Ubuntu target
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/linuxfabrik.asc]
          https://repo.linuxfabrik.ch/monitoring-plugins/ubuntu/
          {{ ansible_distribution_release }}-release main
        filename: linuxfabrik-monitoring-plugins
        state: present
      environment: "{{ proxy_environment | default({}) }}"
      when:
        - inventory_hostname in (groups['linuxfabrik_targets'] | default([]))
        - linuxfabrik_package_status.rc != 0

    - name: Cài Linuxfabrik monitoring plugins trên target ngoài cụm
      ansible.builtin.apt:
        name: linuxfabrik-monitoring-plugins
        update_cache: true
        lock_timeout: 300
        state: present
      environment: "{{ proxy_environment | default({}) }}"
      when:
        - inventory_hostname in (groups['linuxfabrik_targets'] | default([]))
        - linuxfabrik_package_status.rc != 0

    - name: Tạo tài khoản runtime không đặc quyền trên Linuxfabrik target
      ansible.builtin.user:
        name: "{{ monitor_restricted_user }}"
        home: "/var/lib/{{ monitor_restricted_user }}"
        create_home: true
        shell: /bin/bash
        system: true
      when: inventory_hostname in (groups['linuxfabrik_targets'] | default([]))

    - name: Cài forced-command chỉ cho phép ba Linuxfabrik check
      ansible.builtin.copy:
        src: files/icinga-linuxfabrik-check
        dest: /usr/local/sbin/icinga-linuxfabrik-check
        owner: root
        group: root
        mode: "0755"
      when: inventory_hostname in (groups['linuxfabrik_targets'] | default([]))

    - name: Tạo SSH directory cho tài khoản runtime hạn chế
      ansible.builtin.file:
        path: "/var/lib/{{ monitor_restricted_user }}/.ssh"
        state: directory
        owner: "{{ monitor_restricted_user }}"
        group: "{{ monitor_restricted_user }}"
        mode: "0700"
      when: inventory_hostname in (groups['linuxfabrik_targets'] | default([]))

    - name: Chỉ cho phép key monitoring từ các Icinga master và forced-command
      ansible.builtin.copy:
        dest: "/var/lib/{{ monitor_restricted_user }}/.ssh/authorized_keys"
        content: >-
          from="{{ monitor_allowed_sources }}",restrict,command="/usr/local/sbin/icinga-linuxfabrik-check"
          {{ monitor_public_key_file.content | b64decode | trim }}
          {{ '\n' }}
        owner: "{{ monitor_restricted_user }}"
        group: "{{ monitor_restricted_user }}"
        mode: "0600"
      when: inventory_hostname in (groups['linuxfabrik_targets'] | default([]))

    - name: Cho phép key monitoring đăng nhập user ubuntu trên host triển khai cũ
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        line: "{{ monitor_public_key_file.content | b64decode | trim }}"
        state: present
        create: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      when: inventory_hostname not in (groups['linuxfabrik_targets'] | default([]))

  post_tasks:
    - name: Ghi known_hosts riêng cho check_by_ssh
      ansible.builtin.copy:
        dest: "{{ monitor_key_dir }}/known_hosts"
        content: >-
          {{ ansible_play_hosts_all
             | map('extract', hostvars, 'monitor_host_key')
             | map(attribute='stdout')
             | reject('equalto', '')
             | join('\n') }}
          {{ '\n' }}
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
