---
# Kéo image thật sự mà không render config, tạo database hay recreate container.
- name: Pull images dùng trên master
  hosts: master
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Pull image master (luôn kiểm tra digest dù tag đã tồn tại local)
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
        force_source: true
      loop:
        - "{{ images.icinga2 }}"
        - "{{ images.icingadb }}"
        - "{{ images.icingaweb2 }}"
        - "{{ images.icingadb_redis }}"
        - "{{ images.mariadb }}"
      register: _pull_master_image
      # Docker Hub/CDN occasionally returns transient 429/5xx for one manifest
      # or layer while the same proxy succeeds on another node.  A bounded
      # retry keeps pull preflight read-only and avoids touching runtime.
      retries: 8
      delay: 10
      until: _pull_master_image is succeeded

- name: Pull image Icinga 2 trên satellite/client
  hosts: "{{ (groups['satellite'] | default([]) + groups['client'] | default([])) | unique }}"
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Pull image Icinga 2
      community.docker.docker_image:
        name: "{{ images.icinga2 }}"
        source: pull
        force_source: true
      register: _pull_satellite_image
      retries: 8
      delay: 10
      until: _pull_satellite_image is succeeded

- name: Pull image MariaDB trên node managed DB
  hosts: galera
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Pull image MariaDB
      community.docker.docker_image:
        name: "{{ images.mariadb }}"
        source: pull
        force_source: true
      register: _pull_mariadb_image
      retries: 8
      delay: 10
      until: _pull_mariadb_image is succeeded
      when: icinga_database_type == 'managed_db'
