---
# Health-check runtime thật. Không render config, không restart/recreate container.
- name: Check container trên mọi managed host
  hosts: all_hosts
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Xác định container bắt buộc trên host hiện tại
      ansible.builtin.set_fact:
        _expected_containers: >-
          {{ ((['icinga2', 'icingadb-redis', 'icingadb', 'icingaweb2'] if 'master' in group_names else [])
              + (['icingaweb2-director-daemon']
                 if ('master' in group_names and inventory_hostname == ca_host
                     and 'director' in (enable_icingaweb2_modules | default([])))
                 else [])
              + (['icinga2'] if ('satellite' in group_names or 'client' in group_names) else [])
              + (['mariadb'] if ('galera' in group_names and icinga_database_type == 'managed_db') else []))
             | unique | list }}

    - name: Đọc trạng thái Director trên master không phải CA
      when:
        - "'master' in group_names"
        - inventory_hostname != ca_host
      block:
        - name: Kiểm tra container Director daemon không còn tồn tại
          community.docker.docker_container_info:
            name: icingaweb2-director-daemon
          register: _non_ca_director_daemon

        - name: Kiểm tra module Director không còn enable
          ansible.builtin.stat:
            path: "{{ icinga_etc_dir }}/icingaweb2/enabledModules/director"
          register: _non_ca_director_module

        - name: Kiểm tra module FileShipper không còn enable
          ansible.builtin.stat:
            path: "{{ icinga_etc_dir }}/icingaweb2/enabledModules/fileshipper"
          register: _non_ca_fileshipper_module

        - name: Kiểm tra config module Director không còn tồn tại
          ansible.builtin.stat:
            path: "{{ icinga_etc_dir }}/icingaweb2/modules/director/config.ini"
          register: _non_ca_director_config

        - name: Đọc resources.ini để kiểm tra cô lập Director
          ansible.builtin.slurp:
            path: "{{ icinga_etc_dir }}/icingaweb2/resources.ini"
          register: _non_ca_web_resources
          no_log: true

        - name: Xác nhận Director chỉ chạy trên CA/master1
          ansible.builtin.assert:
            that:
              - not (_non_ca_director_daemon.exists | default(false))
              - not (_non_ca_director_module.stat.exists | default(false))
              - not (_non_ca_fileshipper_module.stat.exists | default(false))
              - not (_non_ca_director_config.stat.exists | default(false))
              - "'[director_db]' not in (_non_ca_web_resources.content | b64decode)"
            fail_msg: >-
              Director còn tồn tại trên {{ inventory_hostname }}; module, config, resource DB và
              daemon chỉ được phép chạy trên ca_host={{ ca_host }}.

    - name: Đọc trạng thái container bắt buộc
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: "{{ _expected_containers }}"
      register: _container_info
      no_log: true
      until:
        - _container_info.exists | default(false)
        - (_container_info.container.State.Status | default('missing')) == 'running'
        - (_container_info.container.State.Health.Status | default('healthy')) == 'healthy'
      retries: 24
      delay: 5

    # Không assert trực tiếp trên docker_container_info: object đó chứa toàn bộ
    # Config.Env của container và có thể làm lộ mật khẩu khi task thất bại.
    - name: Rút gọn trạng thái container (không chứa environment/secrets)
      ansible.builtin.set_fact:
        _container_statuses: >-
          {{ (_container_statuses | default([])) + [{
               'name': item.item,
               'exists': item.exists | default(false),
               'status': item.container.State.Status | default('missing'),
               'health': item.container.State.Health.Status | default('not-defined')
             }] }}
      loop: "{{ _container_info.results }}"
      no_log: true

    - name: Container phải tồn tại, running và healthy nếu có healthcheck
      ansible.builtin.assert:
        that:
          - item.exists
          - item.status == 'running'
          - item.health in ['healthy', 'not-defined']
        fail_msg: >-
          {{ item.name }} trên {{ inventory_hostname }} không khỏe:
          exists={{ item.exists }}, status={{ item.status }}, health={{ item.health }}
      loop: "{{ _container_statuses | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

- name: Check sâu Icinga master
  hosts: master
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Icinga 2 config phải hợp lệ
      ansible.builtin.command: docker exec icinga2 icinga2 daemon -C
      changed_when: false

    - name: Icinga 2 API phải trả HTTP 200
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ icinga2_api_port }}/v1/status"
        user: icingadb-web
        password: "{{ icingadb_web_api_user_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      no_log: true

    - name: Redis phải trả PONG
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -e
          - REDISCLI_AUTH
          - icingadb-redis
          - redis-cli
          - -p
          - "{{ icingadb_redis_port | string }}"
          - ping
      environment:
        REDISCLI_AUTH: "{{ icingadb_redis_password }}"
      register: _redis_ping
      changed_when: false
      no_log: true

    - name: Xác nhận Redis PONG
      ansible.builtin.assert:
        that: _redis_ping.stdout | trim == 'PONG'

    - name: Web login phải trả 200 hoặc 302
      ansible.builtin.uri:
        url: "{{ icingaweb2_web_scheme }}://127.0.0.1:{{ icingaweb2_web_port }}/authentication/login"
        validate_certs: false
        status_code: [200, 302]

    - name: Khởi tạo session/cookie cho form login
      ansible.builtin.uri:
        url: "{{ icingaweb2_web_scheme }}://127.0.0.1:{{ icingaweb2_web_port }}/authentication/login"
        validate_certs: false
        follow_redirects: none
        status_code: 302
      register: _web_login_session
      no_log: true

    - name: Đọc form login sau cookie check
      ansible.builtin.uri:
        url: "{{ _web_login_session.location }}"
        validate_certs: false
        headers:
          Cookie: "{{ _web_login_session.set_cookie | regex_replace(',\\s*', '; ') }}"
        return_content: true
        status_code: 200
      register: _web_login_form
      no_log: true

    - name: Trích CSRF token của form login
      ansible.builtin.set_fact:
        _web_login_legacy_form: >-
          {{ 'name="formUID"' in _web_login_form.content }}
        _web_login_csrf: >-
          {{ (((_web_login_form.content
                | regex_findall('name="CSRFToken" value="([^"]+)"'))
               + (_web_login_form.content
                  | regex_findall('value="([^"]+)" name="CSRFToken"')))
              | first) }}
      no_log: true

    - name: Đăng nhập Web bằng tài khoản admin được quản lý
      ansible.builtin.uri:
        url: "{{ icingaweb2_web_scheme }}://127.0.0.1:{{ icingaweb2_web_port }}/authentication/login"
        method: POST
        validate_certs: false
        follow_redirects: none
        status_code: [302, 303]
        headers:
          Cookie: >-
            {{ _web_login_form.cookies_string
               | default(_web_login_session.set_cookie | regex_replace(',\\s*', '; ')) }}
        body_format: form-urlencoded
        body: >-
          {{ (_web_login_legacy_form | bool)
             | ternary(
                 {'CSRFToken': _web_login_csrf,
                  'formUID': 'form_login',
                  'username': icingaweb2_admin_user,
                  'password': icingaweb2_admin_password,
                  'rememberme': '0',
                  'btn_submit': 'Login',
                  'redirect': ''},
                 {'CSRFToken': _web_login_csrf,
                  'uid': 'form_login',
                  'username': icingaweb2_admin_user,
                  'password': icingaweb2_admin_password,
                  'rememberme': 'n',
                  'submit_login': 'Login',
                  'redirect': ''}) }}
      register: _web_admin_login
      no_log: true

    - name: Admin login không được bị chuyển ngược về trang đăng nhập
      ansible.builtin.assert:
        that:
          - "'/authentication/login' not in (_web_admin_login.location | default(''))"
        fail_msg: "Icinga Web 2 nhận POST nhưng từ chối credential admin."

    - name: Certificate HTTPS đang phục vụ phải khớp file đã triển khai
      ansible.builtin.shell: |
        set -euo pipefail
        expected=$(openssl x509 -in {{ (icinga_etc_dir + '/icingaweb2/tls/certificate.pem') | quote }} \
          -outform DER | sha256sum | awk '{print $1}')
        served=$(timeout 10 openssl s_client \
          -connect 127.0.0.1:{{ icingaweb2_https_port }} \
          -servername {{ icingaweb2_https_server_name | quote }} </dev/null 2>/dev/null |
          openssl x509 -outform DER | sha256sum | awk '{print $1}')
        test -n "$expected"
        test "$expected" = "$served"
      args:
        executable: /bin/bash
      changed_when: false
      when: icingaweb2_https_enabled | bool

    - name: HTTP phải redirect sang URL HTTPS đã khai
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ icingaweb2_http_port }}/authentication/login"
        follow_redirects: none
        status_code: [301, 308]
      register: _web_https_redirect
      when:
        - icingaweb2_https_enabled | bool
        - icingaweb2_https_redirect_http | bool

    - name: Redirect HTTP phải trỏ đúng server HTTPS
      ansible.builtin.assert:
        that:
          - >-
            _web_https_redirect.location.startswith(
              'https://' ~ icingaweb2_https_server_name ~
              ((':' ~ (icingaweb2_https_port | string)) if icingaweb2_https_port | int != 443 else '') ~ '/')
      when:
        - icingaweb2_https_enabled | bool
        - icingaweb2_https_redirect_http | bool

    - name: FileShipper phải có code, config và source directory trong cả hai container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ item }}"
          - /bin/bash
          - -ec
          - >-
            php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);' &&
            test -f /usr/share/icingaweb2/modules/fileshipper/module.info &&
            test -e /data/etc/icingaweb2/enabledModules/fileshipper &&
            test -r /data/etc/icingaweb2/modules/fileshipper/directories.ini &&
            test -r /data/etc/icingaweb2/modules/fileshipper/imports.ini &&
            test -d /data/etc/icingaweb2/fileshipper/director-global &&
            test -d /data/etc/icingaweb2/fileshipper/imports
      loop:
        - icingaweb2
        - icingaweb2-director-daemon
      changed_when: false
      when:
        - inventory_hostname == ca_host
        - "'fileshipper' in (enable_icingaweb2_modules | default([]))"

    - name: Icinga DB heartbeat phải mới và config sync phải có dữ liệu
      # MYSQL_PWD (environment), KHÔNG -p<password> trên cmdline — D4: "no_log" chỉ che log Ansible,
      # không che "ps aux" trong lúc lệnh đang chạy.
      ansible.builtin.command: >-
        docker run --rm --network host -e MYSQL_PWD {{ images.mariadb }}
        mariadb {{ _mariadb_ssl_flag }} -h {{ db_host }} -P {{ db_port }}
        -uicingadb -N icingadb
        -e "SELECT IF(COALESCE(UNIX_TIMESTAMP(CURRENT_TIMESTAMP(3))*1000-MAX(heartbeat),999999999) < 60000,'OK','STALE') FROM icingadb_instance;
            SELECT IF(COUNT(*) > 0,'OK','EMPTY') FROM checkcommand;"
      environment:
        MYSQL_PWD: "{{ icingadb_db_password }}"
      register: _icingadb_db_health
      changed_when: false
      no_log: true

    - name: Xác nhận heartbeat/config sync Icinga DB
      ansible.builtin.assert:
        that:
          - _icingadb_db_health.stdout_lines | length == 2
          - _icingadb_db_health.stdout_lines[0] == 'OK'
          - _icingadb_db_health.stdout_lines[1] == 'OK'

    - name: Đọc lỗi nghiêm trọng gần đây của Icinga DB
      ansible.builtin.command: docker logs --since 5m icingadb
      register: _icingadb_recent_logs
      changed_when: false
      failed_when: false

    - name: Icinga DB không được có fatal/panic hoặc DB retry gần đây
      ansible.builtin.assert:
        that:
          - not ((_icingadb_recent_logs.stdout ~ '\n' ~ _icingadb_recent_logs.stderr) is regex('(?im)(FATAL|panic|Can.t execute query)'))
        fail_msg: >-
          Icinga DB có lỗi nghiêm trọng trong 5 phút gần đây; xem `docker logs --since 5m icingadb`.

    # `kickstart required` phụ thuộc vào kickstart.ini. Khi operator kickstart thủ công rồi xóa
    # credential tạm (cách an toàn), lệnh đó trả rc=2 "not configured" dù endpoint đã tồn tại trong
    # Director DB. Endpoint external của CA host mới là dấu hiệu bền vững rằng kickstart đã hoàn tất.
    - name: Kiểm tra Director đã có endpoint CA do operator Kickstart chưa
      ansible.builtin.command:
        argv: [docker, exec, icingaweb2, icingacli, director, endpoint, show, "{{ ca_host }}", --json]
      register: _director_endpoint_show
      changed_when: false
      failed_when: false
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Thông báo Director đã sẵn sàng để người dùng tự Kickstart
      ansible.builtin.debug:
        msg: >-
          Director module/schema healthy và đang chờ Kickstart trong Web UI; bỏ qua các phép kiểm tra
          topology/object cho tới khi người dùng hoàn tất Kickstart.
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"
        - _director_endpoint_show.rc != 0

    - name: Kết thúc kiểm tra sâu trên CA host khi Director chưa Kickstart
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"
        - _director_endpoint_show.rc != 0

    - name: Director CLI phải báo healthy sau Kickstart
      ansible.builtin.command:
        argv: [docker, exec, icingaweb2, icingacli, director, health, check]
      changed_when: false
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    # Monitoring objects are operator-owned file configuration. Director may remain enabled for
    # its UI/module, but its imported endpoint/zone objects are not the infrastructure source of
    # truth and must not make add/remove-node health checks fail.

- name: Check managed MariaDB/Galera
  hosts: galera
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: MariaDB phải trả lời SELECT 1
      # --defaults-extra-file (không phải -uroot -p<password> trên cmdline) — tránh lộ root password
      # qua "ps aux"/"/proc/<pid>/cmdline" trong lúc lệnh đang chạy ("no_log: true" chỉ che log
      # Ansible, không che process list trên host). Cùng file .my-healthcheck.cnf đã ghi sẵn cho mọi
      # node ở _start_container.yml, cùng cách mariadb_rolling.yml đã dùng.
      ansible.builtin.command: >-
        docker exec mariadb mariadb --defaults-extra-file=/var/lib/mysql/.my-healthcheck.cnf -N -e "SELECT 1;"
      register: _mariadb_ping
      changed_when: false
      no_log: true
      when: icinga_database_type == 'managed_db'

    - name: Galera phải Primary, ready và đủ node
      ansible.builtin.command: >-
        docker exec mariadb mariadb --defaults-extra-file=/var/lib/mysql/.my-healthcheck.cnf -N
        -e "SHOW STATUS WHERE Variable_name IN ('wsrep_cluster_size','wsrep_cluster_status','wsrep_ready');"
      register: _galera_status
      changed_when: false
      no_log: true
      when:
        - icinga_database_type == 'managed_db'
        - (galera_count | int) >= 3

    - name: Xác nhận trạng thái Galera
      ansible.builtin.assert:
        that:
          - "'wsrep_ready\\tON' in _galera_status.stdout"
          - "'wsrep_cluster_status\\tPrimary' in _galera_status.stdout"
          - "('wsrep_cluster_size\\t' ~ (galera_count | string)) in _galera_status.stdout"
      when:
        - icinga_database_type == 'managed_db'
        - (galera_count | int) >= 3
