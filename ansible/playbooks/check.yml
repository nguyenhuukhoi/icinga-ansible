---
# Health-check runtime thật. Không render config, không restart/recreate container.
- name: Check container trên mọi managed host
  hosts: all_hosts
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Xác định container bắt buộc trên host hiện tại
      ansible.builtin.set_fact:
        _expected_containers: >-
          {{ ((['icinga2', 'icingadb-redis', 'icingadb', 'icingaweb2'] if 'master' in group_names else [])
              + (['icingaweb2-director-daemon']
                 if ('master' in group_names and 'director' in (enable_icingaweb2_modules | default([])))
                 else [])
              + (['icinga2'] if ('satellite' in group_names or 'client' in group_names) else [])
              + (['mariadb'] if ('galera' in group_names and icinga_database_type == 'managed_db') else []))
             | unique | list }}

    - name: Đọc trạng thái container bắt buộc
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: "{{ _expected_containers }}"
      register: _container_info
      no_log: true
      until:
        - _container_info.exists | default(false)
        - (_container_info.container.State.Status | default('missing')) == 'running'
        - (_container_info.container.State.Health.Status | default('healthy')) == 'healthy'
      retries: 24
      delay: 5

    # Không assert trực tiếp trên docker_container_info: object đó chứa toàn bộ
    # Config.Env của container và có thể làm lộ mật khẩu khi task thất bại.
    - name: Rút gọn trạng thái container (không chứa environment/secrets)
      ansible.builtin.set_fact:
        _container_statuses: >-
          {{ (_container_statuses | default([])) + [{
               'name': item.item,
               'exists': item.exists | default(false),
               'status': item.container.State.Status | default('missing'),
               'health': item.container.State.Health.Status | default('not-defined')
             }] }}
      loop: "{{ _container_info.results }}"
      no_log: true

    - name: Container phải tồn tại, running và healthy nếu có healthcheck
      ansible.builtin.assert:
        that:
          - item.exists
          - item.status == 'running'
          - item.health in ['healthy', 'not-defined']
        fail_msg: >-
          {{ item.name }} trên {{ inventory_hostname }} không khỏe:
          exists={{ item.exists }}, status={{ item.status }}, health={{ item.health }}
      loop: "{{ _container_statuses | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

- name: Check sâu Icinga master
  hosts: master
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Icinga 2 config phải hợp lệ
      ansible.builtin.command: docker exec icinga2 icinga2 daemon -C
      changed_when: false

    - name: Icinga 2 API phải trả HTTP 200
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ icinga2_api_port }}/v1/status"
        user: icingaweb2
        password: "{{ icinga2_api_user_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      no_log: true

    - name: Redis phải trả PONG
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -e
          - REDISCLI_AUTH
          - icingadb-redis
          - redis-cli
          - -p
          - "{{ icingadb_redis_port | string }}"
          - ping
      environment:
        REDISCLI_AUTH: "{{ icingadb_redis_password }}"
      register: _redis_ping
      changed_when: false
      no_log: true

    - name: Xác nhận Redis PONG
      ansible.builtin.assert:
        that: _redis_ping.stdout | trim == 'PONG'

    - name: Web login phải trả 200 hoặc 302
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ icingaweb2_http_port }}/authentication/login"
        status_code: [200, 302]

    - name: Khởi tạo session/cookie cho form login
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ icingaweb2_http_port }}/authentication/login"
        follow_redirects: none
        status_code: 302
      register: _web_login_session
      no_log: true

    - name: Đọc form login sau cookie check
      ansible.builtin.uri:
        url: "{{ _web_login_session.location }}"
        headers:
          Cookie: "{{ _web_login_session.set_cookie | regex_replace(',\\s*', '; ') }}"
        return_content: true
        status_code: 200
      register: _web_login_form
      no_log: true

    - name: Trích CSRF token của form login
      ansible.builtin.set_fact:
        _web_login_csrf: >-
          {{ (_web_login_form.content
              | regex_findall('value="([^"]+)" name="CSRFToken"')
              | first) }}
      no_log: true

    - name: Đăng nhập Web bằng tài khoản admin được quản lý
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ icingaweb2_http_port }}/authentication/login"
        method: POST
        follow_redirects: none
        status_code: [302, 303]
        headers:
          Cookie: "{{ _web_login_session.set_cookie | regex_replace(',\\s*', '; ') }}"
        body_format: form-urlencoded
        body:
          CSRFToken: "{{ _web_login_csrf }}"
          uid: form_login
          username: "{{ icingaweb2_admin_user }}"
          password: "{{ icingaweb2_admin_password }}"
          rememberme: "n"
          submit_login: Login
          redirect: ""
      register: _web_admin_login
      no_log: true

    - name: Admin login không được bị chuyển ngược về trang đăng nhập
      ansible.builtin.assert:
        that:
          - "'/authentication/login' not in (_web_admin_login.location | default(''))"
        fail_msg: "Icinga Web 2 nhận POST nhưng từ chối credential admin."

    - name: Icinga DB heartbeat phải mới và config sync phải có dữ liệu
      # MYSQL_PWD (environment), KHÔNG -p<password> trên cmdline — D4: "no_log" chỉ che log Ansible,
      # không che "ps aux" trong lúc lệnh đang chạy.
      ansible.builtin.command: >-
        docker run --rm --network host -e MYSQL_PWD {{ images.mariadb }}
        mariadb {{ _mariadb_ssl_flag }} -h {{ db_host }} -P {{ db_port }}
        -uicingadb -N icingadb
        -e "SELECT IF(COALESCE(UNIX_TIMESTAMP(CURRENT_TIMESTAMP(3))*1000-MAX(heartbeat),999999999) < 60000,'OK','STALE') FROM icingadb_instance;
            SELECT IF(COUNT(*) > 0,'OK','EMPTY') FROM checkcommand;"
      environment:
        MYSQL_PWD: "{{ icingadb_db_password }}"
      register: _icingadb_db_health
      changed_when: false
      no_log: true

    - name: Xác nhận heartbeat/config sync Icinga DB
      ansible.builtin.assert:
        that:
          - _icingadb_db_health.stdout_lines | length == 2
          - _icingadb_db_health.stdout_lines[0] == 'OK'
          - _icingadb_db_health.stdout_lines[1] == 'OK'

    - name: Đọc lỗi nghiêm trọng gần đây của Icinga DB
      ansible.builtin.command: docker logs --since 5m icingadb
      register: _icingadb_recent_logs
      changed_when: false
      failed_when: false

    - name: Icinga DB không được có fatal/panic hoặc DB retry gần đây
      ansible.builtin.assert:
        that:
          - not ((_icingadb_recent_logs.stdout ~ '\n' ~ _icingadb_recent_logs.stderr) is regex('(?im)(FATAL|panic|Can.t execute query)'))
        fail_msg: >-
          Icinga DB có lỗi nghiêm trọng trong 5 phút gần đây; xem `docker logs --since 5m icingadb`.

    - name: Kiểm tra Director còn chờ người dùng Kickstart không
      ansible.builtin.command:
        argv: [docker, exec, icingaweb2, icingacli, director, kickstart, required]
      register: _director_kickstart_required
      changed_when: false
      # rc=2: chưa cấu hình; rc=0: đã cấu hình nhưng cần chạy; rc=1: đã hoàn tất.
      failed_when: _director_kickstart_required.rc not in [0, 1, 2]
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Thông báo Director đã sẵn sàng để người dùng tự Kickstart
      ansible.builtin.debug:
        msg: >-
          Director module/schema healthy và đang chờ Kickstart trong Web UI; bỏ qua các phép kiểm tra
          topology/object cho tới khi người dùng hoàn tất Kickstart.
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"
        - _director_kickstart_required.rc in [0, 2]

    - name: Kết thúc kiểm tra sâu trên CA host khi Director chưa Kickstart
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"
        - _director_kickstart_required.rc in [0, 2]

    - name: Director CLI phải báo healthy sau Kickstart
      ansible.builtin.command:
        argv: [docker, exec, icingaweb2, icingacli, director, health, check]
      changed_when: false
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Đọc schema Custom Variables do Ansible quản lý
      ansible.builtin.command:
        argv: [docker, exec, icingaweb2, icingacli, director, export, customproperties]
      register: _director_custom_variables_health
      changed_when: false
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"
        - (director_managed_custom_variables | default([]) | length) > 0

    - name: Custom Variable phải tồn tại đúng một lần và đúng kiểu/nhãn
      ansible.builtin.assert:
        that:
          - >-
            (_director_custom_variables_health.stdout | from_json
             | selectattr('key_name', 'equalto', item.name) | list | length) == 1
          - >-
            (_director_custom_variables_health.stdout | from_json
             | selectattr('key_name', 'equalto', item.name) | first).value_type == item.type
          - >-
            (_director_custom_variables_health.stdout | from_json
             | selectattr('key_name', 'equalto', item.name) | first).label
            == (item.label | default(item.name))
        fail_msg: >-
          Director Custom Variable '{{ item.name }}' bị thiếu, trùng hoặc sai kiểu/nhãn.
      loop: "{{ director_managed_custom_variables | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Đọc Service Template chứa ngưỡng từ Director REST API
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ icingaweb2_http_port }}/director/service?name={{
          item.name | urlencode }}
        method: GET
        url_username: "{{ icingaweb2_admin_user }}"
        url_password: "{{ icingaweb2_admin_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        return_content: true
        status_code: 200
      loop: "{{ director_managed_service_templates | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: _director_service_templates_health
      no_log: true
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Service Template phải giữ đúng default và liên kết Custom Variables
      ansible.builtin.assert:
        that:
          - item.json.object_type == 'template'
          - item.json.check_command == item.item.check_command
          - item.json.vars == (item.item.vars | default({}))
          - >-
            (item.json.customVariables | default([]) | length)
            == (item.item.vars | default({}) | length)
        fail_msg: >-
          Service Template '{{ item.item.name }}' sai check command/default hoặc
          chưa gắn đủ typed Custom Variables nên Director sẽ không hiện ô nhập.
      loop: "{{ _director_service_templates_health.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Đọc Service Apply Rule từ Director REST API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ icingaweb2_http_port }}/director/serviceapplyrules"
        method: GET
        url_username: "{{ icingaweb2_admin_user }}"
        url_password: "{{ icingaweb2_admin_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        return_content: true
        status_code: 200
      register: _director_apply_rules_health
      no_log: true
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"
        - (director_managed_service_apply_rules | default([]) | length) > 0

    - name: Mỗi Service Apply Rule phải tồn tại đúng một lần và khớp cấu hình
      ansible.builtin.assert:
        that:
          - >-
            (_director_apply_rules_health.json.objects | default([])
             | selectattr('object_name', 'equalto', item.name) | list | length) == 1
          - >-
            (_director_apply_rules_health.json.objects | default([])
             | selectattr('object_name', 'equalto', item.name) | first).object_type == 'apply'
          - >-
            (_director_apply_rules_health.json.objects | default([])
             | selectattr('object_name', 'equalto', item.name) | first).assign_filter == item.assign_filter
          - >-
            (_director_apply_rules_health.json.objects | default([])
             | selectattr('object_name', 'equalto', item.name) | first).check_command == item.check_command
          - >-
            ((_director_apply_rules_health.json.objects | default([])
              | selectattr('object_name', 'equalto', item.name) | first).imports | default([]))
            == (item.imports | default([]))
          - >-
            (_director_apply_rules_health.json.objects | default([])
             | selectattr('object_name', 'equalto', item.name) | first).vars == (item.vars | default({}))
        fail_msg: >-
          Service Apply Rule '{{ item.name }}' bị thiếu, bị trùng hoặc lệch
          assign_filter/check command/imports/vars.
      loop: "{{ director_managed_service_apply_rules | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Kiểm tra Service object cũ đã được dọn khỏi từng host
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - icingaweb2
          - icingacli
          - director
          - service
          - exists
          - "{{ item.1 }}"
          - --host
          - "{{ item.0.name }}"
      loop: >-
        {{ (director_managed_hosts | default([]))
           | product(director_managed_direct_services_absent | default([])) | list }}
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"
      register: _director_direct_services_absent_health
      changed_when: false
      failed_when: false
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Không được còn Service object cũ trùng với Apply Rule
      ansible.builtin.assert:
        that: item.rc == 1
        fail_msg: >-
          Service object trực tiếp '{{ item.item.1 }}' vẫn còn trên host
          '{{ item.item.0.name }}'; nó sẽ chồng với Service Apply Rule.
      loop: "{{ _director_direct_services_absent_health.results | default([]) }}"
      loop_control:
        label: "{{ item.item.0.name }}/{{ item.item.1 }}"
      when:
        - icinga_manage_monitoring_config | bool
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Tính chính xác endpoint và zone Director phải import từ topology hiện tại
      ansible.builtin.set_fact:
        _director_expected_endpoints: >-
          {{ ((groups['master'] | default([]))
              + (groups['satellite'] | default([]))
              + (groups['client'] | default([]))) | unique | sort | join(',') }}
        _director_expected_zones: >-
          {{ (['director-global', 'global-templates', icinga_master_zone_name]
              + (satellite_zones | default([]) | map(attribute='name') | list)
              + (groups['client'] | default([]))) | unique | sort | join(',') }}
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Director phải đã import chính xác endpoint và zone của topology hiện tại
      ansible.builtin.command: >-
        docker run --rm --network host -e MYSQL_PWD {{ images.mariadb }}
        mariadb {{ _mariadb_ssl_flag }} -h {{ db_host }} -P {{ db_port }}
        -udirector -N director
        -e "SELECT GROUP_CONCAT(object_name ORDER BY object_name SEPARATOR ',')
            FROM icinga_endpoint WHERE object_type='external_object';
            SELECT GROUP_CONCAT(object_name ORDER BY object_name SEPARATOR ',')
            FROM icinga_zone WHERE object_type='external_object';"
      environment:
        MYSQL_PWD: "{{ director_db_password }}"
      register: _director_topology
      changed_when: false
      no_log: true
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

    - name: Xác nhận topology Director khớp inventory
      ansible.builtin.assert:
        that:
          - _director_topology.stdout_lines | length == 2
          - _director_topology.stdout_lines[0] == _director_expected_endpoints
          - _director_topology.stdout_lines[1] == _director_expected_zones
        fail_msg: >-
          Endpoint/zone external_object của Director không khớp chính xác topology hiện tại;
          có thể còn object của node đã xóa hoặc thiếu node vừa thêm.
      when:
        - inventory_hostname == ca_host
        - "'director' in (enable_icingaweb2_modules | default([]))"

- name: Check managed MariaDB/Galera
  hosts: galera
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: MariaDB phải trả lời SELECT 1
      # --defaults-extra-file (không phải -uroot -p<password> trên cmdline) — tránh lộ root password
      # qua "ps aux"/"/proc/<pid>/cmdline" trong lúc lệnh đang chạy ("no_log: true" chỉ che log
      # Ansible, không che process list trên host). Cùng file .my-healthcheck.cnf đã ghi sẵn cho mọi
      # node ở _start_container.yml, cùng cách mariadb_rolling.yml đã dùng.
      ansible.builtin.command: >-
        docker exec mariadb mariadb --defaults-extra-file=/var/lib/mysql/.my-healthcheck.cnf -N -e "SELECT 1;"
      register: _mariadb_ping
      changed_when: false
      no_log: true
      when: icinga_database_type == 'managed_db'

    - name: Galera phải Primary, ready và đủ node
      ansible.builtin.command: >-
        docker exec mariadb mariadb --defaults-extra-file=/var/lib/mysql/.my-healthcheck.cnf -N
        -e "SHOW STATUS WHERE Variable_name IN ('wsrep_cluster_size','wsrep_cluster_status','wsrep_ready');"
      register: _galera_status
      changed_when: false
      no_log: true
      when:
        - icinga_database_type == 'managed_db'
        - (galera_count | int) >= 3

    - name: Xác nhận trạng thái Galera
      ansible.builtin.assert:
        that:
          - "'wsrep_ready\\tON' in _galera_status.stdout"
          - "'wsrep_cluster_status\\tPrimary' in _galera_status.stdout"
          - "('wsrep_cluster_size\\t' ~ (galera_count | string)) in _galera_status.stdout"
      when:
        - icinga_database_type == 'managed_db'
        - (galera_count | int) >= 3
