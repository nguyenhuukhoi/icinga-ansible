---
- name: In thông tin truy cập (read-only)
  hosts: master
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Thông tin Icinga Web 2
      ansible.builtin.debug:
        msg:
          - >-
            Icinga Web 2: {{ icingaweb2_web_scheme }}://{{ icingaweb2_https_server_name
            if (icingaweb2_https_enabled | bool)
            else (ansible_host | default(inventory_hostname)) }}:{{ icingaweb2_web_port }}/authentication/login
          - "Admin user: {{ icingaweb2_admin_user }}"
