# =============================================================================
# backup-full.yml — Backup TOÀN BỘ state cần để dựng lại hệ thống trên hạ tầng MỚI + restore về gần
# như y hệt cũ (thiết kế 2026-07-24, theo yêu cầu người dùng "cơ chế backup và restore ok... khi hệ
# thống mất hết thì dựng lại hệ thống mới với topo tương tự và restore lại như cũ").
#
# Gồm 5 phần, gộp vào 1 lệnh cho tiện, nhưng mỗi artifact có checksum độc lập:
#   1. Config trên deployment node (globals.yml, passwords.yml, MỌI override — config/) — đây là
#      "recipe" để tái tạo lại toàn bộ hạ tầng + secrets; kèm inventory/topology snapshot.
#   2. Database + PKI: managed DB tái dùng role mariadb với tag "full"; external DB bỏ qua database
#      của DBA nhưng vẫn snapshot CA/PKI độc lập để full backup luôn dựng lại được trust chain.
#   3. Toàn bộ /etc/icinga-ansible trên MỖI managed node, kể cả Galera: giữ mọi file bind-mount RW
#      và file operator tạo trực tiếp trên host.
#   4. Icinga 2 node state trên MỖI master/satellite/client: config và identity (bao gồm
#      zones.d, secrets, custom plugin), certificate endpoint và icingadb.env trên master.
#   5. icingaweb2 config trên MỖI master (resources.ini/config.ini/...) — vì cơ chế "seed 1 lần, mount
#      RW" (xem design.md mục 4.1) khiến sửa qua UI chỉ nằm trên node, KHÔNG có trong bất kỳ override
#      nào — nếu không backup riêng, mọi thứ sửa qua UI sẽ mất khi rebuild.
#
# TOÀN BỘ kết quả backup gom về 1 chỗ: {{ icinga_config_backup_dir }}/ trên deployment node (mặc
# định "/var/backups/icinga-ansible-config" — CỐ Ý nằm ngoài icinga_etc_dir, xem group_vars/all.yml,
# để destroy.yml — vốn chỉ xoá nội dung icinga_etc_dir — không bao giờ đụng tới thư mục backup này,
# kể cả khi destroy 1 inventory/cụm khác dùng chung control node) — tự backup thư mục đó ra ngoài
# (rsync/copy sang máy khác) là đủ cho disaster recovery thật, vì hạ tầng lab có thể mất bất cứ lúc
# nào (đã từng xảy ra thật trong quá trình phát triển — xem TODO.md).
#
# KHÔNG backup icingadb-redis — đây là cache runtime (MariaDB qua icingadb daemon mới là nguồn dữ
# liệu thật), rebuild lại từ đầu bằng cách chạy checks lại là đủ, không cần khôi phục.
# =============================================================================

- name: "Backup full (1/5) — config, inventory và topology trên deployment node"
  hosts: localhost
  connection: local
  # KHÔNG "become: true" ở CẤP PLAY (khác destroy.yml) — icinga_etc_dir (/etc/icinga-ansible) vốn đã
  # do chính user chạy CLI sở hữu (init_config() trong tools/icinga-ansible: "sudo install -d -o
  # $(id -un)"), không cần sudo để đọc/ghi trong đó. BUG THẬT đã gặp (2026-07-24): dùng become:true ở
  # đây làm thư mục "backups/" bị tạo ra owner root — "ansible.builtin.fetch" ở play (3/3) bên dưới
  # LUÔN ghi phía LOCAL bằng chính user chạy ansible-playbook (KHÔNG qua become dù play đó có
  # become:true, become chỉ ảnh hưởng phía REMOTE) -> "Permission denied" khi fetch cố ghi vào thư
  # mục root-owned. Fix: bỏ hẳn become ở play localhost này, giữ nguyên ownership user thường.
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Chặn timestamp/tag không an toàn trước khi tạo config archive
      ansible.builtin.assert:
        that:
          - backup_ts is regex('^[0-9]{8}-[0-9]{6}$')
          - (backup_tag | default('full') | replace('-', '_')) is regex('^[A-Za-z0-9_]+$')
        fail_msg: >-
          backup-full yêu cầu backup_ts dạng YYYYMMDD-HHMMSS và backup_tag chỉ gồm chữ/số/gạch dưới.

    # icinga_config_backup_dir (mặc định /var/backups/icinga-ansible-config, 2026-07-29) nằm dưới
    # /var/backups — thư mục hệ thống, user CLI thường không có quyền tạo — CẦN sudo riêng ở ĐÚNG
    # task này (không phải cấp play, tránh lặp lại bug ở trên), rồi chown thẳng về user CLI qua
    # owner/group để các task ghi file PHÍA SAU (không sudo) vẫn ghi được bình thường.
    - name: "Tạo thư mục đích backup (sudo vì /var/backups là thư mục hệ thống, chown về user CLI)"
      become: true
      ansible.builtin.file:
        path: "{{ icinga_config_backup_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ lookup('pipe', 'id -un') }}"
        group: "{{ lookup('pipe', 'id -gn') }}"

    # icinga_config_backup_dir CỐ Ý nằm NGOÀI icinga_etc_dir (xem group_vars/all.yml) — nên archive
    # toàn bộ icinga_etc_dir không còn tự lồng backup cũ vào trong nữa, không cần exclude_path (vốn
    # không hoạt động đúng như kỳ vọng với community.general.archive — bug đã ghi nhận, tự hết theo).
    - name: "Archive toàn bộ {{ controller_config_dir }} (globals.yml, passwords.yml, mọi override)"
      become: true
      community.general.archive:
        path: "{{ controller_config_dir }}"
        # Với all-in-one, controller_config_dir và icinga_etc_dir có thể cùng là
        # /etc/icinga-ansible. Không đưa output/runtime của service (đặc biệt
        # zones.d và secrets do operator quản lý) vào controller backup.
        exclusion_patterns:
          - "{{ controller_config_dir | basename }}/icinga2"
          - "{{ controller_config_dir | basename }}/icinga2/**"
          - "{{ controller_config_dir | basename }}/icingadb"
          - "{{ controller_config_dir | basename }}/icingadb/**"
          - "{{ controller_config_dir | basename }}/icingadb-redis"
          - "{{ controller_config_dir | basename }}/icingadb-redis/**"
          - "{{ controller_config_dir | basename }}/icingaweb2"
          - "{{ controller_config_dir | basename }}/icingaweb2/**"
          - "{{ controller_config_dir | basename }}/mariadb"
          - "{{ controller_config_dir | basename }}/mariadb/**"
        dest: "{{ icinga_config_backup_dir }}/config-{{ backup_ts }}.tar.gz"
        format: gz
        mode: "0600"

    - name: Trả ownership config archive về user chạy Ansible
      become: true
      ansible.builtin.file:
        path: "{{ icinga_config_backup_dir }}/config-{{ backup_ts }}.tar.gz"
        owner: "{{ lookup('pipe', 'id -un') }}"
        group: "{{ lookup('pipe', 'id -gn') }}"
        mode: "0600"

    - name: Kiểm tra inventory nguồn được CLI truyền vào
      ansible.builtin.stat:
        path: "{{ backup_inventory_source | default('') }}"
      register: _full_inventory_source

    - name: Chặn backup không có snapshot inventory hợp lệ
      ansible.builtin.assert:
        that:
          - backup_inventory_source | default('') | length > 0
          - _full_inventory_source.stat.exists
          - _full_inventory_source.stat.isreg or _full_inventory_source.stat.isdir
        fail_msg: >-
          backup-full cần backup_inventory_source là file/thư mục inventory hiện hữu. Hãy chạy qua
          tools/icinga-ansible để inventory được snapshot cùng bundle.

    - name: Archive inventory đã dùng để tạo backup
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ icinga_config_backup_dir }}/inventory-{{ backup_ts }}.tar.gz"
          - -C
          - "{{ backup_inventory_source | dirname }}"
          - "{{ backup_inventory_source | basename }}"

    - name: Siết quyền inventory archive
      ansible.builtin.file:
        path: "{{ icinga_config_backup_dir }}/inventory-{{ backup_ts }}.tar.gz"
        mode: "0600"

    - name: Đọc cấu trúc inventory archive vừa tạo
      ansible.builtin.command:
        argv:
          - tar
          - -tzf
          - "{{ icinga_config_backup_dir }}/inventory-{{ backup_ts }}.tar.gz"
      register: _full_inventory_members
      changed_when: false

    - name: Chặn inventory archive rỗng hoặc có đường dẫn không an toàn
      ansible.builtin.assert:
        that:
          - _full_inventory_members.stdout_lines | length > 0
          - _full_inventory_members.stdout_lines | select('match', '^/') | list | length == 0
          - _full_inventory_members.stdout_lines | select('search', '(^|/)\.\.(/|$)') | list | length == 0
          - >-
            _full_inventory_members.stdout_lines
            | select('match', '^' ~ (backup_inventory_source | basename | regex_escape) ~ '(/|$)')
            | list | length > 0
        fail_msg: "Inventory archive không đúng tar layout hoặc chứa đường dẫn không an toàn."

    - name: Ghi metadata topology và IP tại thời điểm backup
      ansible.builtin.copy:
        content: |
          {
            "schema": 3,
            "timestamp": {{ backup_ts | to_json }},
            "code_revision": {{ backup_code_revision | default('unknown') | to_json }},
            "database_type": {{ icinga_database_type | to_json }},
            "master_zone_name": {{ icinga_master_zone_name | to_json }},
            "groups": {
              "master": {{ groups['master'] | default([]) | to_json }},
              "satellite": {{ groups['satellite'] | default([]) | to_json }},
              "client": {{ groups['client'] | default([]) | to_json }},
              "galera": {{ groups['galera'] | default([]) | to_json }}
            },
            "ansible_hosts": {
          {% set node_hosts = ((groups['master'] | default([])) + (groups['satellite'] | default([])) + (groups['client'] | default([])) + (groups['galera'] | default([]))) | unique | list %}
          {% for node in node_hosts %}
              {{ node | to_json }}: {{ (hostvars[node].ansible_host | default(node) | string) | to_json }}{{ ',' if not loop.last else '' }}
          {% endfor %}
            },
            "images": {{ images | to_json }}
          }
        dest: "{{ icinga_config_backup_dir }}/cluster-{{ backup_ts }}.json"
        mode: "0600"

    - name: Tạo thư mục archive state của từng Icinga endpoint
      ansible.builtin.file:
        path: "{{ node_state_controller_backup_dir }}"
        state: directory
        mode: "0700"

    - name: Tạo thư mục archive config đầy đủ của từng managed node
      ansible.builtin.file:
        path: "{{ node_config_controller_backup_dir }}"
        state: directory
        mode: "0700"

- name: "Backup full (2/5) — managed database + PKI (role mariadb, tag 'full')"
  # icinga_action + backup_tag được CLI truyền qua extra-vars; dùng tên riêng
  # thay vì biến reserved `action` của Ansible.
  hosts: galera
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  roles:
    - role: mariadb
      when: icinga_database_type == 'managed_db'

- name: "Backup full (2b/5) — đưa database + PKI về deployment node"
  hosts: "{{ (groups['galera'] | default([]) | first) | default('localhost', true) }}"
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Tạo thư mục lưu PKI trên deployment node
      ansible.builtin.file:
        path: "{{ pki_controller_backup_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Tạo thư mục lưu DB trên deployment node với managed DB
      ansible.builtin.file:
        path: "{{ mariadb_controller_backup_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: icinga_database_type == 'managed_db'

    # Managed DB đã tạo PKI archive trong role mariadb cùng timestamp với DB.
    # External DB không chạy role đó, nhưng PKI vẫn thuộc icinga-ansible và vẫn
    # bắt buộc phải có trong một full backup hoàn chỉnh.
    - name: Tạo thư mục stage PKI trên CA host với external DB
      ansible.builtin.file:
        path: "{{ mariadb_backup.destination }}"
        state: directory
        mode: "0700"
      delegate_to: "{{ ca_host }}"
      when: icinga_database_type == 'external'

    - name: Kiểm tra CA nguồn trước khi backup với external DB
      ansible.builtin.stat:
        path: "{{ icinga_base_dir }}/icinga2/data/var/lib/icinga2/ca/{{ item }}"
      loop: [ca.crt, ca.key]
      register: _full_external_pki_sources
      delegate_to: "{{ ca_host }}"
      when: icinga_database_type == 'external'

    - name: Chặn external full backup nếu CA nguồn không hoàn chỉnh
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: "CA source {{ item.item }} trên {{ ca_host }} thiếu/rỗng; không công bố full backup."
      loop: "{{ _full_external_pki_sources.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: icinga_database_type == 'external'

    - name: Snapshot CA/PKI với external DB
      community.general.archive:
        path: "{{ icinga_base_dir }}/icinga2/data/var/lib/icinga2/ca"
        dest: "{{ mariadb_backup.destination }}/pki-{{ backup_ts }}.tar.gz"
        format: gz
        mode: "0600"
      delegate_to: "{{ ca_host }}"
      when: icinga_database_type == 'external'

    - name: Xác nhận external PKI archive chứa certificate và private key
      ansible.builtin.shell: |
        set -euo pipefail
        members=$(tar -tzf {{ (mariadb_backup.destination ~ '/pki-' ~ backup_ts ~ '.tar.gz') | quote }})
        grep -Eq '(^|/)ca\.crt$' <<<"$members"
        grep -Eq '(^|/)ca\.key$' <<<"$members"
      args:
        executable: /bin/bash
      changed_when: false
      delegate_to: "{{ ca_host }}"
      when: icinga_database_type == 'external'

    - name: Xác minh DB artifact vừa tạo trên node Galera chính
      ansible.builtin.stat:
        path: "{{ mariadb_backup.destination }}/{{ backup_filename }}"
        checksum_algorithm: sha256
      register: _full_db_remote
      when: icinga_database_type == 'managed_db'

    - name: Chặn nếu DB artifact nguồn không tồn tại hoặc rỗng
      ansible.builtin.assert:
        that:
          - _full_db_remote.stat.exists
          - _full_db_remote.stat.isreg
          - _full_db_remote.stat.size | int > 0
        fail_msg: "Không thể gom backup-full: DB artifact trên galera[0] không hợp lệ."
      when: icinga_database_type == 'managed_db'

    - name: Fetch DB artifact về deployment node
      ansible.builtin.fetch:
        src: "{{ mariadb_backup.destination }}/{{ backup_filename }}"
        dest: "{{ mariadb_controller_backup_dir }}/{{ backup_filename }}"
        flat: true
        validate_checksum: true
      when: icinga_database_type == 'managed_db'

    - name: Siết quyền DB artifact đã fetch
      ansible.builtin.file:
        path: "{{ mariadb_controller_backup_dir }}/{{ backup_filename }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: icinga_database_type == 'managed_db'

    - name: Xác minh PKI artifact vừa tạo trên CA host
      ansible.builtin.stat:
        path: "{{ mariadb_backup.destination }}/pki-{{ backup_ts }}.tar.gz"
        checksum_algorithm: sha256
      register: _full_pki_remote
      delegate_to: "{{ ca_host }}"
      when: ca_host | length > 0

    - name: Chặn nếu PKI artifact nguồn không tồn tại hoặc rỗng
      ansible.builtin.assert:
        that:
          - _full_pki_remote.stat.exists
          - _full_pki_remote.stat.isreg
          - _full_pki_remote.stat.size | int > 0
        fail_msg: "Không thể gom backup-full: PKI artifact trên CA host không hợp lệ."
      when: ca_host | length > 0

    - name: Fetch PKI artifact về deployment node
      ansible.builtin.fetch:
        src: "{{ mariadb_backup.destination }}/pki-{{ backup_ts }}.tar.gz"
        dest: "{{ pki_controller_backup_dir }}/pki-{{ backup_ts }}.tar.gz"
        flat: true
        validate_checksum: true
      delegate_to: "{{ ca_host }}"
      when: ca_host | length > 0

    - name: Siết quyền PKI artifact đã fetch
      ansible.builtin.file:
        path: "{{ pki_controller_backup_dir }}/pki-{{ backup_ts }}.tar.gz"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: ca_host | length > 0

    - name: Ghi con trỏ DB backup-full sau khi cả DB và PKI đã fetch thành công
      ansible.builtin.copy:
        content: "{{ backup_ts }}"
        dest: "{{ mariadb_controller_backup_dir }}/LATEST_{{ backup_tag_norm | upper }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when:
        - icinga_database_type == 'managed_db'
        - ca_host | length > 0

- name: "Backup full (3/5) — toàn bộ /etc/icinga-ansible trên từng managed node"
  hosts: all_hosts
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    _node_config_stage: "/tmp/icinga-node-config-{{ inventory_hostname }}-{{ backup_ts }}"
    _node_config_archive: "/tmp/etc-icinga-ansible-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
  tasks:
    - name: Kiểm tra cây config cục bộ của node
      ansible.builtin.stat:
        path: "{{ icinga_etc_dir }}"
      register: _node_config_source

    - name: Chặn full backup nếu node chưa có cây config
      ansible.builtin.assert:
        that:
          - _node_config_source.stat.exists
          - _node_config_source.stat.isdir
        fail_msg: "{{ inventory_hostname }} chưa có {{ icinga_etc_dir }}; node chưa deploy hoàn chỉnh."

    - name: Đóng gói nguyên trạng cây config của node
      block:
        - name: Tạo staging sạch cho config node
          ansible.builtin.file:
            path: "{{ _node_config_stage }}"
            state: "{{ item }}"
            mode: "0700"
          loop: [absent, directory]

        - name: Tạo archive config node với layout cố định
          ansible.builtin.shell: |
            set -euo pipefail
            install -d -m 0700 {{ (_node_config_stage + '/node-config/etc') | quote }}
            cp -a -- {{ icinga_etc_dir | quote }} \
              {{ (_node_config_stage + '/node-config/etc/icinga-ansible') | quote }}
            tar --numeric-owner -C {{ _node_config_stage | quote }} \
              -czf {{ _node_config_archive | quote }} node-config
            chmod 0600 {{ _node_config_archive | quote }}
          args:
            executable: /bin/bash

        - name: Xác nhận archive config node có layout an toàn
          ansible.builtin.shell: |
            set -euo pipefail
            members=$(tar -tzf {{ _node_config_archive | quote }})
            test -n "$members"
            ! grep -Eq '(^|/)\.\.(/|$)|^/' <<<"$members"
            ! grep -Ev '^node-config(/|$)' <<<"$members"
            grep -Fxq 'node-config/etc/icinga-ansible/' <<<"$members"
          args:
            executable: /bin/bash
          changed_when: false

        - name: Fetch archive config node về deployment node
          ansible.builtin.fetch:
            src: "{{ _node_config_archive }}"
            dest: >-
              {{ node_config_controller_backup_dir }}/etc-icinga-ansible-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz
            flat: true
            validate_checksum: true

        - name: Siết quyền archive config node trên deployment node
          ansible.builtin.file:
            path: >-
              {{ node_config_controller_backup_dir }}/etc-icinga-ansible-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz
            mode: "0600"
          delegate_to: localhost
          become: false
      always:
        - name: Dọn staging config node
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ _node_config_stage }}"
            - "{{ _node_config_archive }}"

- name: "Backup full (4/5) — Icinga 2 config và identity trên từng endpoint"
  hosts: master:satellite:client
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    _node_stage: "/tmp/icinga-node-state-{{ inventory_hostname }}-{{ backup_ts }}"
    _node_archive: "/tmp/icinga2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
    _node_config: "{{ icinga_etc_dir }}/icinga2"
    _node_lib: "{{ icinga_base_dir }}/icinga2/data/var/lib/icinga2"
  tasks:
    - name: Kiểm tra config và certificate bắt buộc của endpoint
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ _node_config }}/icinga2.conf"
        - "{{ _node_lib }}/certs/{{ inventory_hostname }}.crt"
        - "{{ _node_lib }}/certs/{{ inventory_hostname }}.key"
        - "{{ _node_lib }}/certs/ca.crt"
      register: _node_required_sources

    - name: Chặn full backup nếu endpoint chưa có state hoàn chỉnh
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
        fail_msg: >-
          {{ inventory_hostname }} thiếu/rỗng {{ item.item }}. Full backup không được công bố khi
          một endpoint trong inventory chưa deploy hoặc có identity không hoàn chỉnh.
      loop: "{{ _node_required_sources.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Kiểm tra Icinga DB environment identity trên master
      ansible.builtin.stat:
        path: "{{ _node_lib }}/icingadb.env"
      register: _node_master_environment
      when: inventory_hostname in groups['master']

    - name: Chặn full backup nếu master chưa có environment identity
      ansible.builtin.assert:
        that:
          - _node_master_environment.stat.exists
          - _node_master_environment.stat.isreg
          - _node_master_environment.stat.size | int > 0
        fail_msg: >-
          {{ inventory_hostname }} thiếu icingadb.env; không thể tạo full-cluster backup có identity
          khôi phục được.
      when: inventory_hostname in groups['master']

    - name: Tạo archive node-state trong staging an toàn
      block:
        - name: Tạo staging root sạch
          ansible.builtin.file:
            path: "{{ _node_stage }}"
            state: "{{ item }}"
            mode: "0700"
          loop: [absent, directory]

        - name: Copy config, certificate và environment identity vào staging
          ansible.builtin.shell: |
            set -euo pipefail
            install -d -m 0700 \
              {{ (_node_stage + '/node-state/etc') | quote }} \
              {{ (_node_stage + '/node-state/var/lib/icinga2') | quote }}
            cp -a -- {{ _node_config | quote }} \
              {{ (_node_stage + '/node-state/etc/icinga2') | quote }}
            cp -a -- {{ (_node_lib + '/certs') | quote }} \
              {{ (_node_stage + '/node-state/var/lib/icinga2/certs') | quote }}
            if [ -s {{ (_node_lib + '/icingadb.env') | quote }} ]; then
              cp -a -- {{ (_node_lib + '/icingadb.env') | quote }} \
                {{ (_node_stage + '/node-state/var/lib/icinga2/icingadb.env') | quote }}
            fi
            tar --numeric-owner -C {{ _node_stage | quote }} -czf {{ _node_archive | quote }} node-state
            chmod 0600 {{ _node_archive | quote }}
          args:
            executable: /bin/bash

        - name: Xác nhận archive node-state an toàn và có đủ identity
          ansible.builtin.shell: |
            set -euo pipefail
            members=$(tar -tzf {{ _node_archive | quote }})
            test -n "$members"
            ! grep -Eq '(^|/)\.\.(/|$)|^/' <<<"$members"
            ! grep -Ev '^node-state(/|$)' <<<"$members"
            grep -Fxq 'node-state/etc/icinga2/icinga2.conf' <<<"$members"
            grep -Fxq {{ ('node-state/var/lib/icinga2/certs/' + inventory_hostname + '.crt') | quote }} <<<"$members"
            grep -Fxq {{ ('node-state/var/lib/icinga2/certs/' + inventory_hostname + '.key') | quote }} <<<"$members"
            grep -Fxq 'node-state/var/lib/icinga2/certs/ca.crt' <<<"$members"
            {% if inventory_hostname in groups['master'] %}
            grep -Fxq 'node-state/var/lib/icinga2/icingadb.env' <<<"$members"
            {% endif %}
          args:
            executable: /bin/bash
          changed_when: false

        - name: Fetch archive node-state về deployment node
          ansible.builtin.fetch:
            src: "{{ _node_archive }}"
            dest: "{{ node_state_controller_backup_dir }}/icinga2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
            flat: true
            validate_checksum: true

        - name: Siết quyền archive node-state trên deployment node
          ansible.builtin.file:
            path: "{{ node_state_controller_backup_dir }}/icinga2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
            mode: "0600"
          delegate_to: localhost
          become: false
      always:
        - name: Dọn staging node-state trên endpoint
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ _node_stage }}"
            - "{{ _node_archive }}"

- name: "Backup full (5/5) — icingaweb2 config (resources.ini... sửa qua UI) trên mọi master"
  hosts: master
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Archive icingaweb2 config trên chính node
      community.general.archive:
        path: "{{ icinga_etc_dir }}/icingaweb2"
        dest: "/tmp/icingaweb2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
        format: gz
        mode: "0600"

    - name: Fetch archive về deployment node
      ansible.builtin.fetch:
        src: "/tmp/icingaweb2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
        dest: "{{ icinga_config_backup_dir }}/"
        flat: true

    - name: Siết quyền archive web đã fetch (chứa DB/Redis credential)
      ansible.builtin.file:
        path: "{{ icinga_config_backup_dir }}/icingaweb2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Dọn file tạm trên node
      ansible.builtin.file:
        path: "/tmp/icingaweb2-{{ inventory_hostname }}-{{ backup_ts }}.tar.gz"
        state: absent

- name: "Backup full — xác minh bundle và công bố completion marker"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    _full_backup_tag: "{{ backup_tag | default('full') | replace('-', '_') }}"
  tasks:
    - name: Khởi tạo danh sách artifact bắt buộc của full backup
      ansible.builtin.set_fact:
        _full_bundle_paths:
          - "{{ icinga_config_backup_dir }}/config-{{ backup_ts }}.tar.gz"
          - "{{ icinga_config_backup_dir }}/inventory-{{ backup_ts }}.tar.gz"
          - "{{ icinga_config_backup_dir }}/cluster-{{ backup_ts }}.json"
          - "{{ pki_controller_backup_dir }}/pki-{{ backup_ts }}.tar.gz"

    - name: Thêm archive node-state của từng Icinga endpoint vào danh sách bắt buộc
      ansible.builtin.set_fact:
        _full_bundle_paths: >-
          {{
            _full_bundle_paths
            + [node_state_controller_backup_dir ~ '/icinga2-' ~ item ~ '-' ~ backup_ts ~ '.tar.gz']
          }}
      loop: >-
        {{
          ((groups['master'] | default([]))
           + (groups['satellite'] | default([]))
           + (groups['client'] | default([]))) | unique | list
        }}

    - name: Thêm archive toàn bộ config của từng managed node vào danh sách bắt buộc
      ansible.builtin.set_fact:
        _full_bundle_paths: >-
          {{
            _full_bundle_paths
            + [node_config_controller_backup_dir ~ '/etc-icinga-ansible-' ~ item ~ '-' ~ backup_ts ~ '.tar.gz']
          }}
      loop: "{{ groups['all_hosts'] | default([]) | unique | list }}"

    - name: Thêm archive Icinga Web của từng master vào danh sách bắt buộc
      ansible.builtin.set_fact:
        _full_bundle_paths: >-
          {{ _full_bundle_paths + [icinga_config_backup_dir ~ '/icingaweb2-' ~ item ~ '-' ~ backup_ts ~ '.tar.gz'] }}
      loop: "{{ groups['master'] | default([]) }}"

    - name: Thêm DB vào danh sách bắt buộc với managed DB
      ansible.builtin.set_fact:
        _full_bundle_paths: >-
          {{
            _full_bundle_paths
            + [mariadb_controller_backup_dir ~ '/db-' ~ _full_backup_tag ~ '-' ~ backup_ts ~ '.xb.gz']
          }}
      when: icinga_database_type == 'managed_db'

    - name: Tính SHA-256 cho mọi artifact bắt buộc của full backup
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop: "{{ _full_bundle_paths }}"
      register: _full_bundle_stats

    - name: Chặn công bố full backup nếu bất kỳ artifact nào thiếu hoặc rỗng
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size | int > 0
          - item.stat.checksum | default('') | length == 64
        fail_msg: >-
          Full backup chưa hoàn chỉnh tại {{ item.item }}; không tạo manifest và không cập nhật
          LATEST_COMPLETE.
      loop: "{{ _full_bundle_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Ghi manifest checksum của bundle đã hoàn chỉnh
      ansible.builtin.copy:
        content: |
          # icinga-ansible full backup {{ backup_ts }}
          # database_type={{ icinga_database_type }} masters={{ groups['master'] | default([]) | join(',') }}
          {% for artifact in _full_bundle_stats.results %}
          {{ artifact.stat.checksum }}  {{ artifact.item | replace(icinga_config_backup_dir ~ '/', '') }}
          {% endfor %}
        dest: "{{ icinga_config_backup_dir }}/manifest-{{ backup_ts }}.sha256"
        mode: "0600"

    - name: Cập nhật LATEST_COMPLETE sau cùng
      ansible.builtin.copy:
        content: "{{ backup_ts }}"
        dest: "{{ icinga_config_backup_dir }}/LATEST_COMPLETE"
        mode: "0600"

    - name: In vị trí backup
      ansible.builtin.debug:
        msg: >-
          Backup xong — toàn bộ artifact DR đã được gom về {{ icinga_config_backup_dir }}/:
          config-{{ backup_ts }}.tar.gz, inventory-{{ backup_ts }}.tar.gz,
          cluster-{{ backup_ts }}.json, node-config/etc-icinga-ansible-*-{{ backup_ts }}.tar.gz,
          nodes/icinga2-*-{{ backup_ts }}.tar.gz,
          icingaweb2-*-{{ backup_ts }}.tar.gz,
          {{ ('database/db-' ~ (backup_tag | default('full') | replace('-', '_')) ~ '-' ~ backup_ts
              ~ '.xb.gz, database/LATEST_'
              ~ (backup_tag | default('full') | replace('-', '_') | upper) ~ ' và ')
             if icinga_database_type == 'managed_db'
             else 'database do DBA external backup riêng; ' }}
          pki/pki-{{ backup_ts }}.tar.gz. Bundle hoàn chỉnh được xác nhận bởi
          manifest-{{ backup_ts }}.sha256 và LATEST_COMPLETE. Hãy sao chép thư mục này sang storage
          nằm ngoài hạ tầng.
