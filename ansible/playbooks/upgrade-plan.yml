# =============================================================================
# upgrade-plan.yml — DRY-RUN: dò image đang chạy vs icinga_image_versions (globals.yml) + schema DB.
# KHÔNG đổi gì trên hệ thống (chỉ có thể pull image đích để đọc metadata). Xem design.md mục 13.2.
# File nằm trong playbooks/ -> nạp group_vars/all.yml tường minh (giống destroy.yml).
# =============================================================================
- name: Upgrade plan (dry-run)
  hosts: master
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  tasks:
    - name: Chặn plan external DB cho tới khi toàn bộ query dùng service credential
      ansible.builtin.assert:
        that: icinga_database_type == 'managed_db'
        fail_msg: >-
          upgrade-plan hiện chỉ hỗ trợ managed_db. Nhánh external DB không được phép dùng root và
          chưa có mô hình backup/rollback do DBA xác nhận.
      run_once: true

    - name: Chạy plan trên ca_host
      ansible.builtin.include_role:
        name: upgrade
        tasks_from: plan
      when: inventory_hostname == ca_host
