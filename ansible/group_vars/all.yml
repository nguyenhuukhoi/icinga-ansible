# =============================================================================
# Biến mặc định + suy diễn. KHÔNG sửa trực tiếp — chỉnh trong etc/.../globals.yml.
# =============================================================================

# Python dùng để chạy module trên managed node. Venv /path/to/venv chỉ chạy Ansible CLI trên
# deployment node; không dùng Python trong venv đó cho master/satellite/Galera. Project chỉ hỗ trợ
# Ubuntu 24.04/26.04 nên /usr/bin/python3 luôn là interpreter ổn định trên host đích.
ansible_python_interpreter: "/usr/bin/python3"

# --- Version image: khai THẲNG trong globals.yml (icinga_image_versions) ----------------
# KHÔNG còn "bộ phiên bản" (version_sets/version-matrix.yml) — Icinga phát hành từng thành phần
# ĐỘC LẬP, không có bundle có tên chính thức như OpenStack/kolla, nên gom set là quy ước nhân tạo,
# đã bỏ (quyết định người dùng 2026-07-22). Nguồn version DUY NHẤT giờ là icinga_image_versions
# trong globals.yml. Nâng cấp = sửa tag ở đó rồi chạy 'icinga-ansible upgrade' (design.md mục 13).
# prechecks kiểm tra đủ khoá + không rỗng trước khi deploy.

# module_catalog: metadata cho đúng các module web mà role hỗ trợ:
#   A = chỉ enable | B = enable + config .ini | C = enable + DB riêng + migration
# "requires" dùng để TỰ GIẢI PHỤ THUỘC (roles/icingaweb2/tasks/main.yml — khai "director" tự kéo
# theo "incubator", không cần liệt kê tay trong enable_icingaweb2_modules).
module_catalog:
  icingadb:        { type: B, needs: [resource_icingadb, redis] }
  incubator:       { type: A }
  director:        { type: C, db: director, requires: [incubator] }

# --- Thư mục state trên host (data — KHÔNG tái sinh được, đừng lẫn với config) ------
icinga_base_dir: "/var/lib/icinga-ansible"

# --- Thư mục config hiệu lực trên TỪNG target node (giống /etc/kolla/<svc>) ----------
# Chứa cả file hạ tầng do role render và file local do service/operator tạo. `remove-*`/`destroy`
# cố ý xoá cây này trên target; phần operator/UI phải được backup bằng quy trình tương ứng.
# Mặc định TRÙNG path với CONFIG_DIR bên deploy node (tools/icinga-ansible) nhưng khác Ý NGHĨA:
# bên deploy node là input (globals.yml/passwords.yml/config override); bên target node đây là
# OUTPUT (config đã render xong cho service chạy trên đúng node đó) — xem design.md mục 4.1.
icinga_etc_dir: "/etc/icinga-ansible"

# --- Thư mục override trên DEPLOY NODE (giống /etc/kolla/config/<svc>) --------------
# CLI (tools/icinga-ansible) LUÔN truyền đè qua -e deploy_config_dir="$CONFIG_DIR/config" —
# giá trị dưới đây chỉ là fallback nếu role bị gọi tay không qua CLI (vd test/debug). KHÔNG dùng
# để merge vào output, chỉ là NGUỒN Ansible đọc trên chính control node trước khi ghi ra target node.
deploy_config_dir: "/etc/icinga-ansible/config"
# Directory on the Ansible control node. This can differ from icinga_etc_dir
# when ICINGA_ANSIBLE_CONFIG_DIR is used to manage multiple deployments.
controller_config_dir: "/etc/icinga-ansible"

# --- Thư mục backup-full (config + icingaweb2), trên DEPLOY NODE --------------------
# CỐ Ý đặt NGOÀI icinga_etc_dir (khác {{ icinga_etc_dir }}/backups trước đây, 2026-07-29 sau khi
# regression test phát hiện destroy.yml play "xoá cấu hình trên control node" liệt kê MỌI thứ trong
# icinga_etc_dir rồi xoá hết trừ đúng 2 tên file globals.yml/passwords.yml — kể cả khi destroy chỉ
# nhắm 1 inventory/cụm, nó vẫn xoá sạch backups/ của MỌI cụm khác đang dùng chung control node, đã
# gây mất backup thật trong lúc test. Đặt hẳn ra ngoài, cùng kiểu với mariadb_backup.destination
# ("/var/backups/icinga-db", nằm trên node DB, cũng ngoài icinga_etc_dir) — destroy.yml chỉ đụng tới
# icinga_etc_dir nên path này an toàn tuyệt đối trước mọi lần destroy, không cần sửa gì destroy.yml.
# Tác dụng phụ: hết luôn bug "exclude_path không hoạt động" (design.md 10.6) — trước đây backups/
# nằm trong chính icinga_etc_dir nên mỗi lần backup-full lại vô tình đóng gói backup cũ vào tar mới.
icinga_config_backup_dir: "/var/backups/icinga-ansible-config"
# Database/PKI artifacts copied back to the deployment node by backup-full. Keeping the physical DB
# backup only on galera[0] makes it disappear in the exact disaster scenario backup-full is meant to
# cover. These directories live under the controller backup root and survive loss of all service nodes.
mariadb_controller_backup_dir: "{{ icinga_config_backup_dir }}/database"
pki_controller_backup_dir: "{{ icinga_config_backup_dir }}/pki"
# Per-endpoint archives produced by backup-full. Each archive contains the complete bind-mounted
# Icinga 2 configuration tree plus the endpoint certificate and, on masters, icingadb.env. This is
# deliberately separate from the controller desired-state archive: generated topology is reconciled
# from the selected restore inventory, while operator-owned zones.d/secrets/plugins are preserved.
node_state_controller_backup_dir: "{{ icinga_config_backup_dir }}/nodes"

# --- Suy diễn topology từ inventory -------------------------------------------
master_count:    "{{ groups['master'] | default([]) | length }}"
satellite_count: "{{ groups['satellite'] | default([]) | length }}"
galera_count:    "{{ groups['galera'] | default([]) | length }}"

# Patch updates inside one MariaDB release series are rolling-safe. Crossing
# series can introduce config/protocol incompatibilities, so require an
# explicit operator acknowledgement after reviewing the documented source to
# target path. The rolling role independently blocks a Galera provider package
# downgrade. Rollback restores the pre-upgrade backup rather than attempting an
# unsupported in-place binary downgrade.
mariadb_allow_rolling_series_upgrade: false
is_ha_master:    "{{ (groups['master'] | default([]) | length) > 1 }}"   # >1, không chỉ ==2 (N master)
ca_host:         "{{ (groups['master'] | default([]))[0] | default('') }}"   # master[0] = CA gốc

# Tên Icinga zone chứa các endpoint thuộc inventory group [master]. Group role vẫn luôn
# là [master]; chỉ tên object Zone/path zones.d thay đổi theo biến này.
icinga_master_zone_name: "master"


# --- Zone satellite (khai trong globals; rỗng ở P1) ---------------------------
satellite_zones: []


# --- Timezone hiển thị Icinga Web 2 (config.ini [global] timezone) ------------
# Default cho user Việt Nam — override trong globals.yml nếu cần múi giờ khác.
icingaweb2_timezone: "Asia/Ho_Chi_Minh"

# Bật module Director chỉ chuẩn bị DB/schema/module. Người vận hành tự Kickstart và quản lý object.

# --- Proxy (globals override; mặc định dùng /etc/environment của managed node) -
# proxy_group_overrides (2026-09-13, tuỳ chọn — khai trong globals.yml): override proxy RIÊNG cho
# từng nhóm vai trò (master/satellite/galera/client) — dùng khi các nhóm nằm ở mạng khác nhau, mỗi
# mạng ra Internet qua 1 proxy riêng (hoặc 1 nhóm không cần proxy dù nhóm khác cần). Field nào không
# khai trong 1 nhóm (http/https/no_proxy) rơi về đúng giá trị global proxy_http/https/no_proxy phía
# trên — không phải "khai 1 field thì phải khai đủ cả 3" theo từng nhóm.
proxy_group_overrides: {}

# Thứ tự ưu tiên CỐ ĐỊNH — khác cơ chế "override config theo nhóm" ở render_config_item.yml (nơi đó
# dùng group_names vì tên nhóm override do người dùng tự đặt tuỳ ý). Ở đây chỉ có đúng 4 nhóm VAI TRÒ
# cố định của chính topology (không ai đặt thêm nhóm khác cho việc này), nên liệt kê tường minh để
# kết quả LUÔN dự đoán được, không phụ thuộc thứ tự group_names (vốn không đảm bảo — xem design.md
# mục 4.1). 1 host thuộc nhiều nhóm cùng lúc (hiếm, vd all-in-one thuộc cả master+galera) lấy nhóm
# đứng TRƯỚC trong danh sách này.
_proxy_group_priority: [master, satellite, galera, client]
_proxy_group_match: >-
  {{ (_proxy_group_priority
      | select('in', group_names)
      | select('in', proxy_group_overrides.keys() | list)
      | list | first) | default('', true) }}

proxy_http_effective: >-
  {{ (proxy_group_overrides[_proxy_group_match].http | default(proxy_http))
     if _proxy_group_match | length > 0 else proxy_http }}
proxy_https_effective: >-
  {{ (proxy_group_overrides[_proxy_group_match].https | default(proxy_https))
     if _proxy_group_match | length > 0 else proxy_https }}
proxy_no_proxy_effective: >-
  {{ (proxy_group_overrides[_proxy_group_match].no_proxy | default(proxy_no_proxy))
     if _proxy_group_match | length > 0 else proxy_no_proxy }}

# Một nguồn proxy đơn giản như host Kolla: nếu globals.yml không khai proxy_http thì dùng proxy đã
# được PAM nạp từ /etc/environment vào facts.env trên managed node. Khi globals.yml có khai proxy,
# giá trị explicit (kể cả proxy_group_overrides) vẫn ưu tiên và common role ghi nó vào
# /etc/environment. Không lấy no_proxy mặc định của globals khi đang fallback, vì làm vậy sẽ trộn
# hai nguồn và có thể làm mất NO_PROXY thực tế của host.
_managed_host_environment: >-
  {{ _managed_host_environment_file
     | default(ansible_facts.env | default({})) }}
proxy_http_runtime: >-
  {{ proxy_http_effective
     if (proxy_http_effective | default('')) | length > 0
     else (_managed_host_environment.get('http_proxy', '') or
           _managed_host_environment.get('HTTP_PROXY', '')) }}
proxy_https_runtime: >-
  {{ proxy_https_effective
     if (proxy_https_effective | default('')) | length > 0
     else (_managed_host_environment.get('https_proxy', '') or
           _managed_host_environment.get('HTTPS_PROXY', '')) }}
proxy_no_proxy_runtime: >-
  {{ proxy_no_proxy_effective
     if ((proxy_http_effective | default('')) | length > 0 or
         (proxy_https_effective | default('')) | length > 0)
     else (_managed_host_environment.get('no_proxy', '') or
           _managed_host_environment.get('NO_PROXY', '')) }}

# Dùng cho task apt/get_url và env container icinga2. Biến được đánh giá lazy
# sau gather_facts nên facts.env đã có proxy từ /etc/environment; lúc fact gathering chưa xong,
# dictionary rỗng {} không ghi đè môi trường mà PAM của SSH/sudo đã nạp.
proxy_environment: >-
  {{ {'http_proxy': proxy_http_runtime,
      'https_proxy': proxy_https_runtime,
      'no_proxy': proxy_no_proxy_runtime}
     if ((proxy_http_runtime | default('')) | length > 0 or
         (proxy_https_runtime | default('')) | length > 0)
     else {} }}

# --- Image helper -------------------------------------------------------------
# registry_prefix: mirror riêng nếu có (docker_registry), rỗng = public Docker Hub.
# LƯU Ý repo thực tế:
#   - icinga2/icingadb/icingaweb2 -> namespace 'icinga/'
#   - Redis    -> image official 'redis' (KHÔNG có icinga/icingadb-redis trên Hub)
#   - MariaDB  -> image official 'mariadb' (KHÔNG có icinga/mariadb)
registry_prefix: "{{ (docker_registry ~ '/') if docker_registry | length > 0 else '' }}"

# KHÔNG dùng "| default(...)" cho tag — thiếu khoá phải fail rõ ràng (prechecks bắt trước), không
# âm thầm rơi về 'latest'/'lts' (đúng tinh thần: version phải khai tường minh, không đoán).
# images_upstream: LUÔN là image chính chủ Docker Hub (registry_prefix/docker_namespace) — KHÔNG BAO
# GIỜ bị custom ghi đè. Dùng làm giá trị mặc định khi image đó không có trong custom_image_overrides.
images_upstream:
  icinga2:        "{{ registry_prefix }}{{ docker_namespace }}/icinga2:{{ icinga_image_versions.icinga2 }}"
  icingadb:       "{{ registry_prefix }}{{ docker_namespace }}/icingadb:{{ icinga_image_versions.icingadb }}"
  icingaweb2:     "{{ registry_prefix }}{{ docker_namespace }}/icingaweb2:{{ icinga_image_versions.icingaweb2 }}"
  icingadb_redis: "{{ registry_prefix }}redis:{{ icinga_image_versions.icingadb_redis }}"
  mariadb:        "{{ registry_prefix }}mariadb:{{ icinga_image_versions.mariadb }}"

# --- Custom image: TỰ build/push bằng cách nào cũng được (icinga-ansible KHÔNG tự build — design.md
# mục 9.6) — chỉ cần khai registry + đúng "basename:tag" bạn đã push lên, cụm sẽ PULL đúng cái đó.
# Registry DÙNG CHUNG cho mọi custom image (thường chỉ có 1 registry riêng, vd 1 project trên Harbor).
custom_image_registry: ""              # vd "10.10.10.151:8081/icinga"
# custom_image_overrides: ghi đè TRỰC TIẾP phần "basename:tag" (SAU registry) của bất kỳ image nào
# (đúng key trong images_upstream) — rỗng/không có key = image đó dùng bản gốc (images_upstream),
# không đổi gì. Tự đặt tag/suffix tuỳ ý, không ép "-custom" hay bất kỳ quy ước nào.
# vd: { icinga2: "icinga2:2.16.5-custom" } hoặc { icinga2: "icinga2:2.16.5-anything" }
custom_image_overrides: {}
docker_registry_ca_file: ""

# images: giá trị THỰC TẾ dùng khi khởi động container — mọi role (icinga2/icingadb/icingaweb2/
# mariadb/redis) CHỈ tham chiếu images.<tên>, KHÔNG cần biết có override hay không.
images:
  icinga2: >-
    {{ (custom_image_registry ~ '/' ~ custom_image_overrides.icinga2)
       if 'icinga2' in (custom_image_overrides | default({})) else images_upstream.icinga2 }}
  icingadb: >-
    {{ (custom_image_registry ~ '/' ~ custom_image_overrides.icingadb)
       if 'icingadb' in (custom_image_overrides | default({})) else images_upstream.icingadb }}
  icingaweb2: >-
    {{ (custom_image_registry ~ '/' ~ custom_image_overrides.icingaweb2)
       if 'icingaweb2' in (custom_image_overrides | default({})) else images_upstream.icingaweb2 }}
  icingadb_redis: >-
    {{ (custom_image_registry ~ '/' ~ custom_image_overrides.icingadb_redis)
       if 'icingadb_redis' in (custom_image_overrides | default({})) else images_upstream.icingadb_redis }}
  mariadb: >-
    {{ (custom_image_registry ~ '/' ~ custom_image_overrides.mariadb)
       if 'mariadb' in (custom_image_overrides | default({})) else images_upstream.mariadb }}

# managed_db: default = giữ hành vi cũ (host rỗng -> tự suy ra galera[0], port 3306). Optional trong
# globals.yml (giống satellite_zones) — config cũ không khai gì vẫn chạy y hệt trước, không cần sửa.
managed_db:
  host: ""
  port: 3306

# --- DB endpoint (managed_db -> managed_db.host nếu khai, else IP của galera[0] ; external -> external_db) ---
# LƯU Ý: phải là ĐỊA CHỈ IP, không dùng tên 'localhost' (mysql client sẽ nối qua
# UNIX socket -> lỗi SQLSTATE[2002]). Với host network, 127.0.0.1 là đúng.
# managed_db (2026-07-22): cho phép khai thẳng host/port thay vì luôn suy ra từ galera[0] — hữu ích
# khi có VIP/proxy đặt trước cluster Galera. host="" (mặc định) giữ nguyên hành vi cũ (tự suy ra).
# KHÔNG đụng tới nhánh 'external' (external_db) — vẫn như cũ, chưa hiện thực thay đổi gì.
db_host: >-
  {{ (external_db.host if icinga_database_type == 'external'
      else (managed_db.host if (managed_db.host | trim | length > 0)
            else (hostvars[groups['galera'][0]].ansible_host | default('127.0.0.1')))) | trim }}
db_port: "{{ external_db.port if icinga_database_type == 'external' else managed_db.port }}"

# db_client_skip_ssl (2026-07-23): mặc định false — client mariadb GIỮ hành vi mặc định của nó (tự
# thương lượng TLS nếu server hỗ trợ). Chỉ bật true khi server KHÔNG hỗ trợ TLS mà client vẫn đòi
# hỏi — gặp thật với MariaDB tự cài tay (apt) không bật TLS, trong khi client bản mới trong
# images.mariadb mặc định YÊU CẦU TLS khi nối qua -h (TCP), gây lỗi "SSL is required, but the server
# does not support it". Không tự động bật — người dùng phải chủ động khai true trong globals.yml,
# tránh âm thầm tắt bảo mật TLS cho DB thật sự có hỗ trợ.
db_client_skip_ssl: false
# Chuỗi cờ thật sự chèn vào lệnh mariadb — rỗng nếu tắt, "--skip-ssl" nếu bật. Dùng biến trung gian
# này ở mọi nơi gọi "mariadb -h {{ db_host }}" thay vì lặp lại điều kiện.
_mariadb_ssl_flag: "{{ '--skip-ssl' if db_client_skip_ssl | default(false) | bool else '' }}"

# Action nội bộ hiện tại (CLI set qua -e icinga_action=...). Không dùng tên
# reserved `action` của Ansible vì nó tạo warning và có thể bị shadow.
icinga_action: "deploy"
