---
# Role prechecks: fail sớm nếu cấu hình/topology sai. Chạy một lần trên master[0].

- name: Số master phải >= 1
  ansible.builtin.assert:
    that:
      - (groups['master'] | default([]) | length) >= 1
      - (groups['master'] | default([]) | length) <= 2
    fail_msg: >-
      Nhóm [master] chỉ hỗ trợ 1 hoặc 2 host (đang:
      {{ groups['master'] | default([]) | length }}). Icinga 2 cảnh báo zone có hơn 2 endpoint vì
      có thể tạo message-routing loop; topology lớn hơn chưa được project này hỗ trợ.

- name: Tên Icinga master zone phải hợp lệ
  ansible.builtin.assert:
    that:
      - icinga_master_zone_name | default('') | length > 0
      - icinga_master_zone_name is regex('^[A-Za-z0-9_.-]+$')
      - icinga_master_zone_name not in ['global-templates', 'director-global']
      - icinga_master_zone_name not in (groups['client'] | default([]))
    fail_msg: >-
      icinga_master_zone_name phải dùng A-Z/a-z/0-9/_.-, không được trùng global zone
      hoặc zone client. Giá trị hiện tại: {{ icinga_master_zone_name | default('<rỗng>') }}.

- name: Mỗi satellite zone chỉ hỗ trợ tối đa hai endpoint HA
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.name is regex('^[A-Za-z0-9_.-]+$')
      - item.name not in [icinga_master_zone_name, 'global-templates', 'director-global']
      - item.members | default([]) | length >= 1
      - item.members | default([]) | length <= 2
      - item.members | difference(groups['satellite'] | default([])) | length == 0
      - item.parent | default(icinga_master_zone_name) == icinga_master_zone_name
    fail_msg: >-
      satellite_zones entry '{{ item.name | default('<không tên>') }}' phải có 1-2 members và mọi
      member phải thuộc [satellite]. Tên zone chỉ dùng A-Z/a-z/0-9/_.-, không được trùng
      master zone/global-templates/director-global; parent phải là {{ icinga_master_zone_name }}. Đang có:
      {{ item.members | default([]) }}.
  loop: "{{ satellite_zones | default([]) }}"
  loop_control:
    label: "{{ item.name | default('<không tên>') }}"

- name: Gom tên zone và thành viên satellite để kiểm tra toàn cục
  ansible.builtin.set_fact:
    _precheck_satellite_zone_names: "{{ satellite_zones | default([]) | map(attribute='name') | list }}"
    _precheck_satellite_zone_members: "{{ satellite_zones | default([]) | map(attribute='members') | flatten }}"

- name: Mỗi satellite phải thuộc đúng một zone và tên zone không được trùng
  ansible.builtin.assert:
    that:
      - _precheck_satellite_zone_names | unique | length == _precheck_satellite_zone_names | length
      - _precheck_satellite_zone_members | unique | length == _precheck_satellite_zone_members | length
      - (groups['satellite'] | default([])) | difference(_precheck_satellite_zone_members) | length == 0
      - _precheck_satellite_zone_names | intersect(groups['client'] | default([])) | length == 0
    fail_msg: >-
      satellite_zones không hợp lệ: tên zone phải duy nhất và mỗi host [satellite] phải xuất hiện
      đúng một lần. Zone={{ _precheck_satellite_zone_names }}, members={{ _precheck_satellite_zone_members }},
      inventory={{ groups['satellite'] | default([]) }}.

- name: Tên endpoint phải an toàn và các role Icinga endpoint không được chồng nhau
  ansible.builtin.assert:
    that:
      - item is regex('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      Inventory hostname '{{ item }}' được render thành tên object Icinga; chỉ hỗ trợ
      A-Z/a-z/0-9/_.- để tránh cấu hình DSL không hợp lệ.
  loop: >-
    {{ ((groups['master'] | default([])) + (groups['satellite'] | default([]))
        + (groups['client'] | default([]))) | unique | list }}

- name: Chặn một endpoint cùng lúc thuộc master, satellite hoặc client
  ansible.builtin.assert:
    that:
      - (groups['master'] | default([])) | intersect(groups['satellite'] | default([])) | length == 0
      - (groups['master'] | default([])) | intersect(groups['client'] | default([])) | length == 0
      - (groups['satellite'] | default([])) | intersect(groups['client'] | default([])) | length == 0
    fail_msg: >-
      Các nhóm [master], [satellite], [client] phải rời nhau vì một Icinga endpoint chỉ có một zone.

- name: Tên tài khoản quản trị Icinga Web phải an toàn khi ghi vào SQL
  ansible.builtin.assert:
    that:
      - icingaweb2_admin_user | length > 0
      - icingaweb2_admin_user is regex('^[A-Za-z0-9_.@-]+$')
    fail_msg: >-
      icingaweb2_admin_user chỉ hỗ trợ A-Z/a-z/0-9/_.@-; giá trị hiện tại không an toàn để dùng
      trong câu SQL khởi tạo tài khoản.

- name: Mọi host có vai trò triển khai phải thuộc all_hosts
  ansible.builtin.assert:
    that:
      - >-
        ((groups['master'] | default([])) + (groups['satellite'] | default([]))
         + (groups['client'] | default([])) + (groups['galera'] | default([])))
        | unique | difference(groups['all_hosts'] | default([])) | length == 0
    fail_msg: >-
      Có host mang role nhưng không nằm trong [all_hosts]. Các play bootstrap/pull/upgrade image chạy
      theo all_hosts, nên inventory như vậy có thể bỏ sót node.

- name: Chặn các option đang được expose nhưng listener/DB lifecycle chưa hỗ trợ đổi giá trị
  ansible.builtin.assert:
    that:
      - icinga2_api_port | int == 5665
      - icingaweb2_http_port | int == 8080
      - icingadb_db_name == 'icingadb'
    fail_msg: >-
      Phiên bản hiện tại chỉ hỗ trợ icinga2_api_port=5665, icingaweb2_http_port=8080 và
      icingadb_db_name=icingadb. Đổi các giá trị này trước đây chỉ đổi client URL nhưng không đổi
      listener/toàn bộ SQL, nên bị chặn để tránh deploy nửa vời.

- name: Kiểm tra cấu hình HTTPS Icinga Web 2
  ansible.builtin.assert:
    that:
      - icingaweb2_https_port | int >= 1
      - icingaweb2_https_port | int <= 65535
      - (icingaweb2_https_port | int) not in [(icingaweb2_http_port | int), (icinga2_api_port | int), (icingadb_redis_port | int)]
      - icingaweb2_https_server_name is match('^[A-Za-z0-9.-]+$')
      - icingaweb2_https_server_name | length <= 253
      - not icingaweb2_https_server_name.startswith('.')
      - not icingaweb2_https_server_name.endswith('.')
      - "'..' not in icingaweb2_https_server_name"
      - icingaweb2_https_certificate_file is match('^[A-Za-z0-9_.-]+$')
      - icingaweb2_https_private_key_file is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      HTTPS cần port không xung đột, server_name hợp lệ và tên file certificate/key chỉ là basename an toàn.
  when: icingaweb2_https_enabled | bool

- name: Kiểm tra certificate và private key nguồn trên deployment node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ icingaweb2_https_certificate_source }}"
    - "{{ icingaweb2_https_private_key_source }}"
  register: _icingaweb2_tls_sources
  delegate_to: localhost
  become: false
  when: icingaweb2_https_enabled | bool

- name: Xác nhận certificate/key HTTPS tồn tại
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.size | int > 0
    fail_msg: >-
      File HTTPS {{ item.item }} phải tồn tại trên deployment node và là regular file không rỗng.
  loop: "{{ _icingaweb2_tls_sources.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: icingaweb2_https_enabled | bool

- name: Private key nguồn không được cấp quyền cho other
  ansible.builtin.assert:
    that:
      - not (_icingaweb2_tls_sources.results[1].stat.mode is match('^...[1-7]$'))
    fail_msg: >-
      Private key {{ icingaweb2_https_private_key_source }} đang có quyền cho other; hãy chạy chmod 0640 hoặc 0600.
  when: icingaweb2_https_enabled | bool

- name: Xác nhận PEM hợp lệ, key không mã hoá, chưa hết hạn và khớp certificate
  ansible.builtin.shell: |
    set -euo pipefail
    cert={{ icingaweb2_https_certificate_source | quote }}
    key={{ icingaweb2_https_private_key_source | quote }}
    openssl x509 -in "$cert" -noout -checkend 86400
    name={{ icingaweb2_https_server_name | quote }}
    if [[ "$name" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
      openssl x509 -in "$cert" -noout -checkip "$name"
    else
      openssl x509 -in "$cert" -noout -checkhost "$name"
    fi
    timeout 5 openssl pkey -in "$key" -passin pass: -noout >/dev/null
    cert_pub=$(openssl x509 -in "$cert" -pubkey -noout |
      openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')
    key_pub=$(openssl pkey -in "$key" -passin pass: -pubout -outform DER 2>/dev/null |
      sha256sum | awk '{print $1}')
    test -n "$cert_pub"
    test "$cert_pub" = "$key_pub"
  args:
    executable: /bin/bash
  changed_when: false
  delegate_to: localhost
  become: false
  when: icingaweb2_https_enabled | bool

- name: Loại database phải hợp lệ
  ansible.builtin.assert:
    that: icinga_database_type in ['managed_db', 'external']
    fail_msg: >-
      icinga_database_type phải là 'managed_db' hoặc 'external' (đang là
      '{{ icinga_database_type | default('<undefined>') }}').

- name: Managed DB phải là standalone 1 node hoặc Galera số lẻ >= 3
  ansible.builtin.assert:
    that:
      - (galera_count | int) == 1 or ((galera_count | int) >= 3 and (galera_count | int) % 2 == 1)
    fail_msg: >-
      icinga_database_type=managed_db yêu cầu [galera] có đúng 1 node (standalone) hoặc số lẻ >= 3
      (Galera có quorum); hiện có {{ galera_count }} node.
  when: icinga_database_type == 'managed_db'

- name: icinga_image_versions phải khai đủ 5 thành phần, không rỗng
  ansible.builtin.assert:
    that:
      - icinga_image_versions is defined
      - icinga_image_versions[item] is defined
      - (icinga_image_versions[item] | string | trim) | length > 0
    fail_msg: >-
      Thiếu/rỗng icinga_image_versions.{{ item }} trong globals.yml. Phải khai tag tường minh cho cả
      5: icinga2, icingadb, icingadb_redis, icingaweb2, mariadb (không còn 'bộ phiên bản' — xem
      design.md mục 6).
  loop: [icinga2, icingadb, icingadb_redis, icingaweb2, mariadb]

- name: Tag Icinga 2 và Icinga DB phải là phiên bản số đầy đủ
  ansible.builtin.assert:
    that:
      - icinga_image_versions.icinga2 is regex('^[0-9]+\.[0-9]+\.[0-9]+$')
      - icinga_image_versions.icingadb is regex('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: >-
      icinga_image_versions.icinga2 và .icingadb phải là phiên bản x.y.z tường minh để kiểm tra
      tương thích trước khi deploy/upgrade; hiện tại là icinga2={{ icinga_image_versions.icinga2 }},
      icingadb={{ icinga_image_versions.icingadb }}. Image tự build vẫn khai tag thật trong
      custom_image_overrides.

- name: Icinga 2 và Icinga DB phải cùng thế hệ Redis schema
  # Icinga DB <=1.3.x chờ Redis schema 5 do Icinga 2 <=2.14.x ghi. Từ Icinga DB 1.4.0 và
  # Icinga 2 2.15.0, cả hai dùng schema 6. Trộn hai phía của ranh giới này làm icingadb
  # crash-loop với "unexpected Redis schema version"; đã tái hiện thật trên cluster OpenStack.
  ansible.builtin.assert:
    that:
      - >-
        ((icinga_image_versions.icinga2 is version('2.15.0', '>=')) and
         (icinga_image_versions.icingadb is version('1.4.0', '>='))) or
        ((icinga_image_versions.icinga2 is version('2.15.0', '<')) and
         (icinga_image_versions.icingadb is version('1.4.0', '<')))
    fail_msg: >-
      Cặp phiên bản không tương thích Redis schema: Icinga 2 {{ icinga_image_versions.icinga2 }} / Icinga DB
      {{ icinga_image_versions.icingadb }}. Dùng Icinga 2 >=2.15.0 cùng Icinga DB >=1.4.0, hoặc cả hai
      thấp hơn các mốc đó. Icinga DB 1.4.0 chính thức yêu cầu Icinga 2 2.15.0 trở lên.

- name: "custom_image_overrides không rỗng thì custom_image_registry phải khai (không hardcode registry nào)"
  ansible.builtin.assert:
    that: (custom_image_registry | default('')) | length > 0
    fail_msg: >-
      custom_image_overrides có khai ít nhất 1 image nhưng custom_image_registry đang trống trong
      globals.yml — cần khai registry riêng (host:port + namespace, vd "10.10.10.151:8081/icinga")
      nơi bạn đã tự build+push image custom lên (xem design.md mục 9.6).
  when: (custom_image_overrides | default({})) | length > 0

- name: "custom_image_overrides chỉ được khai đúng tên image có thật (khớp images_upstream)"
  ansible.builtin.assert:
    that: custom_image_overrides.keys() | difference(images_upstream.keys()) | length == 0
    fail_msg: >-
      custom_image_overrides có khoá không hợp lệ: {{ custom_image_overrides.keys() | difference(images_upstream.keys()) | join(', ') }}.
      Chỉ được dùng đúng tên trong images_upstream: {{ images_upstream.keys() | join(', ') }}.
  when: (custom_image_overrides | default({})) | length > 0

- name: Chặn biến proxy cũ để tránh cấu hình bị bỏ qua âm thầm
  ansible.builtin.assert:
    that:
      - proxy_http is not defined
      - proxy_https is not defined
      - proxy_no_proxy is not defined
      - proxy_group_overrides is not defined
    fail_msg: >-
      Proxy đã đổi sang thiết kế Kolla-Ansible. Hãy đổi proxy_http/proxy_https/proxy_no_proxy
      thành docker_http_proxy/docker_https_proxy/docker_no_proxy và xoá proxy_group_overrides.
      Ba biến mới chỉ cấu hình Docker Engine pull image.

- name: Kiểm tra Docker Engine proxy
  ansible.builtin.assert:
    that:
      - docker_http_proxy is string
      - docker_https_proxy is string
      - docker_no_proxy is string
      - >-
        (docker_http_proxy | length == 0) or
        (docker_http_proxy is match('^https?://[^\\s]+$'))
      - >-
        (docker_https_proxy | length == 0) or
        (docker_https_proxy is match('^https?://[^\\s]+$'))
      - "'\\n' not in docker_no_proxy"
      - "'\\r' not in docker_no_proxy"
    fail_msg: >-
      docker_http_proxy/docker_https_proxy phải rỗng hoặc là URL http(s) không chứa khoảng trắng;
      docker_no_proxy phải là chuỗi phân cách bằng dấu phẩy.

- name: Chặn IDO/PDO — không cho bật ido-mysql / ido-pgsql
  ansible.builtin.assert:
    that:
      - "'ido-mysql' not in (enable_icinga2_features | default([]))"
      - "'ido-pgsql' not in (enable_icinga2_features | default([]))"
    fail_msg: "Stack này CHỈ dùng Icinga DB. Bỏ ido-mysql/ido-pgsql khỏi enable_icinga2_features."

- name: Feature icingadb bắt buộc bật
  ansible.builtin.assert:
    that: "'icingadb' in (enable_icinga2_features | default([]))"
    fail_msg: "Thiếu feature 'icingadb' trong enable_icinga2_features (bắt buộc)."

- name: Module Icinga DB Web bắt buộc
  ansible.builtin.assert:
    that: "'icingadb' in (enable_icingaweb2_modules | default([]))"
    fail_msg: "Thiếu module 'icingadb' trong enable_icingaweb2_modules (thay module monitoring/IDO cũ)."

- name: Chỉ cho phép các module web mà role thực sự cấu hình
  ansible.builtin.assert:
    that: >-
      (enable_icingaweb2_modules | default([]))
      | difference(['icingadb', 'director', 'fileshipper']) | length == 0
    fail_msg: >-
      enable_icingaweb2_modules chỉ hỗ trợ 'icingadb', 'director' và 'fileshipper'; module không hỗ trợ:
      {{ (enable_icingaweb2_modules | default([]))
         | difference(['icingadb', 'director', 'fileshipper']) | join(', ') }}.

- name: FileShipper chỉ được bật cùng Director
  ansible.builtin.assert:
    that: "'director' in (enable_icingaweb2_modules | default([]))"
    fail_msg: "Module 'fileshipper' cần module 'director'; hãy bật cả hai trong enable_icingaweb2_modules."
  when: "'fileshipper' in (enable_icingaweb2_modules | default([]))"

- name: Kiểm tra pin và danh sách directory của FileShipper
  ansible.builtin.assert:
    that:
      - fileshipper_revision is match('^[0-9a-f]{40}$')
      - fileshipper_archive_checksum is match('^sha256:[0-9a-f]{64}$')
      - icinga_image_versions.icingaweb2 is version('2.12.5', '>=')
      - fileshipper_directories is sequence
      - fileshipper_directories is not string
      - fileshipper_directories | length > 0
    fail_msg: >-
      FileShipper cần exact Git commit, SHA256 archive và ít nhất một directory mapping hợp lệ.
  when: "'fileshipper' in (enable_icingaweb2_modules | default([]))"

- name: Kiểm tra base directory import của FileShipper
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9_. -]+$')
      - item.basedir is match('^/data/etc/icingaweb2/fileshipper(/|$)')
      - "'..' not in item.basedir"
    fail_msg: "Import directory FileShipper không hợp lệ: {{ item | to_json }}"
  loop: "{{ fileshipper_import_directories | default([]) }}"
  loop_control:
    label: "{{ item.name | default('missing-name') }}"
  when: "'fileshipper' in (enable_icingaweb2_modules | default([]))"

- name: Kiểm tra từng directory mapping của FileShipper
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9_.-]+$')
      - item.source is match('^/data/etc/icingaweb2/fileshipper(/|$)')
      - item.target is match('^zones\\.d/[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+$')
      - "'..' not in item.source"
      - "'..' not in item.target"
      - (item.extensions | default('.conf')) is match('^\\.[A-Za-z0-9]+( \\.[A-Za-z0-9]+)*$')
    fail_msg: "Directory mapping FileShipper không hợp lệ: {{ item | to_json }}"
  loop: "{{ fileshipper_directories | default([]) }}"
  loop_control:
    label: "{{ item.name | default('missing-name') }}"
  when: "'fileshipper' in (enable_icingaweb2_modules | default([]))"

- name: External DB phải khai host
  ansible.builtin.assert:
    that: external_db.host | length > 0
    fail_msg: "icinga_database_type=external nhưng external_db.host trống."
  when: icinga_database_type == 'external'

# ---------- external: xác nhận DBA đã tạo sẵn database/user/grant (KHÔNG dùng root DB ngoài) ----------
# Quyết định 2026-07-23 (theo yêu cầu người dùng, xem TODO.md): nhánh external KHÔNG BAO GIỜ đụng
# root của DB ngoài — khác managed_db (tool tự dựng + tự cấp quyền cho ĐÚNG DB do chính nó quản lý).
# Với external, DBA (người quản lý DB đó, không phải icinga-ansible) phải tự CREATE DATABASE/USER/
# GRANT trước khi deploy, dùng đúng tên/mật khẩu đã khai trong globals.yml/passwords.yml. Prechecks
# tự thử kết nối bằng ĐÚNG user mỗi service sẽ dùng (không phải root) để phát hiện sớm nếu DBA chưa
# chuẩn bị xong, thay vì để lỗi rơi giữa chừng lúc roles/icingadb hay roles/icingaweb2 đang import
# schema (khó debug hơn nhiều, message tối nghĩa hơn nhiều).
- name: "(external) Thử kết nối bằng user icingadb/icingaweb2/director — kiểm tra DBA đã tạo sẵn"
  # _mariadb_ssl_flag: tuỳ chọn qua db_client_skip_ssl (mặc định false — xem group_vars/all.yml +
  # giải thích BUG THẬT ở roles/icingaweb2/tasks/main.yml, client mariadb bản mới mặc định yêu cầu
  # TLS, MariaDB tự cài tay thường không bật TLS).
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'run', '--rm', '--network', 'host', '-e', 'MYSQL_PWD', images.mariadb,
          'mariadb']
         + ([_mariadb_ssl_flag] if _mariadb_ssl_flag | length > 0 else [])
         + ['-h', db_host, '-P', db_port | string, '-u' ~ item.user, item.db,
            '-N', '-e',
            'SELECT DEFAULT_CHARACTER_SET_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME=DATABASE();'] }}
  environment:
    MYSQL_PWD: "{{ item.password }}"
  loop:
    - { user: icingadb,   password: "{{ icingadb_db_password }}",   db: "{{ icingadb_db_name }}", charsets: [utf8mb4] }
    - { user: icingaweb2, password: "{{ icingaweb2_db_password }}", db: icingaweb2, charsets: [utf8mb4] }
    - { user: director,   password: "{{ director_db_password }}",   db: director, charsets: [utf8, utf8mb3] }
  loop_control: { label: "{{ item.user }}" }
  register: _ext_db_check
  no_log: true
  changed_when: false
  failed_when: false
  when:
    - icinga_database_type == 'external'
    - item.user != 'director' or 'director' in (enable_icingaweb2_modules | default([]))

- name: "(external) Xác định service DBA CHƯA chuẩn bị xong (nếu có)"
  ansible.builtin.set_fact:
    _ext_db_missing: >-
      {{ (_ext_db_check.results | default([]))
         | selectattr('skipped', 'undefined')
         | selectattr('rc', '!=', 0)
         | map(attribute='item.user') | list }}
  when: icinga_database_type == 'external'

- name: "(external) Xác định database sai charset"
  ansible.builtin.set_fact:
    _ext_db_wrong_charset: >-
      {%- set ns = namespace(users=[]) -%}
      {%- for result in (_ext_db_check.results | default([])) -%}
        {%- if not (result.skipped | default(false)) and result.rc == 0 and
              (result.stdout | trim) not in result.item.charsets -%}
          {%- set ns.users = ns.users + [result.item.user] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.users }}
  when: icinga_database_type == 'external'

- name: "(external) Dựng SQL hướng dẫn DBA (icingadb + icingaweb2 luôn, director nếu bật module)"
  ansible.builtin.set_fact:
    _ext_db_sql: >-
      {{ (
        ["CREATE DATABASE IF NOT EXISTS " ~ icingadb_db_name ~ " CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;",
         "ALTER DATABASE " ~ icingadb_db_name ~ " CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;",
         "CREATE USER IF NOT EXISTS 'icingadb'@'%' IDENTIFIED BY '<xem icingadb_db_password trong passwords.yml>';",
         "GRANT ALL ON " ~ icingadb_db_name ~ ".* TO 'icingadb'@'%';",
         "CREATE DATABASE IF NOT EXISTS icingaweb2 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;",
         "ALTER DATABASE icingaweb2 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;",
         "CREATE USER IF NOT EXISTS 'icingaweb2'@'%' IDENTIFIED BY '<xem icingaweb2_db_password trong passwords.yml>';",
         "GRANT ALL ON icingaweb2.* TO 'icingaweb2'@'%';"]
        + (["CREATE DATABASE IF NOT EXISTS director CHARACTER SET utf8 COLLATE utf8_general_ci;",
            "ALTER DATABASE director CHARACTER SET utf8 COLLATE utf8_general_ci;",
            "CREATE USER IF NOT EXISTS 'director'@'%' IDENTIFIED BY '<xem director_db_password trong passwords.yml>';",
            "GRANT ALL ON director.* TO 'director'@'%';"]
           if 'director' in (enable_icingaweb2_modules | default([])) else [])
        + ["FLUSH PRIVILEGES;"]
      ) | join('\n') }}
  when:
    - icinga_database_type == 'external'
    - >-
      (_ext_db_missing | default([]) | length > 0) or
      (_ext_db_wrong_charset | default([]) | length > 0)

- name: "(external) Hướng dẫn tạo schema DB ngoài — gửi cho DBA (chỉ hiện khi kiểm tra thất bại)"
  ansible.builtin.fail:
    msg: >-
      DBA chưa tạo sẵn/sai mật khẩu cho user: {{ _ext_db_missing | join(', ') }};
      database sai charset: {{ _ext_db_wrong_charset | default([]) | join(', ') }}.
      icinga_database_type=external -> icinga-ansible KHÔNG BAO GIỜ dùng root của DB ngoài. DBA phải
      tự chạy SQL sau (điền đúng mật khẩu thật từ /etc/icinga-ansible/passwords.yml) TRƯỚC khi deploy:
      ---
      {{ _ext_db_sql }}
      ---
  when:
    - icinga_database_type == 'external'
    - >-
      (_ext_db_missing | default([]) | length > 0) or
      (_ext_db_wrong_charset | default([]) | length > 0)

- name: "(external) Xác nhận đã kết nối OK bằng user riêng từng service (không dùng root)"
  ansible.builtin.debug:
    msg: "OK — DB ngoài đã sẵn sàng, kết nối được bằng user icingadb/icingaweb2{{ '/director' if 'director' in (enable_icingaweb2_modules | default([])) else '' }} (không cần root)."
  when:
    - icinga_database_type == 'external'
    - _ext_db_missing | default([]) | length == 0
    - _ext_db_wrong_charset | default([]) | length == 0

- name: Tóm tắt topology sẽ triển khai
  ansible.builtin.debug:
    msg:
      - "Version image: icinga2 {{ icinga_image_versions.icinga2 }}, icingadb {{ icinga_image_versions.icingadb }}, web {{ icinga_image_versions.icingaweb2 }}, redis {{ icinga_image_versions.icingadb_redis }}, mariadb {{ icinga_image_versions.mariadb }}"
      - "Master       : {{ master_count }} ({{ 'HA' if is_ha_master else 'single' }})  CA={{ ca_host }}"
      - "Master zone  : {{ icinga_master_zone_name }}"
      - "Satellite    : {{ satellite_count }}"
      - "Database      : {{ icinga_database_type }}  (galera nodes: {{ galera_count }})  endpoint: {{ db_host }}:{{ db_port }}"
