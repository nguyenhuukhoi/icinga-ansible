---
# sync_zone_extra_conf.yml — đồng bộ các file .conf TUỲ Ý mà operator tự đặt vào
# deploy_config_dir/icinga2/zones.d/<zone>/ (ngoài các file role tự sinh).
#
# VÌ SAO CẦN (yêu cầu người dùng 2026-10-19, đã tái hiện thật): trước đây pipeline chỉ copy đúng một
# DANH SÁCH CỨNG 6 tên file (hosts.conf, clients.conf, openstack-checks.conf, openstack-services.conf,
# telegram-notifications.conf, và hosts.conf của satellite zone). Operator tạo thêm vd "myhosts.conf"
# thì KHÔNG task nào đọc tới -> không copy xuống node, không mount vào container, và `reconfigure`
# vẫn trả EXIT=0 không một dòng cảnh báo. Tức tool báo thành công trong khi việc được yêu cầu không
# hề xảy ra. Giờ quét thư mục thật: mọi *.conf đều được đẩy xuống và mount.
#
# Tham số:
#   zx_zone     tên Icinga Zone (= tên thư mục con dưới zones.d/)
#
# Chỉ gọi trên ca_host: Ansible chỉ render zones.d ở đó, các node cùng zone nhận nội dung qua chính
# cluster config-sync của Icinga 2 (mount một source không tồn tại sẽ làm docker_container lỗi).
#
# Container tự recreate khi tập mount đổi nhờ "comparisons: volumes: strict" ở task khởi động
# container — thêm/bớt file ở đây tự khiến bind mount được áp lại, không cần xử lý thêm.

- name: "Dò file .conf operator tự thêm trong zones.d/{{ zx_zone }} (deployment node)"
  ansible.builtin.find:
    paths: "{{ deploy_config_dir }}/icinga2/zones.d/{{ zx_zone }}"
    patterns: ["*.conf"]
    file_type: file
  delegate_to: localhost
  become: false
  register: _zx_src

- name: "Chốt danh sách .conf của operator trong zones.d/{{ zx_zone }}"
  ansible.builtin.set_fact:
    _zx_extra: >-
      {{ (_zx_src.files | default([])) | map(attribute='path') | map('basename')
          | sort | list }}

- name: "Báo các file .conf của operator sẽ được đẩy xuống zones.d/{{ zx_zone }}"
  ansible.builtin.debug:
    msg: >-
      zones.d/{{ zx_zone }}: {{ _zx_extra | length }} file do bạn tự
      thêm sẽ được đẩy xuống và mount: {{ _zx_extra | join(', ') }}
  when: _zx_extra | length > 0

- name: "Đẩy file .conf của operator xuống zones.d/{{ zx_zone }}"
  ansible.builtin.copy:
    src: "{{ deploy_config_dir }}/icinga2/zones.d/{{ zx_zone }}/{{ item }}"
    dest: "{{ icinga_etc_dir }}/icinga2/zones.d/{{ zx_zone }}/{{ item }}"
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0640"
  loop: "{{ _zx_extra }}"
  loop_control: { label: "{{ zx_zone }}/{{ item }}" }
  notify: Reload icinga2

- name: "Gom mount per-file cho .conf của operator trong zones.d/{{ zx_zone }}"
  ansible.builtin.set_fact:
    _ic_zone_extra_mounts: >-
      {{ (_ic_zone_extra_mounts | default([]))
         + [icinga_etc_dir ~ '/icinga2/zones.d/' ~ zx_zone ~ '/' ~ item
            ~ ':/data/etc/icinga2/zones.d/' ~ zx_zone ~ '/' ~ item ~ ':ro'] }}
  loop: "{{ _zx_extra }}"
  loop_control: { label: "{{ zx_zone }}/{{ item }}" }

# Xoá file mồ côi: operator bỏ file khỏi nguồn thì phải mất luôn trên node, nếu không Icinga vẫn nạp
# object cũ mãi (file nằm trong zones.d nên được tự quét, không cần include).
- name: "Dò file .conf hiện có trên node trong zones.d/{{ zx_zone }}"
  ansible.builtin.find:
    paths: "{{ icinga_etc_dir }}/icinga2/zones.d/{{ zx_zone }}"
    patterns: ["*.conf"]
    file_type: file
  register: _zx_node

- name: "Xoá file .conf mồ côi trong zones.d/{{ zx_zone }} (nguồn đã bị xoá)"
  ansible.builtin.file:
    path: "{{ icinga_etc_dir }}/icinga2/zones.d/{{ zx_zone }}/{{ item }}"
    state: absent
  loop: >-
    {{ (_zx_node.files | default([])) | map(attribute='path') | map('basename')
       | reject('in', _zx_extra) | sort | list }}
  loop_control: { label: "{{ zx_zone }}/{{ item }}" }
  notify: Reload icinga2
