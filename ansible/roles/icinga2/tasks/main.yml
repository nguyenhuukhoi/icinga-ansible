---
# Role icinga2: CA/PKI + zones.conf + features (icingadb, api...) + API users.
# P1 (single master), P2 (HA N-master), P3 (satellite + add/remove): đã verify chạy thật.
# Client (command endpoint, block "(client)" bên dưới): đã code — xem TODO.md cho trạng thái verify.
#
# MÔ HÌNH IMAGE (icinga/icinga2): toàn bộ state dưới /data (volume),
#   /etc/icinga2 -> /data/etc/icinga2 ; /var/lib/icinga2 -> /data/var/lib/icinga2
#   container chạy uid 5665 (icinga) => host dir /data phải thuộc 5665, config phải 5665 đọc được.

- name: Hằng số đường dẫn + uid container
  ansible.builtin.set_fact:
    ic_data: "{{ icinga_base_dir }}/icinga2/data"
    ic_uid: "5665"          # uid/gid 'icinga' trong image
    # Cây cũ nằm bên trong /data chỉ còn dùng làm nguồn skeleton/migration.
    ic_etc: "{{ icinga_base_dir }}/icinga2/data/etc/icinga2"
    # Đây là cây config chính thức trên host; container mount nguyên thư mục RW.
    ic_config_dir: "{{ icinga_etc_dir }}/icinga2"
    # Credential local nằm ngay trong cây config chính thức đã được mount nguyên thư mục.
    ic_master_secrets_dir: "{{ icinga_etc_dir }}/icinga2/secrets"

# Mọi lệnh bootstrap/verify bên dưới đều chạy bằng image đích. Nếu image chưa có
# và registry tạm lỗi, `docker run` trả rc=125; tuyệt đối không được hiểu đó là
# certificate hỏng rồi xóa PKI đang hoạt động.
- name: Đảm bảo image Icinga 2 đích có sẵn trước khi đụng tới PKI
  community.docker.docker_image:
    name: "{{ images.icinga2 }}"
    source: pull
    force_source: false

- name: Tạo thư mục /data trên host
  ansible.builtin.file:
    path: "{{ ic_data }}"
    state: directory
    mode: "0750"

# Mount host dir rỗng lên /data sẽ CHE skeleton baked trong image
# (mất var/log/icinga2, config nền...). => copy skeleton ra host trước.
- name: Kiểm tra /data đã khởi tạo skeleton chưa
  ansible.builtin.stat:
    path: "{{ ic_data }}/etc/icinga2/icinga2.conf"
  register: data_init

# BUG đã gặp thật (2026-07-22, lần đầu deploy icinga-2025.2 — icinga2 2.14.10, khác hẳn 2.16.4 đã
# quen dùng cả session): image 2.14.10 KHÔNG bake skeleton tĩnh ở /data — "docker create"+"docker cp"
# copy được đúng 0 byte (thư mục /data rỗng thật trong image, chỉ entrypoint mới copy lúc container
# THỰC SỰ chạy, từ /data-init sang /data). Bản 2.16.4 thì /data đã có sẵn tĩnh, không có /data-init.
# 2 bản đóng gói KHÁC NHAU thật — không suy đoán, đã xác nhận bằng "docker run --entrypoint find".
# Fix: thử /data trước (đúng cho 2.16.4+), nếu rỗng thì fallback /data-init (đúng cho 2.14.10).
#
# BUG THẬT ĐÃ GẶP (2026-07-22, phát hiện khi rà lại lý do "docker volume ls" có nhiều volume mồ côi
# dạng ID sau nhiều lần deploy/rebuild trong session): "docker create {{ images.icinga2 }}" ở đây
# KHÔNG mount /data tường minh — image khai `VOLUME /data` trong Dockerfile nên Docker tự tạo 1
# ANONYMOUS VOLUME để thoả điều kiện đó. "docker rm" (thiếu cờ -v) xoá container nhưng ĐỂ LẠI volume
# vừa tạo — rò rỉ 1 volume mồ côi (~268K) MỖI LẦN /data cần khởi tạo lại (không liên quan `destroy`,
# xảy ra ngay trong DEPLOY bình thường). Dự án này không dùng Docker named volume nào cả (kiến trúc
# bind-mount ra thư mục host — xem design.md mục 4.1), nên đặt tên cho volume KHÔNG giải quyết gì —
# fix đúng là dọn sạch tài nguyên container tạm tự tạo ra: thêm cờ "-v" vào "docker rm".
- name: Khởi tạo /data từ skeleton của image (docker cp /data, fallback /data-init nếu rỗng)
  ansible.builtin.shell: |
    set -e
    cid=$(docker create {{ images.icinga2 }})
    docker cp "$cid:/data/." {{ ic_data }}/ 2>/dev/null || true
    if [ -z "$(ls -A {{ ic_data }}/ 2>/dev/null)" ]; then
      docker cp "$cid:/data-init/." {{ ic_data }}/
    fi
    docker rm -v "$cid" >/dev/null
  when: not data_init.stat.exists

- name: Cấp quyền toàn bộ /data cho uid icinga (5665)
  ansible.builtin.file:
    path: "{{ ic_data }}"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    recurse: true
  when: not data_init.stat.exists

# BUG THẬT ĐÃ GẶP (2026-08-02, phát hiện lúc test restore-pki với hạ tầng IP khác — design.md mục
# 10.6): skeleton mặc định của image có "const TicketSalt = \"\"" (RỖNG). Trong deploy THƯỜNG (CA mới
# hoàn toàn), "icinga2 node setup --master" tự sinh salt thật khi tạo CA mới, ghi thẳng vào file này
# trong ic_data — nên vô tình "vá" luôn giá trị rỗng. Nhưng khi RESTORE PKI (dùng lại CA cũ qua
# restore-pki.yml), "node setup --master" phát hiện CA đã có sẵn ("Found CA, skipping and using the
# existing one") và KHÔNG sinh lại salt — để nguyên chuỗi rỗng từ skeleton mặc định. Hậu quả: mọi lệnh
# "icinga2 pki ticket --cn <node>" sau đó (dùng để cấp cert cho master2/satellite mới) fail thẳng
# "critical/cli: Ticket salt (--salt) must be specified" — dù CA/cert của ca_host vẫn hoàn toàn hợp lệ.
# Fix: LUÔN ghi đúng "icinga2_ticket_salt" (passwords.yml — cùng giá trị Ansible render vào
# constants.conf thật cho container chạy dài hạn, xem constants.conf.j2) thẳng vào bản skeleton trong
# ic_data ngay sau khi copy — áp dụng chung cho MỌI lần khởi tạo /data (CA mới lẫn CA restore), không
# chỉ để dựa vào "node setup" tự vá cho trường hợp CA mới.
- name: "Vá TicketSalt trong skeleton /data (tránh rỗng khi restore-pki dùng lại CA cũ — xem giải thích trên)"
  ansible.builtin.lineinfile:
    path: "{{ ic_data }}/etc/icinga2/constants.conf"
    regexp: '^const TicketSalt = ".*"$'
    line: 'const TicketSalt = {{ (icinga2_ticket_salt if inventory_hostname in groups["master"] else "") | to_json }}'
  when: not data_init.stat.exists

- name: Tạo cây config Icinga 2 chính thức trên host
  ansible.builtin.file:
    path: "{{ ic_config_dir }}"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"

- name: Kiểm tra đã migrate cây config cũ trong /data chưa
  ansible.builtin.stat:
    path: "{{ icinga_base_dir }}/icinga2/.whole-config-tree-v1"
  register: _ic_whole_config_migrated

# Không ghi đè file đang có trong /etc/icinga-ansible. Cách này giữ mọi chỉnh sửa hiện hữu,
# đồng thời mang sang features-enabled, conf.d/operator và các file do node setup từng tạo.
- name: Migrate một lần config Icinga 2 cũ sang cây config chính thức
  ansible.builtin.shell: |
    set -euo pipefail
    cp -a -n {{ ic_etc | quote }}/. {{ ic_config_dir | quote }}/
    chown -R {{ ic_uid }}:{{ ic_uid }} {{ ic_config_dir | quote }}
    touch {{ (icinga_base_dir + '/icinga2/.whole-config-tree-v1') | quote }}
  args:
    executable: /bin/bash
  when: not _ic_whole_config_migrated.stat.exists

- name: Helper one-off (mount data + nguyên cây config RW)
  ansible.builtin.set_fact:
    ic_run: >-
      docker run --rm
      -v {{ ic_data }}:/data:rw
      -v {{ ic_config_dir }}:/data/etc/icinga2:rw
      {{ images.icinga2 }}

- name: Tạo thư mục credential local trên master
  ansible.builtin.file:
    path: "{{ ic_master_secrets_dir }}"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0700"
  when: inventory_hostname in groups['master']
# ---------- Base config skeleton (toàn bộ /etc/icinga2 image ship kèm) — seed 1 LẦN ra node ---------
# Mục tiêu (theo yêu cầu người dùng — giống hệt kolla /etc/kolla/<svc>, KHÔNG lồng thêm thư mục con
# nào kiểu "base/"): MỌI file trong /etc/icinga2 đều là file THẬT nằm PHẲNG ngay dưới
# {{ icinga_etc_dir }}/icinga2/ (cùng cấp constants.conf/zones.conf/conf.d/... đã có), rồi mount
# nguyên cây này RW vào container. Trừ 3 thứ có cơ chế RIÊNG (không seed
# qua đây): `features-enabled/` (runtime, do `icinga2 feature enable` ghi), `zones.d/` (Icinga/operator
# tự quản lý), `ssh/` — và trừ `custom-plugins/` (KHÁC "scripts/" thật của image — xem giải thích BUG
# #2 bên dưới). Sửa tay trực tiếp trên node rồi `docker restart icinga2` là áp dụng ngay (bind-mount
# phản ánh thay đổi tức thời, restart chỉ để icinga2 daemon đọc lại). Ansible CHỈ SEED (copy 1 lần,
# force:false — không đè nếu node đã có, để không mất sửa tay) cho những file KHÔNG thuộc danh sách
# đang chủ động render mỗi lần `reconfigure` (constants.conf, zones.conf,
# features-available/icingadb.conf và conf.d/api-users.conf).
# BUG THẬT ĐÃ GẶP (2026-07-24, phát hiện khi verify monitor qua zone satellite — config KHÔNG sync
# xuống satellite dù log ApiListener báo "Finished sending config file updates"): loại trừ thêm
# "features-available/api.conf" — file này KHÔNG phải static, do "icinga2 node setup
# --accept-config --accept-commands" tự sinh (ghi vào cây config chính thức qua container one-off),
# nhưng seed base-config-skeleton ở block này chạy TRƯỚC "node setup" trong thứ tự task (seed nằm
# ngay đầu file, node setup của master2/satellite/client nằm xa phía dưới) → seed nhặt NHẦM bản mặc
# định của IMAGE (accept_config/accept_commands bị comment = false) từ ic_data ra
# icinga_etc_dir (nơi THẬT SỰ mount vào container chạy) TRƯỚC KHI "node setup" kịp sửa đúng nội
# dung đích — do seed dùng "force: false" (chỉ ghi 1 lần) nên bản SAI này từng tồn tại vĩnh viễn
# dù ic_data đã đúng sau đó. Hậu quả: node không "accept_config" thật (dù task node setup có đúng cờ
# --accept-config). Thiết kế mới tránh hai bản file: node setup và daemon cùng ghi trực tiếp vào
# {{ icinga_etc_dir }}/icinga2 qua mount nguyên thư mục.
- name: "Danh sách loại trừ dùng chung cho seed + mount base config (cơ chế riêng hoặc render riêng)"
  ansible.builtin.set_fact:
    # conf.d and scripts are monitoring content shipped as image examples. The role mounts only its
    # infrastructure ApiUser explicitly. zones.d is excluded because Ansible does not manage,
    # transport, mount or delete operator monitoring DSL.
    _ic_base_exclude_prefixes:
      - 'features-enabled/'
      - 'zones\.d/'
      - 'ssh/'
      - 'secret/'
      - 'custom-plugins/'
      - 'conf\.d/'
      - 'scripts/'
    _ic_base_exclude_relpaths:
      - constants.conf
      - zones.conf
      - features-available/icingadb.conf
      - features-available/api.conf
      - conf.d/api-users.conf
      - conf.d/custom-commands.conf
      - conf.d/ssh-checks.conf
      # Legacy role-authored monitoring files are deliberately never mounted.
      - conf.d/openstack-checks.conf
      # Đường credential cũ. clouds.yaml hiện nằm tại secrets/clouds.yaml trong cây config chính thức,
      # tương ứng /data/etc/icinga2/secrets/clouds.yaml trong container.
      - conf.d/clouds.yaml
      # Artifact top-level của cơ chế credential cũ. Task migration phía dưới xóa file này sau bước
      # scan, nên phải exclude ngay tại đây để danh sách mount không giữ một source vừa bị xóa.
      - openstack-clouds.yaml
      # conf.d/telegram-notifications.conf: KHÔNG còn render ở đây (đã chuyển sang
      # zones.d/global-templates/, xem block "BUG THẬT ĐÃ GẶP 2026-07-24" phía dưới) — vẫn phải giữ
      # trong exclude_relpaths (dù không render nữa) để file MỒ CÔI (còn sót từ bản deploy cũ, task
      # dọn nằm phía dưới trong file này chưa kịp chạy tới lúc quét) không bị "Dò danh sách file base
      # ĐÃ CÓ trên node" nhặt nhầm rồi mount lại — đã gặp lỗi thật: "OCI runtime create failed ...
      # not a directory" lúc container icinga2 khởi động vì mount trùng đích cũ.
      - conf.d/telegram-notifications.conf
      - telegram-host-notification.sh
      - telegram-service-notification.sh
      # Script này được mount riêng vào /usr/lib/nagios/custom-plugins. Nếu không loại trừ, lượt
      # deploy thứ hai quét nhầm file đã seed ở top-level thành base config, thêm một mount /data
      # không cần thiết và làm fingerprint đổi khiến cả hai container Icinga 2 bị recreate một lần.
      - check_openstack_service.py

# Seed base config là việc MỘT LẦN theo đúng nghĩa: "copy" dùng force:false nên từ lần chạy thứ hai
# trở đi cả hai loop bên dưới chỉ quét ~100 file để kết luận "không có gì đổi". Đo thật bằng
# profile_tasks trên cụm 2 master (2026-10-19): "Đảm bảo thư mục cha" 10.95s + "Seed từng file"
# 12.36s = 23.3s MỖI master, tức ~47s hoàn toàn vô ích trên mỗi lần deploy/reconfigure — chiếm gần
# 1/5 tổng thời gian 258s. Gate bằng stamp file ghi chính image đã seed: image đổi (skeleton có thể
# thêm file mới) thì tự seed lại, còn lại skip sạch.
#
# Muốn ép seed lại (vd đã xoá tay một file base config trên node và muốn lấy lại bản gốc):
#   rm {{ icinga_etc_dir }}/icinga2/.base-config-seeded   rồi chạy lại deploy/reconfigure.
- name: Đọc stamp base config đã seed
  ansible.builtin.slurp:
    src: "{{ icinga_etc_dir }}/icinga2/.base-config-seeded"
  register: _ic_base_stamp
  failed_when: false
  changed_when: false

- name: Xác định có cần seed base config hay không
  ansible.builtin.set_fact:
    _ic_base_seed_needed: >-
      {{ (_ic_base_stamp.content is not defined)
         or ((_ic_base_stamp.content | b64decode | trim) != images.icinga2) }}

- name: Dò toàn bộ file trong skeleton /data/etc/icinga2 (để seed ra node)
  ansible.builtin.find:
    paths: "{{ ic_etc }}"
    recurse: true
    file_type: file
    excludes: ["*.orig"]
  register: _ic_base_find
  when: _ic_base_seed_needed | bool

# Các nhánh động được migrate nguyên cây riêng, không seed từ skeleton ở block này.
- name: Danh sách relpath cần seed từ skeleton (loại trừ theo _ic_base_exclude_*)
  ansible.builtin.set_fact:
    _ic_base_relpaths: >-
      {{ _ic_base_find.files
         | map(attribute='path')
         | map('regex_replace', '^' ~ (ic_etc | regex_escape) ~ '/', '')
         | reject('in', _ic_base_exclude_relpaths)
         | list
         | select('match', '^(?!' ~ (_ic_base_exclude_prefixes | join('|')) ~ ').*$')
         | list }}
  when: _ic_base_seed_needed | bool

# BUG THẬT ĐÃ GẶP: "copy" với remote_src:true KHÔNG tự tạo thư mục cha (khác bản copy thường từ
# control node) — thiếu bước này làm mọi file trong conf.d/, features-available/ (đều nằm trong
# thư mục con) fail "Destination directory ... does not exist" ngay lần chạy đầu.
- name: Đảm bảo thư mục cha cho từng file base config
  ansible.builtin.file:
    path: "{{ (icinga_etc_dir + '/icinga2/' + item) | dirname }}"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"
  loop: "{{ _ic_base_relpaths | default([]) }}"
  loop_control: { label: "{{ item }}" }
  when: _ic_base_seed_needed | bool


- name: Seed từng file base config ra node (1 lần, không đè nếu node đã có)
  ansible.builtin.copy:
    src: "{{ ic_etc }}/{{ item }}"
    dest: "{{ icinga_etc_dir }}/icinga2/{{ item }}"
    remote_src: true
    force: false
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: preserve   # giữ nguyên bit thực thi cho scripts/mail-*.sh, không hardcode 0640
  loop: "{{ _ic_base_relpaths | default([]) }}"
  loop_control: { label: "{{ item }}" }
  when: _ic_base_seed_needed | bool
# Ghi stamp SAU khi seed xong — lần chạy sau đọc stamp này và skip cả block.
- name: Ghi stamp base config đã seed (theo image hiện tại)
  ansible.builtin.copy:
    content: "{{ images.icinga2 }}"
    dest: "{{ icinga_etc_dir }}/icinga2/.base-config-seeded"
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0640"
  when: _ic_base_seed_needed | bool

# Image icinga2 đóng gói sẵn demo config (conf.d/hosts.conf: host "NodeName" tự check ping tới
# 127.0.0.1) — check này FAIL trong container (không đủ quyền tạo raw ICMP socket) và gây
# "Overdue" giả trên dashboard sau khi thiếu check_interval nhiều lần (vd container hay restart).
# Host/service thật do operator quản lý ngoài role này, không dùng conf.d demo.
# 5 task lineinfile dưới đây sửa trên BẢN NODE ({{ icinga_etc_dir }}/icinga2/icinga2.conf, seed
# ở block trên) — KHÔNG phải bản trong /data — để bạn tự sửa thêm tay thoải mái mà 5 dòng include
# này vẫn tự đảm bảo đúng mỗi lần reconfigure (idempotent, không phá sửa tay khác của bạn).
- name: Tắt demo config mặc định của image (host/service tự check ping, không liên quan stack này)
  ansible.builtin.lineinfile:
    path: "{{ icinga_etc_dir }}/icinga2/icinga2.conf"
    # regexp khớp CẢ dạng gốc lẫn dạng đã comment — để idempotent, không append trùng lần sau.
    regexp: '^(//\s*)?include_recursive "conf\.d".*$'
    line: '// include_recursive "conf.d"   // tắt bởi icinga-ansible — xem roles/icinga2/tasks/main.yml'
  notify: Reload icinga2

# conf.d cũng chứa api-users.conf (ApiUser "icingaweb2" — web/API cần cái này) do role tự render
# vào đó (xem task "Render config icinga2" dưới) -> include LẠI riêng đúng 1 file này, không kéo
# theo cả đống demo hosts/services/... còn lại trong conf.d.
- name: Include lại riêng conf.d/api-users.conf (không kéo theo demo config)
  ansible.builtin.lineinfile:
    path: "{{ icinga_etc_dir }}/icinga2/icinga2.conf"
    line: 'include "conf.d/api-users.conf"'
    insertafter: '^// include_recursive "conf\.d"'
  notify: Reload icinga2

# Host/Service/CheckCommand là nội dung do operator sở hữu, không phải hạ tầng do role
# sinh ra. Role chỉ cung cấp một điểm include ổn định; operator có thể đặt file trực
# tiếp trên từng Icinga master trong conf.d/operator/. Không đọc, copy, đồng bộ hay xoá
# nội dung thư mục này từ deployment node, và tuyệt đối không dùng zones.d.
- name: Đảm bảo điểm include config operator tồn tại trên từng Icinga node
  ansible.builtin.file:
    # The whole host config tree is mounted into /data/etc/icinga2, so this directory is visible
    # immediately and remains operator-owned across container recreation.
    path: "{{ ic_config_dir }}/conf.d/operator"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"

- name: Include thư mục config do operator tự quản lý
  ansible.builtin.lineinfile:
    path: "{{ icinga_etc_dir }}/icinga2/icinga2.conf"
    line: 'include_recursive "conf.d/operator"'
    insertafter: '^include "conf\.d/api-users\.conf"'
  notify: Reload icinga2

# Monitoring content is operator-owned.  Keep old role-authored files on disk during an in-place
# upgrade, but make sure Icinga never loads them.  Fresh deployments do not create these files.
- name: Không include monitoring content cũ do role từng sinh
  ansible.builtin.lineinfile:
    path: "{{ icinga_etc_dir }}/icinga2/icinga2.conf"
    regexp: '^include "conf\.d/{{ item | regex_escape }}"'
    state: absent
  loop:
    - templates.conf
    - custom-commands.conf
    - ssh-checks.conf
    - openstack-checks.conf
    - telegram-notifications.conf
  notify: Reload icinga2

# LƯU Ý (đã gặp bug thật, ĐỪNG thêm lại): zones.d KHÔNG cần include tường minh trong icinga2.conf.
# Icinga2 tự động load zones.d/<zone>/ khi feature "api" bật (luôn bật ở stack này) như một phần cơ
# chế config-sync cluster, HOÀN TOÀN độc lập với include directive thường. Từng thử thêm
# `include_recursive "zones.d"` tường minh -> mỗi object trong zones.d/master/*.conf bị LOAD 2 LẦN
# (1 lần tự động + 1 lần theo include tường minh) -> lỗi "Object ... re-defined" -> icinga2
# crash-loop vĩnh viễn. Chỉ cần tạo thư mục/file trong zones.d, KHÔNG được đụng icinga2.conf cho việc này.
- name: Dọn dòng include zones.d thừa (nếu đã lỡ ghi từ bản code cũ — tự sửa lỗi)
  ansible.builtin.lineinfile:
    path: "{{ icinga_etc_dir }}/icinga2/icinga2.conf"
    regexp: '^include_recursive "zones\.d"'
    state: absent
  notify: Reload icinga2

# Renaming the parent zone of a running cluster is a topology migration, not a normal reconfigure:
# Director external objects and received zone caches still reference the old name. Permit any valid
# name on a fresh deployment, but fail before overwriting an already-rendered master identity.
- name: Kiểm tra ZoneName đã render trên master
  ansible.builtin.stat:
    path: "{{ icinga_etc_dir }}/icinga2/constants.conf"
  register: _ic_existing_master_constants
  when: inventory_hostname in groups['master']

- name: Đọc ZoneName hiệu lực bằng chính Icinga 2 trước khi reconfigure master
  ansible.builtin.command: "{{ ic_run }} icinga2 variable get ZoneName"
  register: _ic_existing_master_zone_result
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['master']
    - _ic_existing_master_constants.stat.exists | default(false)

- name: Chặn đổi tên master zone ngầm trên cluster đang chạy
  ansible.builtin.assert:
    that:
      - _ic_existing_master_zone_result.rc == 0
      - _ic_existing_master_zone_result.stdout | trim | length > 0
      - _ic_existing_master_zone_result.stdout | trim == icinga_master_zone_name
    fail_msg: >-
      Master này có ZoneName
      {{ (_ic_existing_master_zone_result.stdout | default('') | trim)
         or ('<không đọc được: ' ~ (_ic_existing_master_zone_result.stderr | default('') | trim) ~ '>') }},
      khác giá trị yêu cầu '{{ icinga_master_zone_name }}'. Hãy chạy qua tools/icinga-ansible để nạp
      /etc/icinga-ansible/globals.yml và giữ nguyên tên zone hiện tại; không đổi
      icinga_master_zone_name bằng reconfigure. Đổi tên cần quy trình migration topology riêng.
  when:
    - inventory_hostname in groups['master']
    - _ic_existing_master_constants.stat.exists | default(false)

# ---------- Bootstrap master (chỉ ca_host, chỉ lần đầu) ----------
# Gate theo cert RIÊNG của ca_host ({{ inventory_hostname }}.crt), KHÔNG phải theo ca.crt (2026-07-24,
# phục vụ restore-pki — mục backup/restore toàn hệ thống). Lý do: kịch bản "giữ PKI cũ" pre-seed
# ca.crt/ca.key (từ backup) vào ic_data TRƯỚC KHI "node setup --master" chạy lần đầu trên host MỚI —
# nếu gate theo ca_stat (ca.crt tồn tại), task này bị SKIP hẳn vì ca.crt đã có sẵn, khiến ca_host
# không bao giờ có cert riêng/api.conf/zones.conf cho chính nó. Đã verify THẬT (không suy đoán, test
# cô lập bằng 2 container icinga2 riêng biệt): "icinga2 node setup --master" tự phát hiện CA đã tồn
# tại ("Found CA, skipping and using the existing one"), KHÔNG tạo CA mới, chỉ tự ký cert MỚI cho
# đúng --cn truyền vào bằng CA đã có — an toàn để chạy ngay cả khi ca.crt được pre-seed từ trước.
- name: Kiểm tra CA đã tồn tại chưa
  ansible.builtin.stat:
    path: "{{ ic_data }}/var/lib/icinga2/ca/ca.crt"
  register: ca_stat

- name: "Kiểm tra cert riêng của ca_host đã tồn tại chưa (khác ca_stat — xem giải thích ở trên)"
  ansible.builtin.stat:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ inventory_hostname }}.crt"
  register: ca_host_own_cert_stat
  when: inventory_hostname == ca_host

- name: Kiểm tra ApiListener config của ca_host đã được tạo chưa
  ansible.builtin.stat:
    path: "{{ ic_config_dir }}/features-available/api.conf"
  register: ca_host_api_stat
  when: inventory_hostname == ca_host

- name: Xác minh cert ca_host bằng CA hiện tại
  ansible.builtin.command: >-
    {{ ic_run }} icinga2 pki verify
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
    --cacert /var/lib/icinga2/ca/ca.crt
  register: ca_host_cert_verify
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == ca_host
    - ca_host_own_cert_stat.stat.exists
    - ca_host_api_stat.stat.exists

- name: Chặn nếu không thực thi được phép kiểm tra cert ca_host
  ansible.builtin.assert:
    that: (ca_host_cert_verify.rc | int) in [0, 1]
    fail_msg: >-
      Không thể chạy icinga2 pki verify (rc={{ ca_host_cert_verify.rc }}).
      Dừng an toàn và giữ nguyên PKI; kiểm tra image/Docker/registry trước khi retry.
  when:
    - inventory_hostname == ca_host
    - ca_host_own_cert_stat.stat.exists
    - ca_host_api_stat.stat.exists

- name: Chốt trạng thái bootstrap ca_host hoàn chỉnh
  ansible.builtin.set_fact:
    _ca_host_setup_complete: >-
      {{ ca_stat.stat.exists and ca_host_own_cert_stat.stat.exists and
         ca_host_api_stat.stat.exists and (ca_host_cert_verify.rc | default(1)) == 0 }}
  when: inventory_hostname == ca_host

- name: Dọn cert node dở dang của ca_host để node setup có thể retry
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ item }}"
    state: absent
  loop:
    - "{{ inventory_hostname }}.crt"
    - "{{ inventory_hostname }}.key"
    - ca.crt
  when:
    - inventory_hostname == ca_host
    - not _ca_host_setup_complete

- name: Bootstrap master node (tạo CA + cert + ApiListener)
  ansible.builtin.command: >
    {{ ic_run }} icinga2 node setup --master --cn {{ inventory_hostname }} --zone {{ icinga_master_zone_name }}
  register: _ca_host_node_setup
  when:
    - inventory_hostname == ca_host
    - not _ca_host_setup_complete

- name: Sao CA ra thư mục pki riêng (để backup — mục 10.5)
  ansible.builtin.shell: >
    cp -a {{ ic_data }}/var/lib/icinga2/ca/. {{ icinga_base_dir }}/icinga2/pki/ 2>/dev/null || true
  args: { executable: /bin/bash }
  changed_when: false
  when: inventory_hostname == ca_host

# ---------- Master thứ 2 (peer trong CÙNG zone "master", ticket-based — design 9.2) ----------
# Chỉ chạy khi is_ha_master (2 master) và host hiện tại KHÔNG phải ca_host.
# Nhờ playbook có "serial: 1" trên hosts:master, ca_host luôn xong (kể cả container icinga2
# đã start, ApiListener đang nghe) trước khi tới lượt master2 — nên request cert qua mạng được.
- name: (master2) Kiểm tra cert máy chủ đã có chưa
  ansible.builtin.stat:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ inventory_hostname }}.crt"
  register: master2_cert_stat
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

- name: (master2) Kiểm tra api.conf đã được node setup hoàn tất chưa
  ansible.builtin.stat:
    path: "{{ ic_config_dir }}/features-available/api.conf"
  register: master2_api_stat
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

- name: (master2) Xác minh cert hiện tại thực sự do CA ký
  ansible.builtin.command: >-
    {{ ic_run }} icinga2 pki verify
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
    --cacert /var/lib/icinga2/certs/ca.crt
  register: master2_cert_verify
  changed_when: false
  failed_when: false
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - master2_cert_stat.stat.exists
    - master2_api_stat.stat.exists

- name: (master2) Chặn nếu không thực thi được phép kiểm tra cert
  ansible.builtin.assert:
    that: (master2_cert_verify.rc | int) in [0, 1]
    fail_msg: >-
      Không thể chạy icinga2 pki verify (rc={{ master2_cert_verify.rc }}).
      Dừng an toàn và giữ nguyên PKI; kiểm tra image/Docker/registry trước khi retry.
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - master2_cert_stat.stat.exists
    - master2_api_stat.stat.exists

- name: (master2) Đọc api.conf để xác minh cờ nhận config/command
  ansible.builtin.slurp:
    src: "{{ ic_config_dir }}/features-available/api.conf"
  register: master2_api_conf
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - master2_api_stat.stat.exists

- name: (master2) Chốt trạng thái enrollment hoàn chỉnh
  ansible.builtin.set_fact:
    _master2_enrollment_complete: >-
      {{ master2_cert_stat.stat.exists and master2_api_stat.stat.exists and
         (master2_cert_verify.rc | default(1)) == 0 and
         'accept_config = true' in (master2_api_conf.content | default('') | b64decode) and
         'accept_commands = true' in (master2_api_conf.content | default('') | b64decode) }}
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

- name: (master2) Dọn artifact enrollment dở dang để retry sạch
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ item }}"
    state: absent
  loop:
    - "{{ inventory_hostname }}.crt"
    - "{{ inventory_hostname }}.key"
    - ca.crt
    - trusted-parent.crt
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

- name: (master2) Sinh ticket ký cert — chạy TRÊN ca_host (chỉ ca_host có CA private key)
  ansible.builtin.command: "{{ ic_run }} icinga2 pki ticket --cn {{ inventory_hostname }}"
  delegate_to: "{{ ca_host }}"
  register: master2_ticket
  changed_when: false
  no_log: true
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

- name: (master2) Tạo thư mục certs cục bộ
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/certs"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

- name: (master2) Sinh private key + cert tự ký cục bộ
  # pki new-cert: --cert (KHÔNG phải --csr) để sinh self-signed cert — cert này dùng làm định danh
  # TLS client khi request tới parent; pki request (bước sau) sẽ GHI ĐÈ nó bằng bản CA đã ký.
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki new-cert --cn {{ inventory_hostname }}
    --key /var/lib/icinga2/certs/{{ inventory_hostname }}.key
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

- name: (master2) Lấy & tin cậy cert của CA host (parent) qua mạng
  # pki save-cert KHÔNG nhận --key/--cert (chỉ trustedcert/host/port) — xem icinga2 pki save-cert --help.
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki save-cert
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --host {{ hostvars[ca_host].ansible_host | default(ca_host) }}
    --port {{ icinga2_api_port }}
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

- name: (master2) Request cert đã ký từ CA host (xác thực bằng ticket)
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki request
    --host {{ hostvars[ca_host].ansible_host | default(ca_host) }}
    --port {{ icinga2_api_port }}
    --ticket {{ master2_ticket.stdout | trim }}
    --key /var/lib/icinga2/certs/{{ inventory_hostname }}.key
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --ca /var/lib/icinga2/certs/ca.crt
  no_log: true
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

- name: (master2) node setup hoàn tất (ApiListener + trust chain cục bộ)
  ansible.builtin.command: >
    {{ ic_run }} icinga2 node setup
    --cn {{ inventory_hostname }}
    --endpoint {{ ca_host }},{{ hostvars[ca_host].ansible_host | default(ca_host) }},{{ icinga2_api_port }}
    --zone {{ icinga_master_zone_name }}
    --parent_zone {{ icinga_master_zone_name }}
    --parent_host {{ hostvars[ca_host].ansible_host | default(ca_host) }},{{ icinga2_api_port }}
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --ticket {{ master2_ticket.stdout | trim }}
    --accept-config
    --accept-commands
  register: _master2_node_setup
  no_log: true
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host
    - not _master2_enrollment_complete

# ---------- CA nhân bản sang master2 (bỏ SPOF ký cert — design 9.2) ----------
# Sau khi master2 đã tự có cert của MÌNH ở trên, copy thêm CHÍNH CA (ca.crt+ca.key) sang master2
# để cả 2 master đều ký được cert cho node mới (satellite/master thêm sau) kể cả khi ca_host chết.
- name: (CA HA) Đọc ca.crt/ca.key từ ca_host
  ansible.builtin.slurp:
    src: "{{ ic_data }}/var/lib/icinga2/ca/{{ item }}"
  delegate_to: "{{ ca_host }}"
  loop: [ca.crt, ca.key]
  register: ca_files_slurp
  no_log: true
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

- name: (CA HA) Tạo thư mục ca cục bộ trên master2
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/ca"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0700"
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

- name: (CA HA) Ghi ca.crt/ca.key ra master2
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ ic_data }}/var/lib/icinga2/ca/{{ item.item }}"
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0600"
  loop: "{{ ca_files_slurp.results }}"
  no_log: true
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

- name: (CA HA) Sao CA (bản master2) ra thư mục pki riêng — để backup
  ansible.builtin.shell: >
    cp -a {{ ic_data }}/var/lib/icinga2/ca/. {{ icinga_base_dir }}/icinga2/pki/ 2>/dev/null || true
  args: { executable: /bin/bash }
  changed_when: false
  when:
    - is_ha_master | bool
    - inventory_hostname in groups['master']
    - inventory_hostname != ca_host

# ---------- Satellite (zone con của "master", ticket-based — design 8.3/9.2/12.1) ----------
# Chỉ chạy trên host thuộc [satellite]. Cùng cơ chế ticket-based như master2 (pki new-cert ->
# save-cert -> request -> node setup), khác ở chỗ zone = zone con riêng (không phải "master"),
# và ticket/enrollment chỉ cần nối tới ca_host (không cần CA HA vì satellite không tự ký cert cho ai).
- name: (satellite) Xác định zone của satellite hiện tại (từ satellite_zones trong globals)
  ansible.builtin.set_fact:
    satellite_zone: >-
      {% for z in satellite_zones %}{% if inventory_hostname in z.members %}{{ z.name }}{% endif %}{% endfor %}
  when: inventory_hostname in groups['satellite']

- name: (satellite) Chặn cứng nếu host không thuộc zone nào khai trong satellite_zones
  ansible.builtin.assert:
    that: satellite_zone | length > 0
    fail_msg: >-
      Host '{{ inventory_hostname }}' nằm trong [satellite] nhưng không có trong bất kỳ
      satellite_zones[].members nào (globals.yml). Khai zone cho host này trước khi deploy.
  when: inventory_hostname in groups['satellite']

- name: (satellite) Kiểm tra cert máy chủ đã có chưa
  ansible.builtin.stat:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ inventory_hostname }}.crt"
  register: sat_cert_stat
  when: inventory_hostname in groups['satellite']

- name: (satellite) Kiểm tra api.conf đã được node setup hoàn tất chưa
  ansible.builtin.stat:
    path: "{{ ic_config_dir }}/features-available/api.conf"
  register: sat_api_stat
  when: inventory_hostname in groups['satellite']

- name: (satellite) Xác minh cert hiện tại thực sự do CA ký
  ansible.builtin.command: >-
    {{ ic_run }} icinga2 pki verify
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
    --cacert /var/lib/icinga2/certs/ca.crt
  register: sat_cert_verify
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['satellite']
    - sat_cert_stat.stat.exists
    - sat_api_stat.stat.exists

- name: (satellite) Chặn nếu không thực thi được phép kiểm tra cert
  ansible.builtin.assert:
    that: (sat_cert_verify.rc | int) in [0, 1]
    fail_msg: >-
      Không thể chạy icinga2 pki verify (rc={{ sat_cert_verify.rc }}).
      Dừng an toàn và giữ nguyên PKI; kiểm tra image/Docker/registry trước khi retry.
  when:
    - inventory_hostname in groups['satellite']
    - sat_cert_stat.stat.exists
    - sat_api_stat.stat.exists

- name: (satellite) Đọc api.conf để xác minh cờ nhận config/command
  ansible.builtin.slurp:
    src: "{{ ic_config_dir }}/features-available/api.conf"
  register: sat_api_conf
  when:
    - inventory_hostname in groups['satellite']
    - sat_api_stat.stat.exists

- name: (satellite) Chốt trạng thái enrollment hoàn chỉnh
  ansible.builtin.set_fact:
    _sat_enrollment_complete: >-
      {{ sat_cert_stat.stat.exists and sat_api_stat.stat.exists and
         (sat_cert_verify.rc | default(1)) == 0 and
         'accept_config = true' in (sat_api_conf.content | default('') | b64decode) and
         'accept_commands = true' in (sat_api_conf.content | default('') | b64decode) }}
  when: inventory_hostname in groups['satellite']

- name: (satellite) Dọn artifact enrollment dở dang để retry sạch
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ item }}"
    state: absent
  loop:
    - "{{ inventory_hostname }}.crt"
    - "{{ inventory_hostname }}.key"
    - ca.crt
    - trusted-parent.crt
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

- name: (satellite) Sinh ticket ký cert — chạy TRÊN ca_host (chỉ ca_host/master có CA private key)
  ansible.builtin.command: "{{ ic_run }} icinga2 pki ticket --cn {{ inventory_hostname }}"
  delegate_to: "{{ ca_host }}"
  register: sat_ticket
  changed_when: false
  no_log: true
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

- name: (satellite) Tạo thư mục certs cục bộ
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/certs"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

- name: (satellite) Sinh private key + cert tự ký cục bộ
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki new-cert --cn {{ inventory_hostname }}
    --key /var/lib/icinga2/certs/{{ inventory_hostname }}.key
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

- name: (satellite) Lấy & tin cậy cert của CA host (parent) qua mạng
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki save-cert
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --host {{ hostvars[ca_host].ansible_host | default(ca_host) }}
    --port {{ icinga2_api_port }}
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

- name: (satellite) Request cert đã ký từ CA host (xác thực bằng ticket)
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki request
    --host {{ hostvars[ca_host].ansible_host | default(ca_host) }}
    --port {{ icinga2_api_port }}
    --ticket {{ sat_ticket.stdout | trim }}
    --key /var/lib/icinga2/certs/{{ inventory_hostname }}.key
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --ca /var/lib/icinga2/certs/ca.crt
  no_log: true
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

- name: (satellite) node setup hoàn tất (zone con, chỉ trust ca_host làm parent)
  # KHÔNG --accept-config/--accept-commands ở đây theo kiểu master2: satellite CẦN accept-config
  # (nhận CheckCommand/template từ zones.d master) và accept-commands (nhận lệnh check-result routing)
  # — đúng thiết kế design 9.3 (config chỉ chảy xuống qua zones.d/<sat-zone> hoặc global zone).
  ansible.builtin.command: >
    {{ ic_run }} icinga2 node setup
    --cn {{ inventory_hostname }}
    --endpoint {{ ca_host }},{{ hostvars[ca_host].ansible_host | default(ca_host) }},{{ icinga2_api_port }}
    --zone {{ satellite_zone }}
    --parent_zone {{ icinga_master_zone_name }}
    --parent_host {{ hostvars[ca_host].ansible_host | default(ca_host) }},{{ icinga2_api_port }}
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --ticket {{ sat_ticket.stdout | trim }}
    --accept-config
    --accept-commands
  register: _satellite_node_setup
  no_log: true
  when:
    - inventory_hostname in groups['satellite']
    - not _sat_enrollment_complete

# ---------- Client (command endpoint, zone riêng 1 node — Icinga2 "Client" chuẩn) ----------
# Khác satellite: zone của client CHỈ có 1 endpoint (chính nó), không phải zone con chia sẻ.
# Host/Service dùng command_endpoint do operator tự định nghĩa ngoài role này; role chỉ quản lý
# endpoint, zone và PKI.
# BUG ĐÃ GẶP: ban đầu chỉ đặt --accept-commands (không --accept-config) vì nghĩ client "thuần" không
# cần đồng bộ config. Thực tế `node setup` KHÔNG có --accept-config sẽ render api.conf theo template
# KHÁC (accept_config/accept_commands bị COMMENT thành false, thêm `ticket_salt = TicketSalt`) và
# KHÔNG ghi ra ca.crt ở /var/lib/icinga2/certs/ -> ApiListener không load được cert -> crash-loop
# vĩnh viễn. Fix: luôn đặt CẢ --accept-config lẫn --accept-commands giống satellite (accept-config
# vô hại với client vì client không có zone con nào trong zones.d để nhận config xuống).
- name: (client) Kiểm tra cert máy chủ đã có chưa
  ansible.builtin.stat:
    path: "{{ ic_data }}/var/lib/icinga2/certs/{{ inventory_hostname }}.crt"
  register: client_cert_stat
  when: inventory_hostname in groups['client'] | default([])

- name: (client) Sinh ticket ký cert — chạy TRÊN ca_host
  ansible.builtin.command: "{{ ic_run }} icinga2 pki ticket --cn {{ inventory_hostname }}"
  delegate_to: "{{ ca_host }}"
  register: client_ticket
  changed_when: false
  no_log: true
  when:
    - inventory_hostname in groups['client'] | default([])
    - not client_cert_stat.stat.exists

- name: (client) Tạo thư mục certs cục bộ
  ansible.builtin.file:
    path: "{{ ic_data }}/var/lib/icinga2/certs"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"
  when:
    - inventory_hostname in groups['client'] | default([])
    - not client_cert_stat.stat.exists

- name: (client) Sinh private key + cert tự ký cục bộ
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki new-cert --cn {{ inventory_hostname }}
    --key /var/lib/icinga2/certs/{{ inventory_hostname }}.key
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
  when:
    - inventory_hostname in groups['client'] | default([])
    - not client_cert_stat.stat.exists

- name: (client) Lấy & tin cậy cert của CA host (parent) qua mạng
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki save-cert
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --host {{ hostvars[ca_host].ansible_host | default(ca_host) }}
    --port {{ icinga2_api_port }}
  when:
    - inventory_hostname in groups['client'] | default([])
    - not client_cert_stat.stat.exists

- name: (client) Request cert đã ký từ CA host (xác thực bằng ticket)
  ansible.builtin.command: >
    {{ ic_run }} icinga2 pki request
    --host {{ hostvars[ca_host].ansible_host | default(ca_host) }}
    --port {{ icinga2_api_port }}
    --ticket {{ client_ticket.stdout | trim }}
    --key /var/lib/icinga2/certs/{{ inventory_hostname }}.key
    --cert /var/lib/icinga2/certs/{{ inventory_hostname }}.crt
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --ca /var/lib/icinga2/certs/ca.crt
  no_log: true
  when:
    - inventory_hostname in groups['client'] | default([])
    - not client_cert_stat.stat.exists

- name: (client) node setup hoàn tất (zone 1 node, chỉ nhận lệnh chạy check từ master)
  ansible.builtin.command: >
    {{ ic_run }} icinga2 node setup
    --cn {{ inventory_hostname }}
    --endpoint {{ ca_host }},{{ hostvars[ca_host].ansible_host | default(ca_host) }},{{ icinga2_api_port }}
    --zone {{ inventory_hostname }}
    --parent_zone {{ icinga_master_zone_name }}
    --parent_host {{ hostvars[ca_host].ansible_host | default(ca_host) }},{{ icinga2_api_port }}
    --trustedcert /var/lib/icinga2/certs/trusted-parent.crt
    --ticket {{ client_ticket.stdout | trim }}
    --accept-config
    --accept-commands
  register: _client_node_setup
  no_log: true
  when:
    - inventory_hostname in groups['client'] | default([])
    - not client_cert_stat.stat.exists

# ---------- Config có kiểm soát, override-aware (deploy node -> target node, design.md 4.1) --------
- name: Render config icinga2 (constants/zones/feature/api-users)
  ansible.builtin.include_tasks: render_config_item.yml
  loop:
    - { relpath: constants.conf, template: constants.conf.j2 }
    - { relpath: zones.conf,     template: zones.conf.j2 }
    - { relpath: "features-available/icingadb.conf", template: icingadb.conf.j2 }
    - { relpath: "conf.d/api-users.conf",             template: api-users.conf.j2 }
  loop_control:
    loop_var: cfg

# ---------- SSH key cho check ra host ngoài cluster (design.md 9.4) ----------
# Chạy trên MỌI node icinga2 (check có thể thực thi từ satellite lẫn master).
- name: Đảm bảo thư mục nguồn SSH của operator tồn tại trên deployment node
  ansible.builtin.file:
    path: "{{ deploy_config_dir }}/icinga2/ssh"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Đảm bảo thư mục SSH key monitor tồn tại
  ansible.builtin.file:
    path: "{{ icinga_etc_dir }}/icinga2/ssh"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0700"

- name: Kiểm tra từng file SSH monitor trên deploy node
  ansible.builtin.stat:
    path: "{{ deploy_config_dir }}/icinga2/ssh/{{ item }}"
  delegate_to: localhost
  become: false
  loop: [id_monitor, known_hosts]
  register: _ic_ssh_stat

- name: Đồng bộ từng file SSH monitor từ deploy node ra target node (nếu có)
  ansible.builtin.copy:
    src: "{{ deploy_config_dir }}/icinga2/ssh/{{ item.item }}"
    dest: "{{ icinga_etc_dir }}/icinga2/ssh/{{ item.item }}"
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0600"
  loop: "{{ _ic_ssh_stat.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.stat.exists
  notify: Reload icinga2

- name: Danh sách file SSH thật sự có
  ansible.builtin.set_fact:
    _ic_ssh_names: "{{ _ic_ssh_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"

# Xoá file mồ côi trên target nếu đã bị xoá khỏi deploy node — QUAN TRỌNG với private key: nếu
# không dọn, key đã "xoá" ở nguồn (vd rotate/revoke) vẫn nằm lại + được mount trong container mọi
# node icinga2 vĩnh viễn (copy chỉ CỘNG THÊM, không tự xoá phần thiếu).
- name: Xoá từng file SSH monitor mồ côi trên target
  ansible.builtin.file:
    path: "{{ icinga_etc_dir }}/icinga2/ssh/{{ item }}"
    state: absent
  loop: [id_monitor, known_hosts]
  when: item not in _ic_ssh_names
  notify: Reload icinga2

# Dọn artifact credential per-file của phiên bản cũ trên mọi node khi nâng cấp tại chỗ.
- name: "Xóa artifact credential runtime theo cơ chế cũ"
  ansible.builtin.file:
    path: "{{ icinga_etc_dir }}/icinga2/openstack-clouds.yaml"
    state: absent
  notify: Reload icinga2

# ---------- Script check tuỳ biến (design.md 14.5) ----------
# Thư mục đặt tên "custom-plugins/" (KHÔNG phải "scripts/") — cố ý tránh trùng tên với "scripts/"
# THẬT của image (chứa mail-host-notification.sh..., seed qua cơ chế base config skeleton ở trên,
# mount về ĐÚNG /data/etc/icinga2/scripts/) — 2 thứ này mount về 2 ĐÍCH hoàn toàn khác nhau
# (/usr/lib/nagios/custom-plugins/ vs /data/etc/icinga2/scripts/), gộp chung 1 tên thư mục sẽ vỡ.
# Đây là TẬP file tuỳ ý người dùng tự thêm. Role đồng bộ chúng vào cây config host rồi mount nguyên
# custom-plugins thêm một lần vào đường dẫn plugin chuẩn của container.
- name: Đảm bảo thư mục nguồn custom-plugins của operator tồn tại trên deployment node
  ansible.builtin.file:
    path: "{{ deploy_config_dir }}/icinga2/custom-plugins"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  run_once: true

- name: Đảm bảo thư mục custom-plugins (script check tuỳ biến) tồn tại
  ansible.builtin.file:
    path: "{{ icinga_etc_dir }}/icinga2/custom-plugins"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"

- name: Dò danh sách file script tuỳ biến trên deploy node
  ansible.builtin.find:
    paths: "{{ deploy_config_dir }}/icinga2/custom-plugins"
    file_type: file
  delegate_to: localhost
  become: false
  register: _ic_script_find
  ignore_errors: true   # thư mục có thể chưa tồn tại nếu chưa ai thêm script nào

- name: Danh sách tên file script (rỗng nếu chưa ai thêm gì)
  ansible.builtin.set_fact:
    _ic_script_names: "{{ (_ic_script_find.files | default([])) | map(attribute='path') | map('basename') | sort | list }}"

- name: "Đồng bộ từng file script sang target (per-file)"
  ansible.builtin.copy:
    src: "{{ deploy_config_dir }}/icinga2/custom-plugins/{{ item }}"
    dest: "{{ icinga_etc_dir }}/icinga2/custom-plugins/{{ item }}"
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0755"
  loop: "{{ _ic_script_names }}"
  notify: Reload icinga2

- name: Dò danh sách file script ĐÃ CÓ trên target (để xoá file mồ côi không còn ở nguồn)
  ansible.builtin.find:
    paths: "{{ icinga_etc_dir }}/icinga2/custom-plugins"
    file_type: file
  register: _ic_script_target_find

- name: "Xoá file script mồ côi trên target (đã bị xoá khỏi deploy node)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _ic_script_target_find.files | map(attribute='path') | list }}"
  loop_control: { label: "{{ item | basename }}" }
  when: (item | basename) not in _ic_script_names
  notify: Reload icinga2

# ---------- Mount nguyên cây config chính thức ----------
- name: Xây danh sách volume Icinga 2
  ansible.builtin.set_fact:
    _ic_dynamic_volumes:
      - "{{ ic_data }}:/data:rw"
      - "{{ ic_config_dir }}:/data/etc/icinga2:rw"

# Plugin phải xuất hiện thêm ở đường dẫn plugin chuẩn, ngoài cây /data/etc/icinga2.
- name: Mount nguyên thư mục custom plugin vào đường dẫn thực thi
  ansible.builtin.set_fact:
    _ic_dynamic_volumes: >-
      {{ _ic_dynamic_volumes +
         [ic_config_dir + '/custom-plugins:/usr/lib/nagios/custom-plugins:rw'] }}

- name: Bật các feature khai báo (idempotent)
  # Satellite KHÔNG có Redis cục bộ (chỉ master mới chạy icingadb-redis) -> loại 'icingadb' khỏi
  # danh sách feature bật trên satellite, nếu không icinga2 sẽ liên tục lỗi kết nối 127.0.0.1:6380.
  ansible.builtin.command: >
    {{ ic_run }} icinga2 feature enable {{ effective_icinga2_features | join(' ') }}
  vars:
    effective_icinga2_features: >-
      {{ (enable_icinga2_features + enable_icinga2_integration_features)
         if inventory_hostname in groups['master']
         else (enable_icinga2_features + enable_icinga2_integration_features) | reject('equalto', 'icingadb') | list }}
  register: feat_enable
  # "Enabling feature 'X'." chỉ xuất hiện cho feature THẬT SỰ mới bật; "Feature 'X' already enabled."
  # cho feature cũ. Check theo dòng (không phải substring "already enabled" toàn bộ stdout) để không
  # bị che khi 1 batch có cả feature mới lẫn feature cũ.
  changed_when: "'Enabling feature' in feat_enable.stdout"
  notify: Reload icinga2

- name: Chặn cứng — tắt ido-mysql/ido-pgsql
  ansible.builtin.command: "{{ ic_run }} icinga2 feature disable ido-mysql ido-pgsql"
  register: feat_disable
  changed_when: "'Disabling' in feat_disable.stdout"
  failed_when: false
  notify: Reload icinga2

# ---------- Chạy daemon ----------
# icinga-ansible KHÔNG tự build image — "images.icinga2" đã tự chọn bản gốc (images_upstream) hay bản
# custom (custom_image_registry + custom_image_overrides.icinga2, xem group_vars/all.yml + design.md
# mục 9.6) tuỳ globals.yml, docker_container tự pull về nếu node chưa có, mọi role/task khác trong
# file này chỉ cần tham chiếu "images.icinga2" mà không cần biết đang dùng bản nào.
- name: Lập lệnh validate config bằng đúng image và toàn bộ mount sắp deploy
  ansible.builtin.set_fact:
    _ic_validate_argv: [docker, run, --rm, --network, host]

- name: Gắn toàn bộ volume vào container validate dùng một lần
  ansible.builtin.set_fact:
    _ic_validate_argv: "{{ _ic_validate_argv + ['-v', item] }}"
  loop: "{{ _ic_dynamic_volumes }}"
  loop_control: { label: "{{ item }}" }

- name: Hoàn tất lệnh validate config
  ansible.builtin.set_fact:
    _ic_validate_argv: "{{ _ic_validate_argv + ['--entrypoint', 'icinga2', images.icinga2, 'daemon', '-C'] }}"

- name: Validate config mới trước khi thay đổi container đang phục vụ
  ansible.builtin.command:
    argv: "{{ _ic_validate_argv }}"
  changed_when: false

- name: Tính fingerprint nội dung config để recreate container khi bind-mounted file đổi inode
  ansible.builtin.find:
    paths: "{{ icinga_etc_dir }}/icinga2"
    recurse: true
    file_type: file
    get_checksum: true
  register: _ic_config_files

- name: Chốt fingerprint config
  ansible.builtin.set_fact:
    _ic_config_fingerprint: >-
      {{ (_ic_config_files.files | sort(attribute='path') | map(attribute='checksum') | join(':'))
         | hash('sha256') }}

- name: Ghi nhận node setup đã thay đổi runtime/PKI trong lượt chạy này
  ansible.builtin.set_fact:
    _ic_node_setup_changed: >-
      {{ ((_ca_host_node_setup | default({})).changed | default(false)) or
         ((_master2_node_setup | default({})).changed | default(false)) or
         ((_satellite_node_setup | default({})).changed | default(false)) or
         ((_client_node_setup | default({})).changed | default(false)) }}

# `node setup` có thể thay inode của constants.conf/api.conf bên trong /data.
# Container cũ vẫn giữ bind mount tới inode cũ dù file Ansible vừa render lại có
# đúng nội dung. Kiểm tra container hiện tại để retry sau sự cố luôn tự sửa được.
- name: Kiểm tra config của container Icinga 2 hiện tại trước khi quyết định recreate
  ansible.builtin.command: docker exec icinga2 icinga2 daemon -C
  register: _ic_current_validate
  changed_when: false
  failed_when: false

- name: Khởi động container icinga2 (host network, mount /data)
  community.docker.docker_container:
    name: icinga2
    image: "{{ images.icinga2 }}"
    state: started
    recreate: "{{ _ic_node_setup_changed or _ic_current_validate.rc != 0 }}"
    restart_policy: unless-stopped
    network_mode: host
    # NET_RAW: container mặc định KHÔNG có quyền tạo raw ICMP socket -> check dùng ping (hostalive,
    # ping4...) fail "Could not interpret output from ping command" dù plugin/daemon hoàn toàn khoẻ
    # mạnh. THỬ NGHIỆM ĐÃ XÁC NHẬN: cấp NET_RAW ở đây KHÔNG ĐỦ để ping hoạt động — container chạy
    # user thường (uid 5665), --cap-add chỉ thêm vào bounding set, non-root process cần THÊM file
    # capability (setcap cap_net_raw+ep) ngay trên binary /usr/lib/nagios/plugins/check_ping mà
    # image không có sẵn -> phải build lại image mới sửa triệt để (ngoài phạm vi hiện tại). Giữ
    # NET_RAW ở đây vì vô hại/có thể cần cho việc khác, nhưng KHÔNG dùng check ping/hostalive cho
    # Cluster API phải phản hồi; nội dung Host/Service là ngoài phạm vi health-check hạ tầng.
    capabilities:
      - NET_RAW
    # /data giữ runtime/PKI; /data/etc/icinga2 bị mount lồng bằng nguyên cây config chính thức RW.
    # Nhờ vậy file do operator hoặc Icinga tự tạo trong cây config đều tồn tại trực tiếp trên host.
    volumes: "{{ _ic_dynamic_volumes }}"
    # Proxy ra Internet cho plugin/operator integration chạy trong container —
    # mạng lab bắt buộc qua proxy công ty cho MỌI traffic ra ngoài, kể cả container (đã xác nhận:
    # generic internet 1.1.1.1 direct từ trong container TREO hẳn dù network_mode=host + cùng
    # resolv.conf với host, trong khi qua "-x proxy" thì OK ngay; host tự curl direct lại OK — khác
    # biệt do rule mạng/host chỉ áp dụng transparent-proxy cho tiến trình host, không áp dụng cho
    # container). Trước đây `proxy_environment` chỉ dùng cho bootstrap (apt/Docker daemon) — giờ
    # gắn thêm vào container icinga2 để script gọi ra ngoài tự
    # đi qua proxy mà không cần tự cấu hình trong từng script. Khi globals không khai proxy, biến
    # này lấy từ /etc/environment qua facts.env; nếu host không có proxy thì vẫn là {}.
    env: "{{ proxy_environment | combine({'ICINGA_ANSIBLE_CONFIG_FINGERPRINT': _ic_config_fingerprint}) }}"
    # BUG THẬT ĐÃ GẶP (đọc trước khi đổi lại volumes:): so sánh mặc định của docker_container cho
    # "volumes" chỉ phát hiện mount MỚI THÊM, KHÔNG phát hiện mount bị RÚT BỚT khỏi list -> xoá 1
    # script/zone khỏi nguồn rồi reconfigure lại KHÔNG tự gỡ mount cũ (container không được recreate,
    # để lại mount "ma" trỏ tới file không còn tồn tại). Bắt buộc "strict" để volumes: luôn phản ánh
    # ĐÚNG danh sách hiện tại (thêm + xoá đều kích hoạt recreate).
    comparisons:
      volumes: strict
    healthcheck:
      test: ["CMD", "icinga2", "daemon", "-C"]
      interval: 30s
      timeout: 10s
      retries: 3
  register: _icinga2_container

- name: Chờ container icinga2 chạy ổn
  ansible.builtin.command: docker exec icinga2 icinga2 daemon -C
  register: ic_validate
  retries: 5
  delay: 4
  until: ic_validate.rc == 0
  changed_when: false

# ---------- Log thật, dễ đọc (2026-07-23, theo yêu cầu người dùng) ----------
# Log icinga2 (feature "mainlog") thật ra ĐÃ NẰM SẴN trên host — image symlink /var/log/icinga2 ->
# /data/var/log/icinga2 BÊN TRONG container, mà /data đã bind-mount RW vào {{ ic_data }} trên host
# (xem "Khởi động container icinga2" ở trên) — không cần thêm mount nào cả, chỉ là đường dẫn thật
# quá sâu/khó nhớ ({{ icinga_base_dir }}/icinga2/data/var/log/icinga2/icinga2.log). Tạo 1 symlink ở
# đường dẫn CHUẨN /var/log/<hệ điều hành thường dùng> để dễ tra (vd `tail -f
# /var/log/icinga-ansible/icinga2/icinga2.log`), không đụng gì tới cơ chế mount/mainlog hiện có.
- name: Tạo /var/log/icinga-ansible/ (thư mục gốc chung cho log mọi service)
  ansible.builtin.file:
    path: /var/log/icinga-ansible
    state: directory
    mode: "0755"

- name: "Symlink log icinga2 ra /var/log/icinga-ansible/icinga2 (trỏ tới {{ ic_data }}/var/log/icinga2 thật)"
  ansible.builtin.file:
    src: "{{ ic_data }}/var/log/icinga2"
    dest: /var/log/icinga-ansible/icinga2
    state: link
    force: true

