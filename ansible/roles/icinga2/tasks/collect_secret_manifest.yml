---
# Called once per existing source directory, in global -> role -> host order. combine() makes the
# later source path win for an identical relative path.
- name: Ghi nhận bản hiệu lực của từng file secret
  ansible.builtin.set_fact:
    _ic_secret_effective_files: >-
      {{ _ic_secret_effective_files | combine({
           (secret_source_file.path
            | regex_replace('^' ~ ((secret_source_find.secret_source_stat.secret_source_dir + '/')
                                    | regex_escape), '')): secret_source_file.path
         }) }}
  loop: "{{ secret_source_find.files }}"
  loop_control:
    loop_var: secret_source_file
    label: "secret file"
  no_log: true
