---
# Mọi cấu hình theo zone được tạo hoặc đọc trên deployment node trước, sau đó mới copy xuống
# ca_host. File có marker bên dưới thuộc quyền quản lý của Ansible và được render lại mỗi lần chạy.
# Khi operator xóa marker, nội dung trên deployment node trở thành nguồn chính và không bị render đè.

- name: "Đường dẫn cho zones.d/{{ zcfg.zone }}/{{ zcfg.file }}"
  ansible.builtin.set_fact:
    _zcfg_deploy_path: "{{ deploy_config_dir }}/icinga2/zones.d/{{ zcfg.zone }}/{{ zcfg.file }}"
    _zcfg_node_path: "{{ icinga_etc_dir }}/icinga2/zones.d/{{ zcfg.zone }}/{{ zcfg.file }}"

- name: "Tạo thư mục zones.d/{{ zcfg.zone }} trên deployment node"
  ansible.builtin.file:
    path: "{{ deploy_config_dir }}/icinga2/zones.d/{{ zcfg.zone }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false

- name: "Kiểm tra {{ zcfg.file }} trên deployment node"
  ansible.builtin.stat:
    path: "{{ _zcfg_deploy_path }}"
  register: _zcfg_deploy_stat
  delegate_to: localhost
  become: false

- name: "Đọc {{ zcfg.file }} hiện có trên deployment node"
  ansible.builtin.slurp:
    src: "{{ _zcfg_deploy_path }}"
  register: _zcfg_deploy_content
  delegate_to: localhost
  become: false
  no_log: "{{ zcfg.secret | default(false) }}"
  when: _zcfg_deploy_stat.stat.isreg | default(false)

- name: "Xác định quyền quản lý {{ zcfg.file }}"
  ansible.builtin.set_fact:
    _zcfg_ansible_managed: >-
      {{ not (_zcfg_deploy_stat.stat.isreg | default(false)) or
         ('icinga-ansible:generated' in
          (_zcfg_deploy_content.content | default('') | b64decode)) }}

- name: "Render {{ zcfg.file }} do Ansible quản lý lên deployment node"
  ansible.builtin.copy:
    dest: "{{ _zcfg_deploy_path }}"
    mode: "{{ '0600' if (zcfg.secret | default(false)) else '0640' }}"
    content: |-
      // icinga-ansible:generated
      {{ lookup('ansible.builtin.template', zcfg.template) }}
  delegate_to: localhost
  become: false
  no_log: "{{ zcfg.secret | default(false) }}"
  when: _zcfg_ansible_managed | bool

- name: "Thông báo giữ file {{ zcfg.file }} do operator quản lý"
  ansible.builtin.debug:
    msg: >-
      Giữ nguyên {{ _zcfg_deploy_path }} vì file không có marker
      icinga-ansible:generated; file này là nguồn cấu hình do operator quản lý.
  when:
    - not (_zcfg_ansible_managed | bool)
    - not (zcfg.secret | default(false) | bool)

- name: "Đẩy {{ zcfg.file }} từ deployment node xuống zones.d/{{ zcfg.zone }}"
  ansible.builtin.copy:
    src: "{{ _zcfg_deploy_path }}"
    dest: "{{ _zcfg_node_path }}"
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0640"
  no_log: "{{ zcfg.secret | default(false) }}"
  notify: Reload icinga2
