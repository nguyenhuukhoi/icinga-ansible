---
# Include dùng lại cho từng zone satellite (design.md mục 9.4), CHỈ chạy trên ca_host.
# Tham số: sat_zone (1 phần tử của satellite_zones, có .name).
#
# 2026-10-18: file này giờ đi qua DEPLOYMENT NODE trước, giống mọi config theo zone khác — xem
# sync_zone_extra_conf.yml. Tool KHÔNG sinh nội dung monitoring; file .conf là của operator.
# "override" bây giờ chính là sửa thẳng file tại deploy_config_dir rồi xoá dòng marker.
#
# Thư mục đích trên node đích vẫn phải là .../zones.d/{{ sat_zone.name }}/hosts.conf (Icinga2 tự quét
# zones.d/ khi feature "api" bật — path này không tự chọn được), và vẫn ghi vào cây icinga_etc_dir để
# mount được RO per-file vào container.

- name: "Tạo thư mục zones.d/{{ sat_zone.name }} (deploy tree)"
  ansible.builtin.file:
    path: "{{ icinga_etc_dir }}/icinga2/zones.d/{{ sat_zone.name }}"
    state: directory
    owner: "{{ ic_uid }}"
    group: "{{ ic_uid }}"
    mode: "0750"

# Zone satellite cũng nhận được file .conf tuỳ ý, giống master zone.
- name: "Đồng bộ file .conf của operator trong zones.d/{{ sat_zone.name }}"
  ansible.builtin.include_tasks: sync_zone_extra_conf.yml
  vars:
    zx_zone: "{{ sat_zone.name }}"
