---
# Container icinga2 KHÔNG tự đọc lại config khi file thay đổi trên host (bind-mount, không có
# inotify reload built-in trong entrypoint) -> phải chủ động restart khi zones.conf/constants.conf/
# feature config đổi, nếu không daemon chạy tiếp với config CŨ vô thời hạn (bug thật đã gặp: thêm
# satellite vào zones.conf nhưng icinga2 trên master không reload, API không thấy endpoint mới).
- name: Reload icinga2
  ansible.builtin.command: docker restart icinga2
  changed_when: true
  when:
    - _icinga2_container is defined
    - not (_icinga2_container.changed | default(false))

- name: Chờ icinga2 healthy sau reload
  community.docker.docker_container_info:
    name: icinga2
  register: _icinga2_reload_health
  until:
    - _icinga2_reload_health.exists | default(false)
    - (_icinga2_reload_health.container.State.Health.Status | default('starting')) == 'healthy'
  retries: 24
  delay: 5
  listen: Reload icinga2
  when:
    - _icinga2_container is defined
    - not (_icinga2_container.changed | default(false))
