---
- name: Bỏ qua phase3 khi chỉ backup (phòng trường hợp play vẫn chạy)
  ansible.builtin.meta: end_play
  when: icinga_action == 'backup'

# PHASE 3/3 — chạy ở PLAY RIÊNG, SAU KHI Phase 2 đã hoàn tất TOÀN BỘ (mọi node join đã
# wsrep_local_state_comment=Synced). Lúc này cụm đã là 3 THÀNH VIÊN ĐỘC LẬP thật — node đầu restart
# 1 mình để bỏ cờ --wsrep-new-cluster không còn mất quorum (2 node kia vẫn giữ đa số/Primary trong
# lúc nó restart), an toàn để rejoin qua IST. Đây chính là thứ tự kolla-ansible dùng
# ("Restart bootstrap mariadb service" luôn là PLAY CUỐI CÙNG, sau "Start mariadb services").

- name: (cluster) Bỏ cờ --wsrep-new-cluster khỏi node đầu (chỉ khi Phase 1 vừa fresh-bootstrap nó)
  ansible.builtin.include_tasks: _start_container.yml
  vars:
    mariadb_container_command: "mariadbd"
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
    - not hostvars[mariadb_bootstrap_host].mariadb_grastate.stat.exists

- name: (cluster) Chờ node đầu SELECT 1 được lại sau khi bỏ cờ
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: mariadb_bootstrap_ping2
  retries: 24
  delay: 5
  until: mariadb_bootstrap_ping2.rc == 0
  changed_when: false
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
    - not hostvars[mariadb_bootstrap_host].mariadb_grastate.stat.exists

- name: (cluster) Chờ node đầu wsrep_local_state_comment=Synced lại sau khi bỏ cờ
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot
    -N -e "SHOW STATUS LIKE 'wsrep_local_state_comment'"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: mariadb_bootstrap_synced2
  retries: 24
  delay: 5
  until: >-
    mariadb_bootstrap_synced2.rc == 0 and
    'Synced' in (mariadb_bootstrap_synced2.stdout | default(''))
  changed_when: false
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
    - not hostvars[mariadb_bootstrap_host].mariadb_grastate.stat.exists

- name: (cluster) Đọc wsrep_cluster_size + wsrep_ready thật (xác nhận cluster form đúng)
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot
    -N -e "SHOW STATUS LIKE 'wsrep_%';"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: wsrep_status
  changed_when: false
  no_log: true
  when: mariadb_cluster_mode | bool

- name: (cluster) In cảnh báo nếu wsrep_cluster_size khác số node khai báo trong [galera]
  ansible.builtin.debug:
    msg: >-
      wsrep_cluster_size thật trên {{ inventory_hostname }} =
      {{ (wsrep_status.stdout_lines | select('search', 'wsrep_cluster_size') | list | first | default('')).split()[-1] | default('?') }}
      (kỳ vọng {{ galera_count }}).
  when: mariadb_cluster_mode | bool

# ---------- Tạo database + user + grant (1 LẦN trên node bootstrap — Galera tự replicate DDL) ----------
# Đặt cuối Phase 3 (không phải ngay sau khi node đầu sống) — đợi CẢ CỤM ổn định hẳn (kể cả bước bỏ
# cờ) mới ghi dữ liệu, tránh ghi DDL vào lúc cụm còn đang tái cấu hình.
- name: Xây danh sách database/service do stack quản lý
  ansible.builtin.set_fact:
    _managed_db_services: >-
      {{ [
           {'name': 'icingadb', 'database': 'icingadb', 'password': icingadb_db_password},
           {'name': 'icingaweb2', 'database': 'icingaweb2', 'password': icingaweb2_db_password}
         ] + ([{'name': 'director', 'database': 'director', 'password': director_db_password}]
              if 'director' in (enable_icingaweb2_modules | default([])) else []) }}
  no_log: true
  when: inventory_hostname == mariadb_bootstrap_host

- name: "Ping lại root trước khi check credential (tránh nhầm transient blip thành 'sai credential' — xem BUG THẬT bên dưới)"
  # BUG THẬT đã gặp (đọc trước khi xoá task này): task check credential/grant ngay sau đây trước kia
  # không có bước đệm nào — 1 lỗi kết nối THOÁNG QUA đúng lúc DB vừa Synced (vd server.cnf vừa đổi ở
  # phase1 khiến mariadb container vẫn còn đang khởi động lại) bị hiểu nhầm là "credential sai", kéo
  # theo task dừng consumer DB lúc đó tắt icingadb/icingaweb2 trên MỌI master —
  # 1 outage hoàn toàn tránh được. Fix: retry ping ngắn bằng root trước, đảm bảo DB thật sự ổn định
  # (không chỉ Synced — Synced ở trên đo lúc join, có thể đã trôi qua vài giây/handler khác xen vào)
  # trước khi tin kết quả check credential ngay sau.
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -h127.0.0.1 -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: _managed_db_preflight_ping
  retries: 6
  delay: 5
  until: _managed_db_preflight_ping.rc == 0
  changed_when: false
  no_log: true
  when: inventory_hostname == mariadb_bootstrap_host

- name: Kiểm tra credential và grant hiện tại của từng service DB
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - MYSQL_PWD
      - mariadb
      - mariadb
      - -h127.0.0.1
      - "-u{{ item.name }}"
      - -N
      - "{{ item.database }}"
      - -e
      - "SHOW GRANTS FOR CURRENT_USER;"
  environment:
    MYSQL_PWD: "{{ item.password }}"
  loop: "{{ _managed_db_services | default([]) }}"
  register: _managed_db_auth_checks
  changed_when: false
  failed_when: false
  no_log: true
  when: inventory_hostname == mariadb_bootstrap_host

- name: Xác định consumer cần dừng trước khi reconcile credential DB
  ansible.builtin.set_fact:
    _db_consumers_to_stop: >-
      {%- set ns = namespace(containers=[]) -%}
      {%- set consumer_map = {
            'icingadb': ['icingadb'],
            'icingaweb2': ['icingaweb2'],
            'director': ['icingaweb2-director-daemon']
          } -%}
      {%- for result in (_managed_db_auth_checks.results | default([])) -%}
        {%- if result.rc != 0 or
              ('ON `' ~ result.item.database ~ '`.*' not in (result.stdout | default(''))) -%}
          {%- for container in (consumer_map[result.item.name] | default([])) -%}
            {%- if container not in ns.containers -%}
              {%- set ns.containers = ns.containers + [container] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.containers }}
  when: inventory_hostname == mariadb_bootstrap_host

- name: Dừng đúng consumer DB trước khi reconcile credential
  ansible.builtin.command:
    argv: "{{ ['docker', 'stop'] + _db_consumers_to_stop }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['master'] }}"
  register: _db_consumers_stopped_for_rotation
  changed_when: _db_consumers_stopped_for_rotation.stdout | trim | length > 0
  failed_when: false
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - _db_consumers_to_stop | default([]) | length > 0

- name: Tạo/sửa database, credential và grant khi trạng thái chưa đúng
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - MYSQL_PWD
      - mariadb
      - mariadb
      - "-uroot"
      - -e
      - >-
        CREATE DATABASE IF NOT EXISTS `{{ item.item.database }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
        CREATE USER IF NOT EXISTS '{{ item.item.name }}'@'%';
        SET @icinga_password = CONVERT(FROM_BASE64('{{ item.item.password | b64encode }}') USING utf8mb4);
        SET @icinga_alter_user = CONCAT(
          'ALTER USER ''{{ item.item.name }}''@''%'' IDENTIFIED BY ',
          QUOTE(@icinga_password)
        );
        PREPARE icinga_alter_user_stmt FROM @icinga_alter_user;
        EXECUTE icinga_alter_user_stmt;
        DEALLOCATE PREPARE icinga_alter_user_stmt;
        SET @icinga_password = NULL;
        GRANT ALL ON `{{ item.item.database }}`.* TO '{{ item.item.name }}'@'%';
        FLUSH PRIVILEGES;
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  loop: "{{ _managed_db_auth_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - >-
      item.rc != 0 or
      ('ON `' ~ item.item.database ~ '`.*' not in (item.stdout | default('')))
  no_log: true

# Backup định kỳ chạy ngay trên galera[0], nơi có datadir và Docker socket. Dùng
# cron vì globals.yml đã dùng cú pháp cron 5 trường; flock trong script ngăn hai
# lượt chồng nhau. Artifact chỉ được đổi tên/cập nhật con trỏ sau khi giải nén
# toàn bộ stream thành công.
- name: Kiểm tra cấu hình lịch backup MariaDB
  ansible.builtin.assert:
    that:
      - mariadb_backup.schedule is string
      - mariadb_backup.schedule.split() | length == 5
      - "'\n' not in mariadb_backup.schedule"
      - mariadb_backup.retention_days | int >= 1
    fail_msg: "mariadb_backup.schedule phải là cron 5 trường và retention_days phải >= 1."
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - mariadb_backup.enabled | bool

- name: Tạo thư mục đích cho backup định kỳ
  ansible.builtin.file:
    path: "{{ mariadb_backup.destination }}"
    state: directory
    mode: "0700"
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - mariadb_backup.enabled | bool

- name: Cài script backup MariaDB định kỳ
  ansible.builtin.template:
    src: scheduled-backup.sh.j2
    dest: /usr/local/sbin/icinga-mariadb-backup
    owner: root
    group: root
    mode: "0700"
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - mariadb_backup.enabled | bool

- name: Cài lịch backup MariaDB
  ansible.builtin.cron:
    name: icinga-ansible MariaDB backup
    user: root
    minute: "{{ mariadb_backup.schedule.split()[0] }}"
    hour: "{{ mariadb_backup.schedule.split()[1] }}"
    day: "{{ mariadb_backup.schedule.split()[2] }}"
    month: "{{ mariadb_backup.schedule.split()[3] }}"
    weekday: "{{ mariadb_backup.schedule.split()[4] }}"
    job: /usr/local/sbin/icinga-mariadb-backup
    state: present
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - mariadb_backup.enabled | bool

- name: Gỡ lịch và script backup định kỳ khi đã tắt
  block:
    - name: Gỡ cron backup MariaDB
      ansible.builtin.cron:
        name: icinga-ansible MariaDB backup
        user: root
        state: absent

    - name: Gỡ script backup MariaDB
      ansible.builtin.file:
        path: /usr/local/sbin/icinga-mariadb-backup
        state: absent
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - not (mariadb_backup.enabled | bool)
