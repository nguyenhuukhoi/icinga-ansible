---
# Role mariadb: MariaDB standalone (galera_count==1) HOẶC Galera cluster THẬT (galera_count lẻ >=3).
# Config render override-aware (deploy node -> target node, giống kolla — design.md mục 4.1):
#   {{ deploy_config_dir }}/mariadb/<host>/server.cnf > {{ deploy_config_dir }}/mariadb/group_<nhóm>/server.cnf
#   > {{ deploy_config_dir }}/mariadb/server.cnf > template mặc định — kết quả luôn ghi ra
#   {{ icinga_etc_dir }}/mariadb/server.cnf (target node).
# Backup (icinga_action=backup) dùng mariadb-backup qua docker exec.
#
# QUAN TRỌNG: role này (kể cả toàn bộ cơ chế override, gồm cả tầng "theo nhóm" ở dưới) CHỈ CHẠY khi
# icinga_database_type=managed_db — play "Deploy MariaDB / Galera" trong icinga-ansible.yml gate hẳn
# `when: icinga_database_type == 'managed_db'` (theo yêu cầu người dùng 2026-07-23, xác nhận lại rõ
# ràng trong comment vì dễ nhầm khi đọc lướt). Với `external`, DB do DBA quản lý ngoài phạm vi
# Ansible — không có "nhóm" nào để override cả, vì không có host nào trong [galera] chạy role này.

- name: (backup) Chạy mariadb-backup (kèm snapshot CA/PKI) rồi thoát
  ansible.builtin.include_tasks: backup.yml
  when: icinga_action == 'backup'

- name: Bỏ qua phần deploy khi chỉ backup
  ansible.builtin.meta: end_play
  when: icinga_action == 'backup'

# ---------- Xác định mode + đường dẫn ----------
- name: Xác định mode MariaDB (standalone hay Galera cluster)
  ansible.builtin.set_fact:
    mariadb_cluster_mode: "{{ (galera_count | int) >= 3 and (galera_count | int) % 2 == 1 }}"
    mariadb_bootstrap_host: "{{ groups['galera'][0] }}"
    mariadb_etc: "{{ icinga_etc_dir }}/mariadb"
    mariadb_data: "{{ icinga_base_dir }}/mariadb/data"

- name: Tạo thư mục config trên target node
  ansible.builtin.file:
    path: "{{ mariadb_etc }}"
    state: directory
    mode: "0750"

# ---------- Render server.cnf (override-aware) ----------
# Tầng "theo nhóm" (2026-07-23) — chèn GIỮA per-host và global, xem giải thích đầy đủ ở
# roles/icinga2/tasks/render_config_item.yml (cùng cơ chế, áp dụng lại y hệt ở đây).
- name: Xác định nguồn config server.cnf (override per-host > per-group > per-service > template)
  ansible.builtin.set_fact:
    _mariadb_cfg_src: >-
      {{ (q('first_found', dict(
            files=[deploy_config_dir + '/mariadb/' + inventory_hostname + '/server.cnf']
                  + (group_names | reject('in', ['all', 'ungrouped', 'all_hosts'])
                                  | map('regex_replace', '^(.*)$', deploy_config_dir + '/mariadb/group_\1/server.cnf')
                                  | list)
                  + [deploy_config_dir + '/mariadb/server.cnf'],
            skip=true)) | first) | default('', true) }}

- name: Copy override server.cnf (nếu có)
  ansible.builtin.copy:
    src: "{{ _mariadb_cfg_src }}"
    dest: "{{ mariadb_etc }}/server.cnf"
    mode: "0644"
  when: _mariadb_cfg_src | length > 0
  no_log: true
  notify: Reload mariadb

- name: Render template mặc định server.cnf (không có override)
  ansible.builtin.template:
    src: server.cnf.j2
    dest: "{{ mariadb_etc }}/server.cnf"
    mode: "0644"
  when: _mariadb_cfg_src | length == 0
  no_log: true
  notify: Reload mariadb

# ---------- STANDALONE (galera_count == 1, P1 — đã verify) ----------
- name: (standalone) Khởi động container MariaDB
  ansible.builtin.include_tasks: _start_container.yml
  vars:
    mariadb_container_command: "mariadbd"
  when:
    - not (mariadb_cluster_mode | bool)
    - inventory_hostname == mariadb_bootstrap_host

# ---------- GALERA CLUSTER (lẻ >=3) — logic bootstrap/join dùng chung, xem _bootstrap_and_join.yml ----------
- name: (cluster) Bootstrap node đầu + các node còn lại join
  ansible.builtin.include_tasks: _bootstrap_and_join.yml
  when: mariadb_cluster_mode | bool

# ---------- Chờ MariaDB sẵn sàng trên chính node mình (chỉ nhánh standalone — cluster đã chờ ở trên) ----------
- name: Chờ MariaDB sẵn sàng (standalone)
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: db_ping
  retries: 24
  delay: 5
  until: db_ping.rc == 0
  changed_when: false
  no_log: true
  when:
    - not (mariadb_cluster_mode | bool)
    - inventory_hostname == mariadb_bootstrap_host

# ---------- Tạo database + user + grant (1 LẦN trên node bootstrap — Galera tự replicate DDL) ----------
- name: Xây danh sách database/service do stack quản lý
  ansible.builtin.set_fact:
    _managed_db_services: >-
      {{ [
           {'name': 'icingadb', 'database': 'icingadb', 'password': icingadb_db_password},
           {'name': 'icingaweb2', 'database': 'icingaweb2', 'password': icingaweb2_db_password}
         ] + ([{'name': 'director', 'database': 'director', 'password': director_db_password}]
              if 'director' in (enable_icingaweb2_modules | default([])) else []) }}
  no_log: true
  when: inventory_hostname == mariadb_bootstrap_host

- name: "Ping lại root trước khi check credential (tránh nhầm transient blip thành 'sai credential')"
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -h127.0.0.1 -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: _managed_db_preflight_ping
  retries: 6
  delay: 5
  until: _managed_db_preflight_ping.rc == 0
  changed_when: false
  no_log: true
  when: inventory_hostname == mariadb_bootstrap_host

- name: Kiểm tra credential và grant hiện tại của từng service DB
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - MYSQL_PWD
      - mariadb
      - mariadb
      - -h127.0.0.1
      - "-u{{ item.name }}"
      - -N
      - "{{ item.database }}"
      - -e
      - "SHOW GRANTS FOR CURRENT_USER;"
  environment:
    MYSQL_PWD: "{{ item.password }}"
  loop: "{{ _managed_db_services | default([]) }}"
  register: _managed_db_auth_checks
  changed_when: false
  failed_when: false
  no_log: true
  when: inventory_hostname == mariadb_bootstrap_host

# Chỉ dừng consumer thực sự dùng credential đang được reconcile. Trước đây chỉ cần
# DB Director chưa tồn tại khi bật module lần đầu là task dừng cả icingadb và
# icingaweb2 trên mọi master, gây outage không liên quan. Web sẽ tự recreate ở role
# icingaweb2 khi cấu hình/mount Director thay đổi; Director daemon (nếu đã tồn tại)
# mới là process cần dừng trước khi rotate credential Director.
- name: Xác định consumer cần dừng trước khi reconcile credential DB
  ansible.builtin.set_fact:
    _db_consumers_to_stop: >-
      {%- set ns = namespace(containers=[]) -%}
      {%- set consumer_map = {
            'icingadb': ['icingadb'],
            'icingaweb2': ['icingaweb2'],
            'director': ['icingaweb2-director-daemon']
          } -%}
      {%- for result in (_managed_db_auth_checks.results | default([])) -%}
        {%- if result.rc != 0 or
              ('ON `' ~ result.item.database ~ '`.*' not in (result.stdout | default(''))) -%}
          {%- for container in (consumer_map[result.item.name] | default([])) -%}
            {%- if container not in ns.containers -%}
              {%- set ns.containers = ns.containers + [container] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.containers }}
  when: inventory_hostname == mariadb_bootstrap_host

- name: Dừng đúng consumer DB trước khi reconcile credential
  ansible.builtin.command:
    argv: "{{ ['docker', 'stop'] + _db_consumers_to_stop }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['master'] }}"
  register: _db_consumers_stopped_for_rotation
  changed_when: _db_consumers_stopped_for_rotation.stdout | trim | length > 0
  failed_when: false
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - _db_consumers_to_stop | default([]) | length > 0

- name: Tạo/sửa database, credential và grant khi trạng thái chưa đúng
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - MYSQL_PWD
      - mariadb
      - mariadb
      - "-uroot"
      - -e
      - >-
        CREATE DATABASE IF NOT EXISTS `{{ item.item.database }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
        CREATE USER IF NOT EXISTS '{{ item.item.name }}'@'%';
        SET @icinga_password = CONVERT(FROM_BASE64('{{ item.item.password | b64encode }}') USING utf8mb4);
        SET @icinga_alter_user = CONCAT(
          'ALTER USER ''{{ item.item.name }}''@''%'' IDENTIFIED BY ',
          QUOTE(@icinga_password)
        );
        PREPARE icinga_alter_user_stmt FROM @icinga_alter_user;
        EXECUTE icinga_alter_user_stmt;
        DEALLOCATE PREPARE icinga_alter_user_stmt;
        SET @icinga_password = NULL;
        GRANT ALL ON `{{ item.item.database }}`.* TO '{{ item.item.name }}'@'%';
        FLUSH PRIVILEGES;
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  loop: "{{ _managed_db_auth_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - inventory_hostname == mariadb_bootstrap_host
    - >-
      item.rc != 0 or
      ('ON `' ~ item.item.database ~ '`.*' not in (item.stdout | default('')))
  no_log: true

# =============================================================================
# Recovery (restore từ backup / cứu cụm chết không cần backup): xem restore.yml, recover-cluster.yml
# và playbook riêng ansible/playbooks/mariadb-recovery.yml (`icinga-ansible mariadb-recovery`).
# =============================================================================
