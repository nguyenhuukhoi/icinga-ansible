---
# The site playbook deploys managed MariaDB through phase1/phase2/phase3.  The
# role entry point is intentionally limited to the explicit backup action so a
# direct include_role cannot accidentally run the obsolete all-in-one deploy
# path.
- name: Chỉ cho phép gọi role mariadb trực tiếp cho tác vụ backup
  ansible.builtin.assert:
    that: (icinga_action | default('')) == 'backup'
    fail_msg: >-
      Không gọi trực tiếp role mariadb để deploy. Dùng ansible/icinga-ansible.yml;
      role entry point này chỉ phục vụ icinga_action=backup.

- name: Chạy mariadb-backup kèm snapshot CA/PKI
  ansible.builtin.include_tasks: backup.yml
