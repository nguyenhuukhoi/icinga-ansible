---
# PHASE 1/3 của "deploy MariaDB/Galera" (2026-09, học theo kolla-ansible ansible/mariadb.yml —
# comment đầu file đó: "we need to be careful about restarting services, to avoid losing quorum").
#
# Lý do tách 3 PLAY riêng (không phải 3 task trong 1 play): "_bootstrap_and_join.yml" bản cũ tuy đã
# viết ĐÚNG THỨ TỰ logic (bootstrap -> join -> bỏ cờ), nhưng toàn bộ nằm trong 1 chuỗi
# "include_tasks" (dynamic) bên trong 1 play "hosts: galera" DUY NHẤT. include_tasks là dynamic —
# Ansible KHÔNG đảm bảo lockstep cứng giữa các host qua include dynamic giống hệt như giữa các PLAY
# riêng (đây là khác biệt hành vi đã biết của Ansible, không phải bug của riêng role này) — vẫn còn
# khe hở lý thuyết để node bootstrap và node join chồng lấn thời gian phục hồi/restart nếu timing
# xấu (đã từng thấy NON-PRIMARY dù code "đúng thứ tự" — xem MONITORING-STACK-2026-09-12.md mục 4b).
# kolla-ansible tránh hẳn việc này bằng ranh giới PLAY CỨNG (play sau chỉ bắt đầu khi TOÀN BỘ host
# của play trước, kể cả handler, đã xong) — copy đúng kiểu tách play đó ở đây.
#
# PHASE 1 làm: render config (mọi node) + bootstrap RIÊNG node đầu [galera] + chờ nó Synced hẳn.
# KHÔNG đụng gì tới node còn lại trong phase này.

- name: (backup) Chạy mariadb-backup (kèm snapshot CA/PKI) rồi thoát
  ansible.builtin.include_tasks: backup.yml
  when: icinga_action == 'backup'

- name: Bỏ qua phần deploy khi chỉ backup
  ansible.builtin.meta: end_play
  when: icinga_action == 'backup'

- name: Xác định mode MariaDB (standalone hay Galera cluster)
  ansible.builtin.set_fact:
    mariadb_cluster_mode: "{{ (galera_count | int) >= 3 and (galera_count | int) % 2 == 1 }}"
    mariadb_bootstrap_host: "{{ groups['galera'][0] }}"
    mariadb_etc: "{{ icinga_etc_dir }}/mariadb"
    mariadb_data: "{{ icinga_base_dir }}/mariadb/data"

- name: Tạo thư mục config trên target node
  ansible.builtin.file:
    path: "{{ mariadb_etc }}"
    state: directory
    mode: "0750"

- name: Xác định nguồn config server.cnf (override per-host > per-group > per-service > template)
  ansible.builtin.set_fact:
    _mariadb_cfg_src: >-
      {{ (q('first_found', dict(
            files=[deploy_config_dir + '/mariadb/' + inventory_hostname + '/server.cnf']
                  + (group_names | reject('in', ['all', 'ungrouped', 'all_hosts'])
                                  | map('regex_replace', '^(.*)$', deploy_config_dir + '/mariadb/group_\1/server.cnf')
                                  | list)
                  + [deploy_config_dir + '/mariadb/server.cnf'],
            skip=true)) | first) | default('', true) }}

- name: Copy override server.cnf (nếu có)
  ansible.builtin.copy:
    src: "{{ _mariadb_cfg_src }}"
    dest: "{{ mariadb_etc }}/server.cnf"
    mode: "0644"
  when: _mariadb_cfg_src | length > 0
  no_log: true
  notify: Reload mariadb

- name: Render template mặc định server.cnf (không có override)
  ansible.builtin.template:
    src: server.cnf.j2
    dest: "{{ mariadb_etc }}/server.cnf"
    mode: "0644"
  when: _mariadb_cfg_src | length == 0
  no_log: true
  notify: Reload mariadb

# ---------- STANDALONE (galera_count == 1) — không cần 3-phase, xong luôn trong Phase 1 ----------
- name: (standalone) Khởi động container MariaDB
  ansible.builtin.include_tasks: _start_container.yml
  vars:
    mariadb_container_command: "mariadbd"
  when:
    - not (mariadb_cluster_mode | bool)
    - inventory_hostname == mariadb_bootstrap_host

- name: Chờ MariaDB sẵn sàng (standalone)
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: db_ping
  retries: 24
  delay: 5
  until: db_ping.rc == 0
  changed_when: false
  no_log: true
  when:
    - not (mariadb_cluster_mode | bool)
    - inventory_hostname == mariadb_bootstrap_host

# ---------- CLUSTER — CHỈ bootstrap node đầu, KHÔNG đụng node còn lại ----------
- name: (cluster) Kiểm tra node đầu đã từng bootstrap/join chưa (grastate.dat tồn tại)
  ansible.builtin.stat:
    path: "{{ mariadb_data }}/grastate.dat"
  register: mariadb_grastate
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host

- name: (cluster) Ping nhanh mọi node để biết cụm còn primary component đang sống không
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: mariadb_cluster_liveness
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: "{{ item }}"
  loop: "{{ groups['galera'] }}"
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host

- name: "(cluster) FAIL FAST nếu cụm 'đã formed' (có grastate.dat) nhưng node đầu không phản hồi và KHÔNG node nào khác trong [galera] đang sống"
  ansible.builtin.fail:
    msg: >-
      MariaDB Galera cluster [galera] có dữ liệu cũ (grastate.dat tồn tại trên
      {{ mariadb_bootstrap_host }}) nhưng không node nào phản hồi được — cụm đã CHẾT, không thể tự
      "join" lại bình thường (sẽ treo vô thời hạn ở NON_PRIM chờ peer không tồn tại). Chạy:
      icinga-ansible mariadb-recovery -i <inventory> -e recovery_mode=recover-cluster -e confirm=yes
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
    - mariadb_grastate.stat.exists
    - (mariadb_cluster_liveness.results | default([]) | selectattr('rc', 'equalto', 0) | list | length) == 0

- name: (cluster) Node đầu bootstrap (--wsrep-new-cluster) — CHỈ khi cần fresh
  ansible.builtin.include_tasks: _start_container.yml
  vars:
    mariadb_container_command: "--wsrep-new-cluster"
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
    - not mariadb_grastate.stat.exists

- name: (cluster) Node đầu chạy lại bình thường (cụm đã formed từ trước)
  ansible.builtin.include_tasks: _start_container.yml
  vars:
    mariadb_container_command: "mariadbd"
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
    - mariadb_grastate.stat.exists

# Giống kolla-ansible handler "Wait for first MariaDB service to sync WSREP" — chờ tới khi
# wsrep_local_state_comment=Synced thật (không chỉ SELECT 1 trả lời được), đúng cứng cựa hơn bản cũ.
- name: (cluster) Chờ node đầu SELECT 1 được (mariadbd đã khởi động xong)
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: mariadb_bootstrap_ping
  retries: 24
  delay: 5
  until: mariadb_bootstrap_ping.rc == 0
  changed_when: false
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host

- name: (cluster) Chờ node đầu wsrep_local_state_comment=Synced (không chỉ "sống", phải THẬT SỰ ready)
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot
    -N -e "SHOW STATUS LIKE 'wsrep_local_state_comment'"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: mariadb_bootstrap_synced
  retries: 24
  delay: 5
  until: >-
    mariadb_bootstrap_synced.rc == 0 and
    'Synced' in (mariadb_bootstrap_synced.stdout | default(''))
  changed_when: false
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname == mariadb_bootstrap_host
