---
# Cứu cụm Galera chết (mọi node dừng/crash) mà KHÔNG cần backup — dữ liệu vẫn còn nguyên trên đĩa
# (design.md mục 10.4 "Recover cụm chết"). Tự động hoá đúng quy trình đã làm TAY thành công trong lúc
# verify Galera cluster thật (2026-07-21): dừng hết -> chạy wsrep-recover trên mọi node -> chọn node
# có recovered seqno cao nhất -> bootstrap đúng node đó ->
# các node còn lại join lại (IST, không mất data vì datadir vẫn còn).
#
# Gọi qua: ansible/playbooks/mariadb-recovery.yml -e recovery_mode=recover-cluster -e confirm=yes
# KHÔNG xoá dữ liệu (khác hẳn restore.yml) — nhưng vẫn confirm-gated vì dừng/khởi động lại container
# đang chạy có thể gây gián đoạn.

- name: Chặn nếu chưa xác nhận
  ansible.builtin.fail:
    msg: >-
      recover-cluster sẽ dừng + khởi động lại container mariadb trên MỌI node [galera] để cứu cụm chết.
      Chạy lại kèm xác nhận: icinga-ansible mariadb-recovery -e recovery_mode=recover-cluster -e confirm=yes
  # So sánh chuỗi CHÍNH XÁC "yes" — xem giải thích ở restore.yml (cùng bug class với remove-master.yml).
  when: (confirm | default('')) != 'yes'
  run_once: true

- name: Xác định đường dẫn MariaDB
  ansible.builtin.set_fact:
    mariadb_etc: "{{ icinga_etc_dir }}/mariadb"
    mariadb_data: "{{ icinga_base_dir }}/mariadb/data"

- name: Dừng container mariadb (mọi node galera, nếu còn chạy)
  community.docker.docker_container:
    name: mariadb
    state: stopped

- name: Kiểm tra grastate.dat tồn tại trên từng node (trước khi đọc)
  ansible.builtin.stat:
    path: "{{ mariadb_data }}/grastate.dat"
  register: _grastate_stat

- name: "Chặn rõ ràng nếu node chưa từng bootstrap/join (không có grastate.dat) — không phải 1 phần của cụm cần cứu"
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} không có {{ mariadb_data }}/grastate.dat — node này chưa từng
      bootstrap/join lần nào (không phải thành viên cụm Galera đã formed). Gỡ host này khỏi
      [galera] trước khi chạy recover-cluster, hoặc xác nhận đây đúng là node cần recover trước
      khi tiếp tục.
  when: not _grastate_stat.stat.exists

- name: Chạy wsrep-recover trên từng datadir để lấy transaction position thật
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --user
      - mysql
      - --network
      - "{{ docker_network_name }}"
      - -v
      - "{{ mariadb_data }}:/var/lib/mysql:rw"
      - -v
      - "{{ mariadb_etc }}:/etc/mysql/conf.d:rw"
      - "{{ images.mariadb }}"
      - mariadbd
      - --wsrep-recover
      - --datadir=/var/lib/mysql
  register: _wsrep_recover
  changed_when: false
  failed_when: >-
    'Recovered position:' not in
    ((_wsrep_recover.stdout | default('')) ~ '\n' ~ (_wsrep_recover.stderr | default('')))

- name: Parse UUID và seqno do wsrep-recover trả về
  ansible.builtin.set_fact:
    _wsrep_recovered_position: >-
      {{ (((_wsrep_recover.stdout | default('')) ~ '\n' ~ (_wsrep_recover.stderr | default('')))
          | regex_findall('Recovered position: *([0-9a-fA-F-]+:[-0-9]+)') | first) }}

- name: Tách recovered UUID và seqno trên từng node
  ansible.builtin.set_fact:
    _wsrep_recovered_uuid: "{{ _wsrep_recovered_position.split(':')[0] }}"
    _wsrep_recovered_seqno: "{{ _wsrep_recovered_position.split(':')[1] | int }}"

- name: Chọn history UUID chiếm đa số (chịu được một lần recovery bị gián đoạn)
  ansible.builtin.set_fact:
    _wsrep_majority_uuid: >-
      {%- set uuids = groups['galera'] | map('extract', hostvars, '_wsrep_recovered_uuid') | list -%}
      {%- set ns = namespace(uuid='', count=0) -%}
      {%- for candidate in uuids | unique -%}
        {%- set candidate_count = uuids | select('equalto', candidate) | list | length -%}
        {%- if candidate_count > ns.count -%}
          {%- set ns.uuid = candidate -%}
          {%- set ns.count = candidate_count -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.uuid }}
    _wsrep_majority_count: >-
      {%- set uuids = groups['galera'] | map('extract', hostvars, '_wsrep_recovered_uuid') | list -%}
      {%- set ns = namespace(count=0) -%}
      {%- for candidate in uuids | unique -%}
        {%- set candidate_count = uuids | select('equalto', candidate) | list | length -%}
        {%- if candidate_count > ns.count -%}{%- set ns.count = candidate_count -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.count }}
  run_once: true

- name: Chặn bootstrap nếu không có history chiếm đa số hoặc seqno không hợp lệ
  ansible.builtin.assert:
    that:
      - _wsrep_majority_count | int > ((galera_count | int) // 2)
      - (groups['galera'] | map('extract', hostvars, '_wsrep_recovered_seqno') | map('int') | min) >= 0
    fail_msg: >-
      Không thể tự động chọn node bootstrap an toàn: cần một recovered UUID xuất hiện trên đa số
      tuyệt đối node và mọi seqno phải >= 0. Dừng nguyên trạng để operator kiểm tra; không ghi
      grastate.dat và không khởi động cụm.
  run_once: true

- name: In transaction position từng node
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: recovered={{ _wsrep_recovered_position }}"

# Luôn dựa trên wsrep-recover thay vì seqno trong grastate.dat. Sau crash toàn cụm, grastate có thể
# ghi -1 trên tất cả node dù datadir chứa transaction khác nhau; chọn theo file đó có thể mất dữ liệu.
- name: Chọn node bootstrap để cứu cụm (tính 1 lần, dùng hostvars mọi node)
  ansible.builtin.set_fact:
    mariadb_bootstrap_host: >-
      {%- set majority_uuid = hostvars[groups['galera'][0]]._wsrep_majority_uuid -%}
      {%- set best = namespace(host='', seqno=-1) -%}
      {%- for h in groups['galera'] -%}
        {%- if hostvars[h]._wsrep_recovered_uuid == majority_uuid and
               (hostvars[h]._wsrep_recovered_seqno | int) > best.seqno -%}
          {%- set best.host = h -%}
          {%- set best.seqno = hostvars[h]._wsrep_recovered_seqno | int -%}
        {%- endif -%}
      {%- endfor -%}
      {{ best.host }}
  run_once: true

- name: Đồng bộ mariadb_bootstrap_host cho mọi host (run_once chỉ set trên 1 host)
  ansible.builtin.set_fact:
    mariadb_bootstrap_host: "{{ hostvars[groups['galera'][0]].mariadb_bootstrap_host }}"
  when: inventory_hostname != groups['galera'][0]

- name: In rõ node được chọn làm bootstrap (để log lại, tránh recover nhầm)
  ansible.builtin.debug:
    msg: "Chọn {{ mariadb_bootstrap_host }} làm node bootstrap cứu cụm."
  run_once: true

# Phải ghi CẢ uuid/seqno do wsrep-recover tìm được. Chỉ đổi safe_to_bootstrap trong khi grastate vẫn
# chứa seqno=-1 làm Galera tạo history UUID mới và tách dữ liệu khi bỏ cờ bootstrap.
- name: Ghi recovered UUID vào grastate.dat trên node bootstrap
  ansible.builtin.lineinfile:
    path: "{{ mariadb_data }}/grastate.dat"
    regexp: '^uuid:'
    line: "uuid: {{ _wsrep_recovered_uuid }}"
  when: inventory_hostname == mariadb_bootstrap_host

- name: Ghi recovered seqno vào grastate.dat trên node bootstrap
  ansible.builtin.lineinfile:
    path: "{{ mariadb_data }}/grastate.dat"
    regexp: '^seqno:'
    line: "seqno: {{ _wsrep_recovered_seqno }}"
  when: inventory_hostname == mariadb_bootstrap_host

- name: Chỉ đánh dấu node bootstrap là safe_to_bootstrap
  ansible.builtin.lineinfile:
    path: "{{ mariadb_data }}/grastate.dat"
    regexp: '^safe_to_bootstrap:'
    line: "safe_to_bootstrap: {{ 1 if inventory_hostname == mariadb_bootstrap_host else 0 }}"

# ---------- Bootstrap node được chọn + các node còn lại join lại (IST, không mất data) ----------
- name: Bootstrap node được chọn + các node còn lại join
  ansible.builtin.include_tasks: _bootstrap_and_join.yml
  vars:
    mariadb_force_fresh_bootstrap: true
