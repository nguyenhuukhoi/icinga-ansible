---
- name: Bỏ qua phase2 khi chỉ backup (phòng trường hợp play vẫn chạy)
  ansible.builtin.meta: end_play
  when: icinga_action == 'backup'

# PHASE 2/3 — chạy ở PLAY RIÊNG, SAU KHI Phase 1 đã hoàn tất TOÀN BỘ (kể cả handler "Reload
# mariadb") trên CẢ play trước — ranh giới play đảm bảo node đầu ([galera][0]) chắc chắn đã
# wsrep_local_state_comment=Synced (Phase 1 chờ tới lúc đó mới hết) trước khi bất kỳ node nào ở
# Phase này bắt đầu join. Không đụng gì tới node đầu ở phase này.

- name: (cluster) Node còn lại join cụm (SST/IST tự động từ node đầu)
  ansible.builtin.include_tasks: _start_container.yml
  vars:
    mariadb_container_command: "mariadbd"
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname != mariadb_bootstrap_host

- name: (cluster) Chờ node này SELECT 1 được
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: db_ping
  retries: 24
  delay: 5
  until: db_ping.rc == 0
  changed_when: false
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname != mariadb_bootstrap_host

- name: (cluster) Chờ node này wsrep_local_state_comment=Synced (SST/IST xong thật)
  ansible.builtin.command: >
    docker exec -e MYSQL_PWD mariadb mariadb -uroot
    -N -e "SHOW STATUS LIKE 'wsrep_local_state_comment'"
  environment:
    MYSQL_PWD: "{{ mariadb_root_password }}"
  register: mariadb_join_synced
  retries: 24
  delay: 5
  until: >-
    mariadb_join_synced.rc == 0 and
    'Synced' in (mariadb_join_synced.stdout | default(''))
  changed_when: false
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname != mariadb_bootstrap_host

# BUG đã gặp thật (2026-07-22, xem _bootstrap_and_join.yml bản cũ): SST xoá nguyên datadir của node
# join, kể cả .my-healthcheck.cnf đã ghi trước khi start container -> phải ghi lại SAU KHI SST xong.
- name: (cluster) Ghi lại .my-healthcheck.cnf trong container (sống sót SST — cho healthcheck.sh)
  ansible.builtin.shell: |
    docker exec -i mariadb bash -c 'umask 077; cat > /var/lib/mysql/.my-healthcheck.cnf' <<'HCEOF'
    [client]
    user = root
    password = {{ mariadb_root_password | to_json }}
    HCEOF
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
  when:
    - mariadb_cluster_mode | bool
    - inventory_hostname != mariadb_bootstrap_host
