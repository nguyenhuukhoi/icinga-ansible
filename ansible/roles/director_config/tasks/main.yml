---
# Director DB is the source of truth. Hosts and legacy direct services use the
# CLI. Service Apply Rules use the REST API because their names are not unique
# object identifiers; Director exposes the rule UUIDs through a dedicated
# serviceapplyrules endpoint.

- name: Validate Director custom variable definitions
  ansible.builtin.assert:
    that:
      - item.name | default('') is regex('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.uuid | default('') is regex('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')
      - item.type | default('') in ['string', 'number', 'bool', 'sensitive']
    fail_msg: >-
      Each director_managed_custom_variables entry requires a valid variable
      name, stable UUID and supported scalar type. Invalid entry: {{ item }}
  loop: "{{ director_managed_custom_variables | default([]) }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"

- name: Director custom variable names and UUIDs must be unique
  ansible.builtin.assert:
    that:
      - >-
        (director_managed_custom_variables | default([]) | map(attribute='name') | unique | length)
        == (director_managed_custom_variables | default([]) | length)
      - >-
        (director_managed_custom_variables | default([]) | map(attribute='uuid') | unique | length)
        == (director_managed_custom_variables | default([]) | length)
    fail_msg: Director custom variable names and UUIDs must be unique.

- name: Read configured Director custom variables
  ansible.builtin.command:
    argv: [docker, exec, icingaweb2, icingacli, director, export, customproperties]
  register: _director_custom_variables_before
  changed_when: false
  when: (director_managed_custom_variables | default([]) | length) > 0

- name: Restore missing or changed Director custom variable definitions
  ansible.builtin.command:
    argv: [docker, exec, -i, icingaweb2, icingacli, director, basket, restore]
    stdin: >-
      {{ {'CustomVariable': {
           (((_director_custom_variables_before.stdout | from_json)
             | selectattr('key_name', 'equalto', item.name) | list | first | default({})).uuid
            | default(item.uuid, true)):
           {'uuid': (((_director_custom_variables_before.stdout | from_json)
                      | selectattr('key_name', 'equalto', item.name) | list | first | default({})).uuid
                     | default(item.uuid, true)),
            'key_name': item.name,
            'parent_uuid': none,
            'value_type': item.type,
            'label': item.label | default(item.name),
            'description': item.description | default(''),
            'items': []}
         }} | to_json }}
  loop: "{{ director_managed_custom_variables | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _existing_custom_variable: >-
      {{ (_director_custom_variables_before.stdout | from_json)
         | selectattr('key_name', 'equalto', item.name) | list | first | default({}) }}
  when: >-
    (_existing_custom_variable | length == 0) or
    (_existing_custom_variable.value_type | default('') != item.type) or
    (_existing_custom_variable.label | default('') != (item.label | default(item.name))) or
    (_existing_custom_variable.description | default('') != (item.description | default('')))
  changed_when: true

- name: Validate Director service templates
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.name is regex('^[A-Za-z0-9_. -]+$')
      - item.check_command | default('') | length > 0
      - >-
        (item.vars | default({}) | dict2items | map(attribute='key') | list
         | difference(director_managed_custom_variables | default([])
                      | map(attribute='name') | list) | length) == 0
    fail_msg: >-
      Each Director service template requires a safe name/check_command and
      may only set variables declared in director_managed_custom_variables.
      Invalid entry: {{ item }}
  loop: "{{ director_managed_service_templates | default([]) }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"

- name: Upsert Director-managed service templates
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - icingaweb2
      - icingacli
      - director
      - service
      - set
      - "{{ item.name }}"
      - --auto-create
      - --json
    stdin: >-
      {{ {'object_type': 'template',
          'check_command': item.check_command,
          'display_name': item.display_name | default(item.name),
          'imports': item.imports | default([]),
          'vars': item.vars | default({})} | to_json }}
  loop: "{{ director_managed_service_templates | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _director_service_template_upsert
  changed_when: >-
    'has been created' in (_director_service_template_upsert.stdout | default('')) or
    'has been modified' in (_director_service_template_upsert.stdout | default(''))

# PUT on a template both attaches the typed custom-variable definitions and
# stores their defaults. Apply Rules importing this template then show proper
# editable fields in Director instead of an unstructured vars dictionary.
- name: Attach typed custom variables to Director service templates
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ icingaweb2_http_port }}/director/service/variables?name={{
      item.name | urlencode }}
    method: PUT
    url_username: "{{ icingaweb2_admin_user }}"
    url_password: "{{ icingaweb2_admin_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    body_format: json
    body: "{{ item.vars | default({}) }}"
    status_code: 200
  loop: "{{ director_managed_service_templates | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  no_log: true

- name: Validate Director Service Apply Rule definitions
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.check_command | default('') | length > 0
      - item.assign_filter | default('') | length > 0
      - item.name is regex('^[A-Za-z0-9_. -]+$')
    fail_msg: >-
      Each director_managed_service_apply_rules entry requires a safe name,
      check_command and Director assign_filter. Invalid entry: {{ item }}
  loop: "{{ director_managed_service_apply_rules | default([]) }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"

- name: Service Apply Rule names managed by Ansible must be unique
  ansible.builtin.assert:
    that:
      - >-
        (director_managed_service_apply_rules | default([]) | map(attribute='name') | unique | length)
        == (director_managed_service_apply_rules | default([]) | length)
      - >-
        (director_managed_services | default([]) | map(attribute='name') | list)
        | intersect(director_managed_service_apply_rules | default([]) | map(attribute='name') | list)
        | length == 0
      - >-
        (director_managed_services | default([]) | map(attribute='name') | list)
        | intersect(director_managed_direct_services_absent | default([]))
        | length == 0
      - >-
        (director_managed_service_templates | default([]) | map(attribute='name') | unique | length)
        == (director_managed_service_templates | default([]) | length)
    fail_msg: >-
      Director service names are duplicated, or a direct service is also
      declared as an Apply Rule/absent. Keep the three lists disjoint; Director
      permits ambiguous combinations that cannot be reconciled safely.

- name: Upsert Director-managed hosts
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - icingaweb2
      - icingacli
      - director
      - host
      - set
      - "{{ item.name }}"
      - --auto-create
      - --json
    stdin: >-
      {{ {'object_type': 'object',
          'address': item.address,
          'display_name': item.display_name | default(item.name),
          'check_command': item.check_command | default('hostalive'),
          'vars': item.vars | default({})}
         | to_json }}
  loop: "{{ director_managed_hosts | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: director_host_upsert
  changed_when: >-
    'has been created' in (director_host_upsert.stdout | default('')) or
    'has been modified' in (director_host_upsert.stdout | default(''))

# Kept for environments that intentionally need a service attached directly to
# every managed host. New shared checks should use Service Apply Rules below.
- name: Upsert Director-managed direct services on each host
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - icingaweb2
      - icingacli
      - director
      - service
      - set
      - "{{ item.1.name }}"
      - --host
      - "{{ item.0.name }}"
      - --auto-create
      - --json
    stdin: >-
      {{ {'object_type': 'object', 'host': item.0.name,
          'check_command': item.1.check_command,
          'display_name': item.1.display_name | default(item.1.name),
          'vars': item.1.vars | default({})} | to_json }}
  loop: >-
    {{ (director_managed_hosts | default([]))
       | product(director_managed_services | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.name }}"
  register: director_service_upsert
  changed_when: >-
    'has been created' in (director_service_upsert.stdout | default('')) or
    'has been modified' in (director_service_upsert.stdout | default(''))

- name: Read existing Director Service Apply Rules
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ icingaweb2_http_port }}/director/serviceapplyrules"
    method: GET
    url_username: "{{ icingaweb2_admin_user }}"
    url_password: "{{ icingaweb2_admin_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
    status_code: 200
  register: _director_apply_rules_before
  no_log: true
  when: (director_managed_service_apply_rules | default([]) | length) > 0

- name: Refuse ambiguous duplicate Service Apply Rules
  ansible.builtin.assert:
    that:
      - >-
        (_director_apply_rules_before.json.objects | default([])
         | selectattr('object_name', 'equalto', item.name) | list | length) <= 1
    fail_msg: >-
      Director already contains more than one Service Apply Rule named
      '{{ item.name }}'. Remove the duplicate rules by UUID before deploying.
  loop: "{{ director_managed_service_apply_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create missing Director Service Apply Rules
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ icingaweb2_http_port }}/director/service"
    method: POST
    url_username: "{{ icingaweb2_admin_user }}"
    url_password: "{{ icingaweb2_admin_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    body_format: json
    body: >-
      {{ {'object_name': item.name,
          'object_type': 'apply',
          'assign_filter': item.assign_filter,
          'check_command': item.check_command,
          'display_name': item.display_name | default(item.name),
          'imports': item.imports | default([]),
          'vars': item.vars | default({})} }}
    status_code: 201
  loop: "{{ director_managed_service_apply_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (_director_apply_rules_before.json.objects | default([])
     | selectattr('object_name', 'equalto', item.name) | list | length) == 0
  changed_when: true
  no_log: true

- name: Refresh Director Service Apply Rule UUIDs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ icingaweb2_http_port }}/director/serviceapplyrules"
    method: GET
    url_username: "{{ icingaweb2_admin_user }}"
    url_password: "{{ icingaweb2_admin_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
    status_code: 200
  register: _director_apply_rules_after
  no_log: true
  when: (director_managed_service_apply_rules | default([]) | length) > 0

- name: Each managed Service Apply Rule must resolve to exactly one UUID
  ansible.builtin.assert:
    that:
      - >-
        (_director_apply_rules_after.json.objects | default([])
         | selectattr('object_name', 'equalto', item.name) | list | length) == 1
    fail_msg: >-
      Service Apply Rule '{{ item.name }}' did not resolve to exactly one UUID
      after creation. Refusing an unsafe update.
  loop: "{{ director_managed_service_apply_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Reconcile Director Service Apply Rules by UUID
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ icingaweb2_http_port }}/director/service?uuid={{
      (_director_apply_rules_after.json.objects | default([])
       | selectattr('object_name', 'equalto', item.name) | first).uuid | urlencode }}
    method: PUT
    url_username: "{{ icingaweb2_admin_user }}"
    url_password: "{{ icingaweb2_admin_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    body_format: json
    body: >-
      {{ {'object_name': item.name,
          'object_type': 'apply',
          'assign_filter': item.assign_filter,
          'check_command': item.check_command,
          'display_name': item.display_name | default(item.name),
          'imports': item.imports | default([]),
          'vars': item.vars | default({})} }}
    status_code: [200, 304]
  loop: "{{ director_managed_service_apply_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _director_apply_rule_reconcile
  # Director 1.11 returns HTTP 200 even when PUT is byte-for-byte identical.
  # The subsequent config deploy reports whether rendered Icinga config changed.
  changed_when: false
  no_log: true

- name: Check legacy direct services selected for migration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - icingaweb2
      - icingacli
      - director
      - service
      - exists
      - "{{ item.1 }}"
      - --host
      - "{{ item.0.name }}"
  loop: >-
    {{ (director_managed_hosts | default([]))
       | product(director_managed_direct_services_absent | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  register: _director_legacy_service_exists
  changed_when: false
  failed_when: _director_legacy_service_exists.rc not in [0, 1]

- name: Remove legacy direct services replaced by Apply Rules
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - icingaweb2
      - icingacli
      - director
      - service
      - delete
      - "{{ item.item.1 }}"
      - --host
      - "{{ item.item.0.name }}"
  loop: "{{ _director_legacy_service_exists.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.name }}/{{ item.item.1 }}"
  when: item.rc == 0
  register: _director_legacy_service_delete
  changed_when: "'has been deleted' in (_director_legacy_service_delete.stdout | default(''))"

- name: Deploy Director configuration and wait for Icinga activation
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - icingaweb2
      - icingacli
      - director
      - config
      - deploy
      - --wait
      - "30"
  register: director_config_deploy
  changed_when: >-
    'nothing to do' not in (director_config_deploy.stdout | lower) and
    'matches last deployed one' not in (director_config_deploy.stdout | lower)

- name: Verify Director health after deployment
  ansible.builtin.command:
    argv: [docker, exec, icingaweb2, icingacli, director, health, check]
  register: director_health
  changed_when: false
