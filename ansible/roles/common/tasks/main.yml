---
# Role common: bootstrap host (Docker, chrony) + chuẩn bị thư mục & mạng docker.
# - Việc cài đặt gắn tag 'bootstrap' (chạy khi bootstrap-servers).
# - Việc chuẩn bị dir/network chạy cả trong deploy.

# ---------- BOOTSTRAP: cài gói nền ----------
- name: (bootstrap) Kiểm tra OS được hỗ trợ
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version in ["24.04", "26.04"]
    fail_msg: "Chỉ hỗ trợ Ubuntu 24.04 / 26.04 (đang: {{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Chặn biến proxy cũ để tránh cấu hình bị bỏ qua âm thầm
  ansible.builtin.assert:
    that:
      - proxy_http is not defined
      - proxy_https is not defined
      - proxy_no_proxy is not defined
      - proxy_group_overrides is not defined
    fail_msg: >-
      Proxy đã đổi sang thiết kế Kolla-Ansible. Hãy đổi proxy_http/proxy_https/proxy_no_proxy
      thành docker_http_proxy/docker_https_proxy/docker_no_proxy và xoá proxy_group_overrides.
      Ba biến mới chỉ cấu hình Docker Engine pull image.
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Kiểm tra Docker Engine proxy
  ansible.builtin.assert:
    that:
      - docker_http_proxy is string
      - docker_https_proxy is string
      - docker_no_proxy is string
      - >-
        (docker_http_proxy | length == 0) or
        (docker_http_proxy is match('^https?://[^\\s]+$'))
      - >-
        (docker_https_proxy | length == 0) or
        (docker_https_proxy is match('^https?://[^\\s]+$'))
      - "'\\n' not in docker_no_proxy"
      - "'\\r' not in docker_no_proxy"
    fail_msg: >-
      docker_http_proxy/docker_https_proxy phải rỗng hoặc là URL http(s) không chứa khoảng trắng;
      docker_no_proxy phải là chuỗi phân cách bằng dấu phẩy.
  tags: [bootstrap, docker_proxy]

# Remove files managed by the pre-Kolla-style implementation. Operator-owned
# proxy configuration outside these exact files/markers is left untouched.
- name: (bootstrap) Kiểm tra /etc/environment legacy
  ansible.builtin.stat:
    path: /etc/environment
  register: _legacy_system_environment
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Gỡ block proxy hệ thống do phiên bản cũ quản lý
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} icinga-ansible proxy"
    state: absent
  when: _legacy_system_environment.stat.exists
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Gỡ proxy APT và Ubuntu Pro do phiên bản cũ quản lý
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/90icinga-ansible-proxy
    - /etc/systemd/system/esm-cache.service.d/http-proxy.conf
  notify: Reload systemd daemon
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Cài chrony + phụ thuộc Docker
  ansible.builtin.apt:
    name: [chrony, ca-certificates, curl, gnupg, python3-docker]
    update_cache: true
    lock_timeout: 300
    state: present
  register: _bootstrap_base_packages_result
  retries: 8
  delay: 10
  until: _bootstrap_base_packages_result is succeeded
  tags: [bootstrap]

- name: (bootstrap) Bật & khởi động chrony (đồng bộ giờ — bắt buộc)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  tags: [bootstrap]

- name: (bootstrap) Kiểm tra Docker đã cài chưa
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Ghi nhận container đang chạy trước khi đổi Docker proxy
  ansible.builtin.command:
    argv: [docker, ps, --format, "{{ '{{.Names}}' }}"]
  register: _docker_running_containers_before_proxy
  changed_when: false
  failed_when: false
  when: docker_check.rc == 0
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Tạo thư mục drop-in docker.service.d
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Cấu hình Docker Engine proxy như Kolla-Ansible
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      [Service]
      Environment={{ ('HTTP_PROXY=' ~ docker_http_proxy) | to_json }}
      Environment={{ ('HTTPS_PROXY=' ~ docker_https_proxy) | to_json }}
      Environment={{ ('NO_PROXY=' ~ docker_no_proxy) | to_json }}
  when: >-
    (docker_http_proxy | default('') | length > 0) or
    (docker_https_proxy | default('') | length > 0)
  notify:
    - Reload systemd daemon
    - Restart docker
    - Restore containers running before Docker restart
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Gỡ Docker Engine proxy khi đã tắt trong globals.yml
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/http-proxy.conf
    state: absent
  when:
    - (docker_http_proxy | default('') | length) == 0
    - (docker_https_proxy | default('') | length) == 0
  notify:
    - Reload systemd daemon
    - Restart docker
    - Restore containers running before Docker restart
  tags: [bootstrap, docker_proxy]

- name: (bootstrap) Cài Docker Engine (bỏ qua nếu đã có)
  when: docker_check.rc != 0
  block:
    - name: Tạo thư mục keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    - name: Tải khoá GPG Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      register: _bootstrap_docker_key_result
      retries: 8
      delay: 10
      until: _bootstrap_docker_key_result is succeeded
    - name: Khai báo repo Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      register: _bootstrap_docker_repo_result
      retries: 8
      delay: 10
      until: _bootstrap_docker_repo_result is succeeded
    - name: Cài Docker Engine
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true
        lock_timeout: 300
        state: present
      register: _bootstrap_docker_packages_result
      retries: 8
      delay: 10
      until: _bootstrap_docker_packages_result is succeeded
    - name: Bật & khởi động Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
  tags: [bootstrap]

# Registry nội bộ thường dùng CA doanh nghiệp hoặc certificate tự ký. Docker không dùng trust store
# của deployment node; CA phải có trên từng daemon ở đúng certs.d/<host[:port]>/ca.crt.
- name: (bootstrap) Kiểm tra file CA registry trên deployment node
  ansible.builtin.stat:
    path: "{{ docker_registry_ca_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: _docker_registry_ca_source
  when: (docker_registry_ca_file | default('') | length) > 0
  tags: [bootstrap]

- name: (bootstrap) Chặn sớm nếu CA hoặc registry chưa được khai đúng
  ansible.builtin.assert:
    that:
      - _docker_registry_ca_source.stat.exists | default(false)
      - _docker_registry_ca_source.stat.isreg | default(false)
      - (custom_image_registry | default('') | length) > 0 or (docker_registry | default('') | length) > 0
    fail_msg: >-
      docker_registry_ca_file phải trỏ tới file CA có thật trên deployment node và cần khai
      custom_image_registry hoặc docker_registry.
  run_once: true
  when: (docker_registry_ca_file | default('') | length) > 0
  tags: [bootstrap]

- name: (bootstrap) Tạo thư mục CA cho registry trên Docker daemon
  ansible.builtin.file:
    path: "/etc/docker/certs.d/{{ ((custom_image_registry | default('')) or (docker_registry | default(''))).split('/')[0] }}"
    state: directory
    mode: "0755"
  when: (docker_registry_ca_file | default('') | length) > 0
  tags: [bootstrap]

- name: (bootstrap) Cài CA registry cho Docker daemon
  ansible.builtin.copy:
    src: "{{ docker_registry_ca_file }}"
    dest: "/etc/docker/certs.d/{{ ((custom_image_registry | default('')) or (docker_registry | default(''))).split('/')[0] }}/ca.crt"
    mode: "0644"
  notify: Restart docker
  when: (docker_registry_ca_file | default('') | length) > 0
  tags: [bootstrap]

# ---------- PREP: thư mục state & mạng ----------
# Trước đây tag [bootstrap, deploy] — CỐ Ý cho "deploy" tự chạy kèm phòng khi quên bootstrap-servers.
# Đã bỏ "deploy" (2026-07-22, theo yêu cầu người dùng — tách hẳn 2 lệnh, xem icinga-ansible.yml đầu
# play "Bootstrap servers & prepare hosts") — "deploy" giờ giả định host ĐÃ bootstrap-servers.
- name: Tạo thư mục state cho từng service
  ansible.builtin.file:
    path: "{{ icinga_base_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - icinga2/etc
    - icinga2/var
    - icinga2/pki
    - icingadb-redis
    - icingadb
    - icingaweb2
    - mariadb
  tags: [bootstrap]
