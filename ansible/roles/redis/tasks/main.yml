---
# Role redis: icingadb-redis (Redis bản Icinga). Chỉ chạy trên master.
# Icinga 2 (feature icingadb) ghi runtime vào đây; icingadb daemon đọc ra.

- name: Tạo thư mục data và cây config Redis chính thức
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    # Official Redis image chạy daemon bằng uid/gid 999 sau entrypoint.
    owner: "999"
    group: "999"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ icinga_base_dir }}/icingadb-redis", mode: "0750" }
    - { path: "{{ icinga_etc_dir }}/icingadb-redis", mode: "0750" }

- name: Đọc cấu hình Redis container hiện tại trước secret rotation
  community.docker.docker_container_info:
    name: icingadb-redis
  register: _redis_current
  no_log: true

- name: Render Redis config
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ icinga_etc_dir }}/icingadb-redis/redis.conf"
    owner: "999"
    group: "999"
    mode: "0600"
  no_log: true

- name: Tính checksum Redis config
  ansible.builtin.stat:
    path: "{{ icinga_etc_dir }}/icingadb-redis/redis.conf"
    checksum_algorithm: sha256
  register: _redis_config_stat
  no_log: true

# Container cũ truyền password bằng command; container mới dùng fingerprint của file config.
# Chấp nhận cả hai dạng để lần migrate đầu không dừng đồng thời consumer không cần thiết.
- name: Xác định Redis hiện tại có tương thích config đích không
  ansible.builtin.set_fact:
    _redis_config_compatible: >-
      {{ (not (_redis_current.exists | default(false))) or
         (icingadb_redis_password in (_redis_current.container.Config.Cmd | default([]))) or
         (('ICINGA_ANSIBLE_CONFIG_FINGERPRINT=' ~ _redis_config_stat.stat.checksum) in
          (_redis_current.container.Config.Env | default([]))) }}
  no_log: true

- name: Dừng consumer Redis trước khi rotate credential
  ansible.builtin.command:
    argv: [docker, stop, icinga2, icingadb, icingaweb2]
  register: _redis_consumers_stopped_for_rotation
  changed_when: _redis_consumers_stopped_for_rotation.stdout | trim | length > 0
  failed_when: false
  when:
    - _redis_current.exists | default(false)
    - not _redis_config_compatible

- name: Khởi động container icingadb-redis (host network)
  community.docker.docker_container:
    name: icingadb-redis
    image: "{{ images.icingadb_redis }}"
    # docker_container so sánh image ID. Hai tag trỏ cùng một digest (vd 7.4 và
    # 7.4.11) sẽ không recreate, khiến Config.Image vẫn giữ tag nổi cũ và
    # upgrade-plan báo ĐỔI mãi. Recreate một lần khi tên image mục tiêu đổi để
    # trạng thái runtime phản ánh đúng version đã pin trong globals.yml.
    recreate: >-
      {{ (_redis_current.exists | default(false)) and
         ((_redis_current.container.Config.Image | default('')) != images.icingadb_redis) }}
    state: started
    restart_policy: unless-stopped
    network_mode: host
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    volumes:
      - "{{ icinga_base_dir }}/icingadb-redis:/data:rw"
      - "{{ icinga_etc_dir }}/icingadb-redis:/usr/local/etc/redis:rw"
    env:
      ICINGA_ANSIBLE_CONFIG_FINGERPRINT: "{{ _redis_config_stat.stat.checksum }}"
    comparisons:
      volumes: strict
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "{{ icingadb_redis_port | string }}", "-a", "{{ icingadb_redis_password }}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
  no_log: true

- name: Chờ Redis phản hồi PING
  ansible.builtin.command: >
    docker exec -e REDISCLI_AUTH icingadb-redis redis-cli -p {{ icingadb_redis_port }} ping
  environment:
    REDISCLI_AUTH: "{{ icingadb_redis_password }}"
  register: redis_ping
  retries: 10
  delay: 3
  until: redis_ping.stdout is defined and 'PONG' in redis_ping.stdout
  changed_when: false
  no_log: true
