[defaults]
roles_path = ./roles
inventory = ./inventory/all-in-one
# Production-safe mặc định: không im lặng tin host key mới/đã thay đổi. Lab tạm thời có thể override
# bằng ANSIBLE_HOST_KEY_CHECKING=False, nhưng inventory production phải quản lý known_hosts.
host_key_checking = True
retry_files_enabled = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/icinga-ansible-facts
deprecation_warnings = False
# Collections do tools/setup-venv cài riêng cho project. Giữ các path chuẩn phía sau để
# ansible.builtin và collection do operator chủ động bổ sung vẫn được tìm thấy.
collections_path = ./.collections:~/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
