[defaults]
roles_path = ./roles
inventory = ./inventory/all-in-one
# Production-safe mặc định: không im lặng tin host key mới/đã thay đổi. Lab tạm thời có thể override
# bằng ANSIBLE_HOST_KEY_CHECKING=False, nhưng inventory production phải quản lý known_hosts.
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/icinga-ansible-facts
deprecation_warnings = False
# collections_path: để mặc định (dùng collection hệ thống/apt hoặc ~/.ansible).
# Nếu cài riêng vào repo: ansible-galaxy collection install -r requirements.yml -p ./.collections
# rồi bỏ comment dòng dưới.
# collections_path = ./.collections

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
