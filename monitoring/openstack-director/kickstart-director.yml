---
- name: One-time Director kickstart on the CA master
  hosts: "{{ groups['master'] | first }}"
  gather_facts: false
  become: true
  vars_files:
    - /etc/icinga-ansible/globals.yml
    - /etc/icinga-ansible/passwords.yml
  vars:
    kickstart_path: /var/lib/icinga-ansible/icingaweb2/data/etc/icingaweb2/modules/director/kickstart.ini
  tasks:
    - name: Kickstart Director without retaining its API credential
      block:
        - name: Create the temporary Director kickstart file
          ansible.builtin.copy:
            dest: "{{ kickstart_path }}"
            owner: "33"
            group: "33"
            mode: "0600"
            content: |
              [config]
              endpoint = "{{ inventory_hostname }}"
              host = "{{ ansible_host }}"
              port = "{{ icinga2_api_port | default(5665) }}"
              username = "director"
              password = {{ icinga2_director_api_user_password | to_json }}
          no_log: true

        - name: Import live endpoints, zones, and commands into Director
          ansible.builtin.command:
            argv: [docker, exec, icingaweb2, icingacli, director, kickstart, run]
          changed_when: true
          no_log: true
      always:
        - name: Remove the temporary Director API credential
          ansible.builtin.file:
            path: "{{ kickstart_path }}"
            state: absent
          no_log: true

    - name: Confirm that Director imported the CA endpoint
      ansible.builtin.command:
        argv: [docker, exec, icingaweb2, icingacli, director, endpoint, show, "{{ inventory_hostname }}", --json]
      changed_when: false
