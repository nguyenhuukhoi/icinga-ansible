/* Low-level manual override example. Normally set openstack_service_checks in globals.yml and let
 * icinga-ansible render these objects. Credentials are selected by vars.openstack_cloud and read
 * from the separately managed, mode-0600 clouds.yaml file. */
object Host "openstack-devstack" {
  address = "172.28.81.101"
  check_command = "dummy"
  zone = "master"
  vars.dummy_state = 0
  vars.dummy_text = "OpenStack API target"
  vars.openstack_cloud = "devstack"
}

apply Service "openstack-compute-services" {
  check_command = "check_openstack_services"
  zone = "master"
  vars.openstack_service_type = "compute"
  check_interval = 1m
  retry_interval = 30s
  assign where host.name == "openstack-devstack"
}

apply Service "openstack-network-agents" {
  check_command = "check_openstack_services"
  zone = "master"
  vars.openstack_service_type = "network"
  check_interval = 1m
  retry_interval = 30s
  assign where host.name == "openstack-devstack"
}

apply Service "openstack-volume-services" {
  check_command = "check_openstack_services"
  zone = "master"
  vars.openstack_service_type = "volume"
  check_interval = 1m
  retry_interval = 30s
  assign where host.name == "openstack-devstack"
}
