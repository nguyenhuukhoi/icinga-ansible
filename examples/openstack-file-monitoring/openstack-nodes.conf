/* Optional node-level checks executed over SSH with Linuxfabrik plugins.
 * Install on the CA/config master in zones.d/<ZoneName>; Icinga syncs it to the peer master.
 */

object Host "openstack-controller01" {
  address = "172.28.81.101"
  check_command = "tcp"
  vars.tcp_port = 22
  vars.openstack_node = true
}

object Host "openstack-controller02" {
  address = "172.28.81.102"
  check_command = "tcp"
  vars.tcp_port = 22
  vars.openstack_node = true
}

object Host "openstack-controller03" {
  address = "172.28.81.103"
  check_command = "tcp"
  vars.tcp_port = 22
  vars.openstack_node = true
}

object Host "openstack-compute01" {
  address = "172.28.81.104"
  check_command = "tcp"
  vars.tcp_port = 22
  vars.openstack_node = true
}

object Host "openstack-compute02" {
  address = "172.28.81.105"
  check_command = "tcp"
  vars.tcp_port = 22
  vars.openstack_node = true
}

object Host "openstack-compute03" {
  address = "172.28.81.106"
  check_command = "tcp"
  vars.tcp_port = 22
  vars.openstack_node = true
}

template Service "openstack-ssh-check" {
  check_command = "by_ssh"
  retry_interval = 20s
  max_check_attempts = 3
  vars.by_ssh_logname = "icinga-monitor"
  vars.by_ssh_identity = "/data/etc/icinga2/ssh/id_monitor"
  vars.by_ssh_options = [
    "BatchMode=yes",
    "IdentitiesOnly=yes",
    "StrictHostKeyChecking=yes",
    "UserKnownHostsFile=/data/etc/icinga2/ssh/known_hosts"
  ]
  vars.by_ssh_timeout = 45
}

apply Service "CPU usage" {
  import "openstack-ssh-check"
  check_interval = 1m
  vars.by_ssh_command = "/usr/lib64/nagios/plugins/cpu-usage -w 80 -c 90"
  assign where host.vars.openstack_node
}

apply Service "RAM usage" {
  import "openstack-ssh-check"
  check_interval = 1m
  vars.by_ssh_command = "/usr/lib64/nagios/plugins/memory-usage -w 90 -c 95"
  assign where host.vars.openstack_node
}

apply Service "Disk usage" {
  import "openstack-ssh-check"
  check_interval = 5m
  retry_interval = 30s
  vars.by_ssh_command = "/usr/lib64/nagios/plugins/disk-usage -w 90 -c 95"
  assign where host.vars.openstack_node
}
