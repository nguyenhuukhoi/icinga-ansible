/* Static OpenStack API monitoring. No Director and no deployment-node zones.d sync.
 * Install on the CA/config master in zones.d/<ZoneName>; Icinga syncs it to the peer master.
 */

object CheckCommand "openstack-service-api" {
  command = [
    "/opt/icinga-venv/bin/python3",
    "/usr/lib/nagios/custom-plugins/check_openstack_service.py"
  ]
  arguments = {
    "-c" = "$openstack_cloud$"
    "-s" = "$openstack_service_kind$"
  }
  timeout = 45s
}

object Host "openstack-api" {
  address = "172.28.81.100"
  check_command = "tcp"
  vars.tcp_port = 5000
}

object Service "OpenStack Nova services" {
  host_name = "openstack-api"
  check_command = "openstack-service-api"
  check_interval = 2m
  retry_interval = 30s
  max_check_attempts = 3
  vars.openstack_cloud = "openstack"
  vars.openstack_service_kind = "nova"
}

object Service "OpenStack Cinder services" {
  host_name = "openstack-api"
  check_command = "openstack-service-api"
  check_interval = 2m
  retry_interval = 30s
  max_check_attempts = 3
  vars.openstack_cloud = "openstack"
  vars.openstack_service_kind = "cinder"
}

object Service "OpenStack Neutron agents" {
  host_name = "openstack-api"
  check_command = "openstack-service-api"
  check_interval = 2m
  retry_interval = 30s
  max_check_attempts = 3
  vars.openstack_cloud = "openstack"
  vars.openstack_service_kind = "neutron"
}
